<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澳門新聞週報 | Sean Own</title>
<meta name="description" content="澳門新聞週報——每週一彙整上週澳門本地新聞，涵蓋時政、經濟民生、社會文化、旅遊盛事、中葡平台、大灣區與全球 AI 精選。過往期數永久存檔，可逐期回看。">
<link rel="canonical" href="https://seanown.org/macau-weekly.html">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: #F5F2EC;
    font-family: 'Noto Serif TC', 'Source Han Serif', 'PingFang TC', 'Microsoft JhengHei', serif;
    color: #1A1A1A;
    overflow: hidden;
  }

  /* ===== HEADER ===== */
  .wk-header {
    background: #0B3D2E;
    color: #fff;
    padding: 24px 20px 18px;
    position: relative;
    flex: none;
  }
  .wk-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #C75B12, #B8860B, #C75B12);
  }
  .wk-header-inner { max-width: 960px; margin: 0 auto; }
  .wk-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #F0A050;
    border: 1px solid #F0A050;
    padding: 3px 10px;
    border-radius: 2px;
    margin-bottom: 10px;
  }
  .wk-header h1 {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1.25;
  }
  .wk-meta {
    font-size: 13px;
    color: rgba(255,255,255,0.72);
    margin-top: 6px;
    letter-spacing: 0.5px;
  }
  .wk-range {
    font-size: 17px;
    font-weight: 500;
    color: #fff;
    margin-top: 2px;
    letter-spacing: 1px;
  }

  /* ===== ARCHIVE NAV ===== */
  .wk-archive {
    background: #fff;
    border-bottom: 1px solid #E0DDD5;
    flex: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.045);
    position: relative;
    z-index: 2;
  }
  .wk-archive-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .wk-archive-label {
    font-size: 12px;
    color: #888;
    letter-spacing: 1.5px;
    flex: none;
    white-space: nowrap;
  }
  .wk-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 2px 0;
    flex: 1;
  }
  .wk-chips::-webkit-scrollbar { display: none; }
  .wk-chip {
    flex: none;
    padding: 5px 13px;
    border: 1px solid #E0DDD5;
    border-radius: 20px;
    background: #fff;
    color: #4A4A4A;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.18s ease;
    text-decoration: none;
    line-height: 1.3;
    text-align: center;
    font-family: inherit;
  }
  .wk-chip:hover { border-color: #C75B12; color: #C75B12; }
  .wk-chip.cur {
    background: #0B3D2E;
    border-color: #0B3D2E;
    color: #fff;
  }
  .wk-chip .d {
    display: block;
    font-size: 10px;
    opacity: 0.68;
    letter-spacing: 0.5px;
    margin-top: 1px;
  }
  .wk-chip.cur .d { opacity: 0.8; }

  /* ===== FRAME ===== */
  #wkFrame {
    flex: 1;
    width: 100%;
    border: 0;
    display: block;
    background: #F5F2EC;
  }

  @media (max-width: 640px) {
    .wk-header { padding: 16px 16px 13px; }
    .wk-header h1 { font-size: 21px; letter-spacing: 1px; }
    .wk-tag { font-size: 10px; letter-spacing: 2px; margin-bottom: 7px; }
    .wk-meta { font-size: 12px; }
    .wk-range { font-size: 15px; }
    .wk-archive-inner { padding: 8px 16px; gap: 8px; }
    .wk-archive-label { display: none; }
    .wk-chip { padding: 5px 11px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="wk-header">
  <div class="wk-header-inner">
    <span class="wk-tag">Macau Weekly Digest</span>
    <h1>澳門新聞週報</h1>
    <div class="wk-meta" id="wkMeta">第 37 期 · 2026年9月7日（週一）出報</div>
    <div class="wk-range" id="wkRange">08.31 — 09.06</div>
  </div>
</div>

<div class="wk-archive">
  <div class="wk-archive-inner">
    <span class="wk-archive-label">期數存檔</span>
    <div class="wk-chips" id="wkChips"></div>
  </div>
</div>

<iframe id="wkFrame" src="macau-weekly/2026-09-07.html" title="澳門新聞週報內容"></iframe>

<script>
/* ============================================================
   期數登記表 —— 每產出一期，在陣列最上方加一行即可
   格式：{ d: '出報日 YYYY-MM-DD', no: 期號, range: '統計週 MM.DD — MM.DD' }
   順序：最新在上
   ============================================================ */
const WEEKS = [
  { d: '2026-09-28', no: 40, range: '09.21 — 09.27' },
  { d: '2026-09-21', no: 39, range: '09.14 — 09.20' },
  { d: '2026-09-14', no: 38, range: '09.07 — 09.13' },
  { d: '2026-09-07', no: 37, range: '08.31 — 09.06' }
];

var frame = document.getElementById('wkFrame');
var metaEl = document.getElementById('wkMeta');
var rangeEl = document.getElementById('wkRange');
var chipsEl = document.getElementById('wkChips');

function fmtDate(d) {
  var p = d.split('-');
  return p[0] + '年' + parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
}

function load(d, pushState) {
  var w = null;
  for (var i = 0; i < WEEKS.length; i++) { if (WEEKS[i].d === d) { w = WEEKS[i]; break; } }
  if (!w) { w = WEEKS[0]; }

  frame.src = 'macau-weekly/' + w.d + '.html';
  metaEl.textContent = '第 ' + w.no + ' 期 · ' + fmtDate(w.d) + '（週一）出報';
  rangeEl.textContent = w.range;

  var kids = chipsEl.children;
  for (var j = 0; j < kids.length; j++) {
    if (kids[j].dataset) { kids[j].classList.toggle('cur', kids[j].dataset.d === w.d); }
  }

  if (pushState !== false) {
    try { history.replaceState(null, '', '?p=' + w.d); } catch (e) { /* file:// 下忽略 */ }
  }
  document.title = '澳門新聞週報 第 ' + w.no + ' 期 | Sean Own';
}

WEEKS.forEach(function (w) {
  var a = document.createElement('a');
  a.className = 'wk-chip';
  a.dataset.d = w.d;
  a.href = '?p=' + w.d;
  a.innerHTML = '第 ' + w.no + ' 期<span class="d">' + w.range + '</span>';
  a.onclick = function (e) { e.preventDefault(); load(w.d); };
  chipsEl.appendChild(a);
});

var initial = '';
try { initial = new URLSearchParams(location.search).get('p') || ''; } catch (e) { initial = ''; }
load(initial || WEEKS[0].d, false);

/* 供 index.html 全螢幕閱讀時，允許外部指定期數 */
window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'weekly-load' && e.data.date) { load(e.data.date); }
});
</script>

</body>
</html>
