東吳","e":"水","a":7600,"d":6600,"ev":0,"art":"img/s1/card_SANK-P-R-207.webp","intro":"周處，字子隱，東吳吳郡陽羨人。","full":"周處（ㄔㄨˇ）（236年—297年2月12日），字子隱。東吳吳郡陽羨（今江蘇宜興）人，鄱陽太守周魴之子。周處年少時縱情肆慾，為禍鄉里，後來浪子回頭，改過自新，功業更勝乃父，留下「周處除三害」的傳說。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-207"},{"i":"SANK-P-R-257","pid":"53197031401897123485","h":"和洽","s":"和洽","cat":"人物","sub":"文官","y":"R","fac":"東吳","e":"水","a":7700,"d":6700,"ev":0,"art":"img/s1/card_SANK-P-C-257.webp","intro":"和洽，字陽士，汝南郡西平人","full":"和洽（2世紀?—3世紀?），字陽士，汝南郡西平人。東漢末及三國時曹魏官員。官至光祿勳、太常。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-257"},{"i":"SANK-P-R-261","pid":"54845327410998209916","h":"嚴白虎","s":"严白虎","cat":"人物","sub":"其他","y":"R","fac":"晉","e":"土","a":7300,"d":7400,"ev":0,"art":"img/s1/card_SANK-P-C-261.webp","intro":"嚴虎，字白虎，以字行，吳郡烏程縣人","full":"嚴虎，字白虎，以字行，吳郡烏程縣人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-261"},{"i":"SANK-P-R-109","pid":"06827607219681277824","h":"國淵","s":"国渊","cat":"人物","sub":"文官","y":"R","fac":"蜀漢","e":"木","a":6400,"d":7000,"ev":0,"art":"img/s1/card_SANK-P-R-109.webp","intro":"國淵，字子尼，樂安郡益縣人，三國時期曹魏官吏","full":"國淵，字子尼，樂安郡益縣人，三國時期曹魏官吏。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-109"},{"i":"SANK-P-R-499","pid":"70464751919650352346","h":"士壹","s":"士壹","cat":"人物","sub":"文官","y":"R","fac":"東吳","e":"水","a":6700,"d":6900,"ev":0,"art":"img/s1/card_SANK-P-R-160.webp","intro":"士壹，蒼梧廣信人，東漢政治人物","full":"士壹，蒼梧廣信人，東漢政治人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-499"},{"i":"SANK-P-R-149","pid":"09839113028009524062","h":"士孫瑞","s":"士孙瑞","cat":"人物","sub":"","y":"R","fac":"群雄","e":"土","a":6200,"d":6500,"ev":0,"art":"img/s1/card_SANK-P-R-149.webp","intro":"尚書令，誅董卓參與者","full":"士孫瑞（？—195年），字君榮（《後漢書》作君策），東漢扶風（今陝西興平東南）人。曾和王允計劃刺殺董卓。興平二年（195年）在保護漢獻帝時被亂軍殺害。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-149"},{"i":"SANK-P-R-24","pid":"32171972039638102378","h":"士燮","s":"士燮","cat":"人物","sub":"","y":"R","fac":"群雄","e":"土","a":6600,"d":7000,"ev":0,"art":"img/s1/card_SANK-P-R-24.webp","intro":"交趾太守，割據數十年","full":"士燮可以指： 士燮 (春秋)，晉國范氏第二代宗主。 士燮 (三國)，漢末三國交州軍閥。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-24"},{"i":"SANK-P-R-200","pid":"40827308310999880956","h":"夏侯和","s":"夏侯和","cat":"人物","sub":"文官","y":"R","fac":"群雄","e":"土","a":7000,"d":6900,"ev":0,"art":"img/s1/card_SANK-P-R-200.webp","intro":"夏侯和，字義權，沛國譙縣人，三國時魏、晉官員，為夏侯淵第七子","full":"夏侯和，字義權，沛國譙縣人，三國時魏、晉官員，為夏侯淵第七子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-200"},{"i":"SANK-P-R-128","pid":"77056252564511420715","h":"夏侯威","s":"夏侯威","cat":"人物","sub":"武將","y":"R","fac":"東吳","e":"水","a":7400,"d":7300,"ev":0,"art":"img/s1/card_SANK-P-R-128.webp","intro":"夏侯威（201年？—249年？）","full":"夏侯威（201年？—249年？）","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-128"},{"i":"SANK-P-R-19","pid":"40282789776156363729","h":"夏侯尚","s":"夏侯尚","cat":"人物","sub":"武將","y":"R","fac":"曹魏","e":"火","a":7300,"d":7500,"ev":0,"art":"img/s1/card_SANK-P-R-19.webp","intro":"夏侯尚，字伯仁，曹丕時期的重臣。","full":"夏侯尚（2世紀？—226年），字伯仁，三國時代曹魏武將，曹丕時期的重臣，官拜征南大將軍領荊州牧，長年負責戍守荊北軍區防線。曹魏名將夏侯淵的侄子，亦是魏國前中期夏侯家棟梁，受曹丕信賴程度甚至遠高於其堂哥們。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-19"},{"i":"SANK-P-R-270","pid":"98505943275868253378","h":"夏侯徽","s":"夏侯徽","cat":"人物","sub":"君主宗室","y":"R","fac":"晉","e":"土","a":6600,"d":7600,"ev":0,"art":"img/s1/card_SANK-P-C-270.webp","intro":"夏侯徽，字媛容，司馬師元配","full":"夏侯徽（211年—234年），字媛容，司馬師元配。父親是曹魏的征南大將軍夏侯尚，母親曹氏是曹魏重臣曹真之妹德陽鄉主。婚後與司馬師生有五個女兒。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-270"},{"i":"SANK-P-R-57","pid":"68713009614692949556","h":"夏侯氏","s":"夏侯氏","cat":"人物","sub":"","y":"R","fac":"曹魏","e":"火","a":6100,"d":6300,"ev":0,"art":"img/s1/card_SANK-P-C-57.webp","intro":"夏侯氏，夏侯淵之女，張飛之妻。","full":"夏侯姓是中國姓氏之一，屬複姓，在百家姓中排第413位。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-57"},{"i":"SANK-P-R-161","pid":"40614460876080505622","h":"太史享","s":"太史享","cat":"人物","sub":"武將","y":"R","fac":"東吳","e":"水","a":7300,"d":7100,"ev":0,"art":"img/s1/card_SANK-P-R-161.webp","intro":"太史享，字元復，三國時代東吳武將，為東漢末年將領太史慈之子。","full":"太史享，字元復（？—？），三國時代東吳武將，為東漢末年將領太史慈之子。其父於建安十一年逝世，父親死後太史享繼續輔佐孫權，歷任尚書、吳郡太守，官至越騎校尉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-161"},{"i":"SANK-P-R-120","pid":"68799558285478295696","h":"姜敘","s":"姜叙","cat":"人物","sub":"武將","y":"R","fac":"東吳","e":"水","a":6700,"d":6800,"ev":0,"art":"img/s1/card_SANK-P-R-120.webp","intro":"姜敘，字伯奕，天水郡人。","full":"姜敘（？—？），字伯奕，天水郡人，東漢末年的人物，母親楊氏是楊阜的姑母，姜敘自小與表弟楊阜一起成長。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-120"},{"i":"SANK-E-T-R-002","pid":"55615858715990747223","h":"孝經","s":"孝经","cat":"書籍","sub":"經書","y":"R","fac":"","e":"","a":null,"d":150,"ev":null,"art":"img/s1/card_SANK-E-T-R-002.webp","intro":"《孝經》是儒家講授孝道的書。","full":"《孝經》是儒家講授孝道的書，全書一千八百多字，為十三經中篇幅最短者，但依然為一本獨立的經書。可見儒家對孝道的重視程度，視之神聖，故孝經在古代亦常獲賦予宗教意味，而用於祈禱，驅邪，治病等。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-R-002"},{"i":"SANK-P-R-199","pid":"75422535701499705528","h":"孟建","s":"孟建","cat":"人物","sub":"其他","y":"R","fac":"群雄","e":"土","a":6600,"d":7000,"ev":0,"art":"img/s1/card_SANK-P-R-199.webp","intro":"孟建，字公威，汝南人，仕魏，官至涼州刺史、征東將軍。","full":"孟建（？—？），字公威，汝南人，仕魏，官至涼州刺史、征東將軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-199"},{"i":"SANK-P-R-59","pid":"97821281354551190892","h":"孫休","s":"孙休","cat":"人物","sub":"君主宗室","y":"R","fac":"曹魏","e":"火","a":6700,"d":7100,"ev":0,"art":"img/s1/card_SANK-P-R-59.webp","intro":"吳景帝孫休，字子烈，在父親孫權、弟孫亮後繼任為吳國皇帝。","full":"吳景帝孫休（235年—264年9月3日），字子烈，為孫權第六子，在父親孫權、弟孫亮後繼任為吳國皇帝，在位六年。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-59"},{"i":"SANK-P-R-64","pid":"76204635825148075916","h":"孫和","s":"孙和","cat":"人物","sub":"君主宗室","y":"R","fac":"蜀漢","e":"木","a":6700,"d":6600,"ev":0,"art":"img/s1/card_SANK-P-R-64.webp","intro":"吳文帝孫和，字子孝，也是吳國最後一位皇帝孫皓的父親。","full":"吳文帝孫和（224年—253年），字子孝，是中國三國時期吳國第一位皇帝孫權的第三子，也是吳國最後一位皇帝孫皓的父親。他曾被立為太子，但後來因為二宮之爭被罷黜，最後更被賜死。長子孫皓後來登基為帝，諡其為文皇帝。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-64"},{"i":"SANK-P-R-144","pid":"44173123880406341760","h":"孫壹","s":"孙壹","cat":"人物","sub":"君主宗室","y":"R","fac":"東吳","e":"水","a":7200,"d":7100,"ev":0,"art":"img/s1/card_SANK-P-R-144.webp","intro":"孫壹，中國三國時代東吳同時期有兩位同姓名的皇族","full":"孫壹，中國三國時代東吳同時期有兩位同姓名的皇族。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-144"},{"i":"SANK-P-R-37","pid":"07194793651468395666","h":"孫瑜","s":"孙瑜","cat":"人物","sub":"","y":"R","fac":"東吳","e":"水","a":7300,"d":7500,"ev":0,"art":"img/s1/card_SANK-P-R-37.webp","intro":"宗室將領，好學愛士","full":"孫瑜可以指： 孫瑜 (三國)，三國時期的人物，孫靜之子 孫瑜 (北宋)，北宋時期的人物 孫瑜 (天順進士)，明朝官員 孫瑜 (1957年)，曾任廣西壯族自治區副主席，貪污罪犯 孫瑜 (導演)，中國導演 孫瑜 (羽毛球運動員)，中國女子羽毛球。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-37"},{"i":"SANK-P-R-176","pid":"43387724771191511936","h":"孫異","s":"孙异","cat":"人物","sub":"武將","y":"R","fac":"晉","e":"土","a":7300,"d":7400,"ev":0,"art":"img/s1/card_SANK-P-R-176.webp","intro":"孫異，東吳皇族，中國三國武將","full":"孫異（?—?），東吳皇族，中國三國武將。孫韶之子，孫楷、孫越之弟，孫奕、孫恢之兄。 赤烏四年（241年）。其父孫韶去世，孫越繼承官爵。永安六年（263年）冬十月，因為東吳和蜀漢的同盟關係、曹魏滅亡蜀漢前夕，聯絡東吳。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-176"},{"i":"SANK-P-R-27","pid":"64512702020650286577","h":"孫登","s":"孙登","cat":"人物","sub":"","y":"R","fac":"東吳","e":"水","a":6700,"d":7200,"ev":0,"art":"img/s1/card_SANK-P-R-27.webp","intro":"孫登，字子高，三國時東吳皇太子。","full":"孫登可以指 孫登 (新朝)，新朝末年被擁立的皇帝，於上郡由銅馬、青犢與尤來等所立 孫登 (東吳)，孫權的長子，221年被立為太子，241年逝世 孫登 (隱士)，曾向嵇康提出處世之道，但嵇康沒有採納，最後嵇康被害。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-27"},{"i":"SANK-P-R-15","pid":"49815494747050044163","h":"孫秀","s":"孙秀","cat":"人物","sub":"","y":"R","fac":"東吳","e":"水","a":7000,"d":7100,"ev":0,"art":"img/s1/card_SANK-P-R-15.webp","intro":"驃騎將軍，東吳降將","full":"孫秀可以指： 孫秀 (東吳)：三國時期東吳的人物，孫匡之孫。 孫秀 (西晉)：西晉時期的人物，曾協助趙王司馬倫行事。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-15"},{"i":"SANK-P-R-85","pid":"63079999342499865241","h":"孫賁","s":"孙贲","cat":"人物","sub":"君主宗室","y":"R","fac":"蜀漢","e":"木","a":7300,"d":7200,"ev":0,"art":"img/s1/card_SANK-P-R-85.webp","intro":"孫賁，字伯陽，吳郡富春人","full":"孫賁（?—209年），字伯陽，吳郡富春（今杭州富陽）人。孫堅兄孫羌之子，東漢末東吳勢力宗室。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-85"},{"i":"SANK-P-R-187","pid":"52495707265153025066","h":"孫資","s":"孙资","cat":"人物","sub":"文官","y":"R","fac":"群雄","e":"土","a":6200,"d":6400,"ev":0,"art":"img/s1/card_SANK-P-R-187.webp","intro":"孫資，字彥龍，太原中都人，三國時代魏國權臣。","full":"孫資（2世紀—251年9月29日），字彥龍，太原中都人，三國時代魏國權臣，在《三國志》中的事蹟多合併於劉放傳，另有《孫資別傳》。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-187"},{"i":"SANK-P-R-133","pid":"45428864914525557826","h":"孫輔","s":"孙辅","cat":"人物","sub":"君主宗室","y":"R","fac":"東吳","e":"水","a":7200,"d":7300,"ev":0,"art":"img/s1/card_SANK-P-R-133.webp","intro":"孫輔，字國儀，吳郡富春人","full":"孫輔（?—?），字國儀，吳郡富春人。孫堅兄孫羌之子，東漢末東吳勢力將領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-133"},{"i":"SANK-P-R-315","pid":"96399936487092451348","h":"孫邵","s":"孙邵","cat":"人物","sub":"文官","y":"R","fac":"群雄","e":"土","a":6600,"d":6300,"ev":0,"art":"img/s1/card_SANK-P-C-315.webp","intro":"孫邵，字長緒，北海人，孫吳首任丞相","full":"孫邵，字長緒，北海人，孫吳首任丞相。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-315"},{"i":"SANK-P-R-132","pid":"07801186336749395914","h":"孫靜","s":"孙静","cat":"人物","sub":"","y":"R","fac":"東吳","e":"水","a":7000,"d":7300,"ev":0,"art":"img/s1/card_SANK-P-R-132.webp","intro":"孫靜，字幼臺，吳郡富春人，東漢末年東吳勢力將領。","full":"孫靜（2世紀—3世紀），字幼臺，亦作幼台，吳郡富春（今杭州富陽）人，東漢末年東吳勢力將領，孫堅之弟。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-132"},{"i":"SANK-P-R-157","pid":"47744490399397015038","h":"宗預","s":"宗预","cat":"人物","sub":"文官","y":"R","fac":"東吳","e":"水","a":6600,"d":7100,"ev":0,"art":"img/s1/card_SANK-P-R-157.webp","intro":"宗預，字德豔，荊州南陽安眾人","full":"宗預（2世紀—264年），字德豔，荊州南陽安眾（今河南省南陽市）人。三國時蜀漢後期重臣，尤其在與東吳的外交上作出了貢獻。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-157"},{"i":"SANK-E-M-R-007","pid":"60727870036449632467","h":"山丹馬","s":"山丹马","cat":"坐騎","sub":"","y":"R","fac":"","e":"","a":null,"d":133,"ev":null,"art":"img/s1/card_SANK-E-M-R-007.webp","intro":"山丹馬，山丹所產的良馬。","full":"山丹馬，山丹所產的良馬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-M-R-007"},{"i":"SANK-P-R-198","pid":"09307747374683389981","h":"崔州平","s":"崔州平","cat":"人物","sub":"其他","y":"R","fac":"群雄","e":"土","a":6100,"d":6200,"ev":0,"art":"img/s1/card_SANK-P-R-198.webp","intro":"崔州平，字州平，博陵郡安平縣人，西河郡太守崔鈞的弟弟。","full":"崔州平（？—？），名失考，字州平，以字行，博陵郡安平縣（今河北省安平縣）人，東漢太尉崔烈的兒子，西河郡太守崔鈞的弟弟。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-198"},{"i":"SANK-P-R-29","pid":"66761655008611489483","h":"崔琰","s":"崔琰","cat":"人物","sub":"文官","y":"R","fac":"曹魏","e":"火","a":7000,"d":6300,"ev":0,"art":"img/s1/card_SANK-P-R-29.webp","intro":"崔琰，字季珪，清河郡東武城縣人。","full":"崔琰（163年—216年），字季珪，清河郡東武城縣（今河北省衡水市故城縣）人，司空崔林堂兄，原屬袁紹，後屬曹操。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-29"},{"i":"SANK-E-T-R-010","pid":"63667688482637443655","h":"左伯紙","s":"左伯纸","cat":"寶物","sub":"","y":"R","fac":"","e":"","a":null,"d":151,"ev":null,"art":"img/s1/card_SANK-E-T-R-010.webp","intro":"左伯紙，東漢左伯所造的精良紙。","full":"左伯紙，東漢左伯所造的精良紙。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-R-010"},{"i":"SANK-E-A-R-007","pid":"13626100758343283740","h":"布面甲","s":"布面甲","cat":"鎧甲","sub":"","y":"R","fac":"","e":"","a":null,"d":243,"ev":null,"art":"img/s1/card_SANK-E-A-R-007.webp","intro":"布面甲是古代鎧甲，將小片金屬板固定於衣內，便於活動。","full":"布面甲，是古代的一種鎧甲，構造特徵為將小片金屬防禦板固定在服裝的內面。因其製造成本相對低且容易修理，穿戴時不妨礙活動，在整個歐亞大陸都被廣泛使用。布面甲在中國自元朝開始使用一直至清末。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-R-007"},{"i":"SANK-P-R-186","pid":"09519680055745952310","h":"常林","s":"常林","cat":"人物","sub":"文官","y":"R","fac":"群雄","e":"土","a":6500,"d":6700,"ev":0,"art":"img/s1/card_SANK-P-R-186.webp","intro":"常林，字伯槐，河內溫縣人","full":"常林（2世紀—3世紀），字伯槐，河內溫縣（今河南溫縣）人。東漢末及三國時曹魏官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-186"},{"i":"SANK-E-A-R-012","pid":"85704742574152453539","h":"弓手軟甲","s":"弓手软甲","cat":"鎧甲","sub":"","y":"R","fac":"","e":"","a":null,"d":243,"ev":null,"art":"img/s1/card_SANK-E-A-R-012.webp","intro":"弓手軟甲，軟質輕甲，便於開弓。","full":"弓手軟甲，軟質輕甲，便於開弓。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-R-012"},{"i":"SANK-P-R-500","pid":"740133869785716094 90904","h":"來敏","s":"来敏","cat":"人物","sub":"文官","y":"UC","fac":"東吳","e":"水","a":4600,"d":4700,"ev":0,"art":"img/s1/card_SANK-P-UC-142.webp","intro":"來敏，字敬達，義陽新野人，三國時期蜀漢官員","full":"來敏，字敬達，義陽新野人，三國時期蜀漢官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-142"},{"i":"SANK-P-UC-235","pid":"06298750032254757053","h":"侯選","s":"侯选","cat":"人物","sub":"武將","y":"UC","fac":"群雄","e":"土","a":5300,"d":5200,"ev":0,"art":"img/s1/card_SANK-P-UC-235.webp","intro":"侯選，河東人，東漢末關中軍閥之一。","full":"侯選（？—？），河東人。東漢末年興平年間起兵作亂，有數千部眾。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-235"},{"i":"SANK-P-UC-257","pid":"29624974311219721458","h":"傅士仁","s":"傅士仁","cat":"人物","sub":"","y":"UC","fac":"群雄","e":"土","a":5200,"d":4800,"ev":0,"art":"img/s1/card_SANK-P-UC-257.webp","intro":"傅士仁，字君義，幽州廣陽人，三國時期蜀漢與孫吳人物。","full":"士仁（？—？），字君義，一作傅士仁，幽州廣陽人（今北京市），三國時期蜀漢與孫吳人物。史書上一般都記載其姓名為士仁，然而《三國志·蜀志·關羽傳》有一個地方寫成傅士仁，《三國演義》乃至《資治通鑑》的一些章節亦將其記為傅士仁，但學者多認為是史書傳。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-257"},{"i":"SANK-P-UC-248","pid":"96774499880314560052","h":"兀突骨","s":"兀突骨","cat":"人物","sub":"其他","y":"UC","fac":"群雄","e":"土","a":5600,"d":5400,"ev":0,"art":"img/s1/card_SANK-P-UC-248.webp","intro":"兀突骨，《三國演義》虛構人物，南蠻烏戈國之主，身披鱗甲。","full":"兀突骨，《三國演義》虛構人物，不見於正史記載，南蠻烏戈國之主，是身長十二尺的巨漢，不食五穀，以生蛇惡獸為飯；身有鱗甲，刀箭不能侵。頭戴日月狼須帽，身披金珠纓絡，兩肋下露出生鱗甲，眼目中微有光芒。孟獲遭到六擒六縱之後向兀突骨救援，兀突骨親自帶領兩名兵長土安、奚泥及三萬藤甲兵去攻蜀。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-248"},{"i":"SANK-P-UC-38","pid":"78454828240402323992","h":"全尚","s":"全尚","cat":"人物","sub":"君主宗室","y":"UC","fac":"曹魏","e":"火","a":4100,"d":4000,"ev":0,"art":"img/s1/card_SANK-P-UC-38.webp","intro":"全尚，字子真，揚州吳郡錢唐人","full":"全尚（？—258年），字子真，揚州吳郡錢唐人。三國時期東吳外戚，全琮族子，女兒全惠解是吳廢帝孫亮的皇后。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-38"},{"i":"SANK-P-UC-21","pid":"15469029082508686806","h":"全懌","s":"全怿","cat":"人物","sub":"武將","y":"UC","fac":"曹魏","e":"火","a":5200,"d":5100,"ev":0,"art":"img/s1/card_SANK-P-UC-21.webp","intro":"全懌，吳郡錢塘人，全琮與孫魯班之子。","full":"全懌（？—？），吳郡錢塘（今浙江省杭州市）人，全琮與孫魯班之子。東吳將軍、曹魏臨湘侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-21"},{"i":"SANK-P-UC-166","pid":"41670628534580500218","h":"全禕","s":"全祎","cat":"人物","sub":"","y":"UC","fac":"東吳","e":"水","a":5300,"d":5200,"ev":0,"art":"img/s1/card_SANK-P-UC-166.webp","intro":"全禕，揚州吳郡錢唐縣人，東吳將領全琮之長子。","full":"全緒（3世紀—3世紀），揚州吳郡錢唐縣（今浙江省杭州市）人。東吳將領全琮之長子，弟全寄、全懌、全吳。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-166"},{"i":"SANK-P-UC-145","pid":"13800566818964955422","h":"全紀","s":"全纪","cat":"人物","sub":"文官","y":"UC","fac":"東吳","e":"水","a":5300,"d":5000,"ev":0,"art":"img/s1/card_SANK-P-UC-145.webp","intro":"全紀，揚州吳郡錢塘人，三國末年吳國黃門侍郎","full":"全紀，揚州吳郡錢塘人，三國末年吳國黃門侍郎。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-145"},{"i":"SANK-P-UC-111","pid":"61846696632865311605","h":"公孫晃","s":"公孙晃","cat":"人物","sub":"君主宗室","y":"UC","fac":"蜀漢","e":"木","a":4800,"d":5000,"ev":0,"art":"img/s1/card_SANK-P-UC-111.webp","intro":"公孫晃，三國時期魏國人","full":"公孫晃，三國時期魏國人。公孫康嫡子，公孫淵之嫡兄。 公孫康死時，公孫晃、公孫淵還年幼，眾人立公孫康弟公孫恭為遼東太守。因任子制，公孫晃被公孫恭遣往洛陽為官。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-111"},{"i":"SANK-P-UC-132","pid":"97667828345430026168","h":"公孫範","s":"公孙范","cat":"人物","sub":"武將","y":"UC","fac":"蜀漢","e":"木","a":5300,"d":5400,"ev":0,"art":"img/s1/card_SANK-P-UC-132.webp","intro":"公孫範，東漢末期人物，公孫瓚從弟","full":"公孫範，東漢末期人物，公孫瓚從弟。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-132"},{"i":"SANK-P-UC-219","pid":"28640882470953696512","h":"公孫續","s":"公孙续","cat":"人物","sub":"","y":"UC","fac":"群雄","e":"土","a":5300,"d":5200,"ev":0,"art":"img/s1/card_SANK-P-UC-219.webp","intro":"公孫瓚子，突圍求救","full":"公孫續（？—199年），東漢末期人物，公孫瓚之子。 建安三年（198年），被公孫瓚派往黑山，向黑山賊張燕求救兵，讓他率五千騎兵於北隰之中，舉火為應，以夾擊袁紹，黑山賊軍帥張燕遂與公孫續率兵十萬來救，但援兵還沒到。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-219"},{"i":"SANK-P-UC-211","pid":"85388209634382741348","h":"公孫越","s":"公孙越","cat":"人物","sub":"","y":"UC","fac":"群雄","e":"土","a":5300,"d":5400,"ev":0,"art":"img/s1/card_SANK-P-UC-211.webp","intro":"公孫越，東漢末期人物。","full":"公孫越（？—191年），東漢末期人物，公孫瓚從弟。 被公孫瓚派去支援袁術，並與孫堅一同攻打周昂，但在陽城之戰為流矢所中而死；公孫瓚以其之死歸罪於袁紹，並和袁紹爭奪北方連年交戰。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-211"},{"i":"SANK-P-UC-87","pid":"21743627022136212717","h":"凌操","s":"凌操","cat":"人物","sub":"武將","y":"UC","fac":"蜀漢","e":"木","a":5500,"d":5400,"ev":0,"art":"img/s1/card_SANK-P-UC-87.webp","intro":"凌操，吳郡餘杭縣人，東漢政治人物，凌統之父，官至破賊校尉","full":"凌操，吳郡餘杭縣人，東漢政治人物，凌統之父，官至破賊校尉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-87"},{"i":"SANK-P-UC-46","pid":"42934823502792975461","h":"劉協","s":"刘协","cat":"人物","sub":"","y":"UC","fac":"曹魏","e":"金","a":4100,"d":5100,"ev":0,"art":"img/s1/card_SANK-P-UC-46.webp","intro":"漢獻帝劉協，字伯和，司隸雒陽人。","full":"漢獻帝劉協（181年4月2日—234年4月21日），字伯和，司隸雒陽人，是東漢乃至漢朝的最後一任皇帝，於189年至220年在位。劉協為漢靈帝劉宏之子、後少帝劉辯異母弟。根據《後漢書》記載，劉宏因為認為劉協像自己，取名「協」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-46"},{"i":"SANK-P-UC-243","pid":"24209527039032528908","h":"劉度","s":"刘度","cat":"人物","sub":"武將","y":"UC","fac":"群雄","e":"土","a":4400,"d":4500,"ev":0,"art":"img/s1/card_SANK-P-UC-243.webp","intro":"劉度，中國東漢末年零陵太守。","full":"劉度（？—？），中國東漢末年零陵太守。劉備南征時，劉度與其他郡一起望風而降。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-243"},{"i":"SANK-P-UC-203","pid":"21914222918853378467","h":"劉德然","s":"刘德然","cat":"人物","sub":"","y":"UC","fac":"東吳","e":"水","a":4300,"d":5300,"ev":0,"art":"img/s1/card_SANK-P-UC-203.webp","intro":"劉備同學，盧植弟子","full":"劉備同宗劉元起之子，與劉備同輩，年少時同受劉元起接濟。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-203"},{"i":"SANK-P-UC-231","pid":"20687725412678853109","h":"劉理","s":"刘理","cat":"人物","sub":"君主宗室","y":"UC","fac":"群雄","e":"土","a":4400,"d":4500,"ev":0,"art":"img/s1/card_SANK-P-UC-231.webp","intro":"劉理，字奉孝，蜀漢昭烈帝劉備庶子。","full":"劉理（207年後—244年），字奉孝。三國時蜀漢昭烈帝劉備庶子，後主劉禪及甘陵王劉永的異母弟。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-231"},{"i":"SANK-P-UC-7","pid":"02711750227354506203","h":"劉琦","s":"刘琦","cat":"人物","sub":"","y":"UC","fac":"曹魏","e":"火","a":4200,"d":5000,"ev":0,"art":"img/s1/card_SANK-P-UC-7.webp","intro":"劉琦 UC","fac":"東吳","e":"水","a":5300,"d":5400,"ev":0,"art":"img/s1/card_SANK-P-UC-192.webp","intro":"孫歆，東吳皇族，中國三國武將","full":"孫歆（249年前—280年），東吳皇族，中國三國武將。孫賁之孫，孫鄰之子。兄弟孫苗、孫旅、孫述、孫震、孫諧。《三國志》吳志·宗室傳引《吳曆》。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-192"},{"i":"SANK-P-UC-62","pid":"36498294727073815205","h":"孫皓","s":"孙皓","cat":"人物","sub":"","y":"UC","fac":"東吳","e":"水","a":4500,"d":4200,"ev":0,"art":"img/s1/card_SANK-P-UC-62.webp","intro":"末帝，殘暴亡國之君","full":"吳末帝孫皓（243年—284年），字元宗，幼名彭祖，又字皓宗，《三國志》原名為孫晧。為廢太子孫和之子，吳大帝孫權之孫，在位約十六年（264年—280年），是三國時期東吳的第四位，同時也是三國最後一位皇帝。 吳景帝孫休逝世時，太子非常年幼。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-62"},{"i":"SANK-P-UC-49","pid":"74606835319639869433","h":"孫觀","s":"孙观","cat":"人物","sub":"","y":"UC","fac":"曹魏","e":"火","a":5400,"d":5300,"ev":0,"art":"img/s1/card_SANK-P-UC-49.webp","intro":"孫觀，字仲臺，泰山人。","full":"孫觀可以指： 孫觀 (東漢)，東漢末年將領 孫觀 (道光進士)，清道光年間進士，官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-49"},{"i":"SANK-P-UC-52","pid":"48155616171649389383","h":"孫震","s":"孙震","cat":"人物","sub":"","y":"UC","fac":"東吳","e":"水","a":5300,"d":5400,"ev":0,"art":"img/s1/card_SANK-P-UC-52.webp","intro":"宗室將領，晉滅吳戰死","full":"孫震可以指： 孫震 (三國)，三國時期東吳將領。《三國志·吳書·孫皓傳》的注引《晉紀》有記載此人。 孫震 (中華民國將領)，國民革命軍將領。 孫震 (臺灣學政界人物)，台灣政治人物，曾任國立臺灣大學校長與國防部長。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-52"},{"i":"SANK-P-UC-63","pid":"34455649253977368421","h":"孫霸","s":"孙霸","cat":"人物","sub":"君主宗室","y":"UC","fac":"曹魏","e":"火","a":5100,"d":4600,"ev":0,"art":"img/s1/card_SANK-P-UC-63.webp","intro":"孫霸，字子威，三國時東吳皇子","full":"孫霸（224年～235年間—250年），字子威，三國時東吳皇子。孫權的第四子。曾與兄長孫和發生二宮之爭。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-63"},{"i":"SANK-P-UC-153","pid":"62608393675091172770","h":"孫魯班","s":"孙鲁班","cat":"人物","sub":"君主宗室","y":"UC","fac":"東吳","e":"水","a":4700,"d":4500,"ev":0,"art":"img/s1/card_SANK-P-UC-153.webp","intro":"孫魯班，字大虎，三國東吳吳郡富春。","full":"孫魯班（？—？），字大虎，三國東吳吳郡富春。東吳大帝孫權長女，生母步練師，被稱為大公主，全懌、全吳生母，全緒、全寄繼母，朱氏姨母。初嫁周瑜的兒子周循，周循死後，改嫁全琮，因此孫魯班又稱全公主、長公主。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-153"},{"i":"SANK-P-UC-233","pid":"87042811016163710234","h":"孫魯育","s":"孙鲁育","cat":"人物","sub":"","y":"UC","fac":"群雄","e":"土","a":4200,"d":4300,"ev":0,"art":"img/s1/card_SANK-P-UC-233.webp","intro":"孫魯育，孫權次女，賢惠。","full":"孫魯育（218年—255年），字小虎，三國吳大帝孫權三女，母步夫人。 孫魯育是孫權和步夫人的次女，最初被嫁給朱據，故又稱朱公主。後又嫁給劉纂。劉纂曾經娶孫權中女孫氏，因為孫氏早逝，所以又娶孫魯育為繼室。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-233"},{"i":"SANK-P-UC-167","pid":"70032808704900557458","h":"宋謙","s":"宋谦","cat":"人物","sub":"","y":"UC","fac":"曹魏","e":"火","a":5500,"d":5300,"ev":0,"art":"img/s1/card_SANK-P-UC-167.webp","intro":"宋謙，三國時期人物。","full":"宋謙（？—？），表字及籍貫皆不詳，東漢末及三國時東吳將領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-167"},{"i":"SANK-P-UC-127","pid":"59860120631658135428","h":"尹賞","s":"尹赏","cat":"人物","sub":"","y":"UC","fac":"蜀漢","e":"木","a":4900,"d":5000,"ev":0,"art":"img/s1/card_SANK-P-UC-127.webp","intro":"尹賞，天水主簿，降蜀。","full":"尹賞可以指： 尹賞 (西漢)，西漢時期的官員 尹賞 (三國)，三國時期的人物。其事見於《三國志·蜀書·姜維傳》。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-127"},{"i":"SANK-P-UC-163","pid":"00116447499022523033","h":"尹默","s":"尹默","cat":"人物","sub":"文官","y":"UC","fac":"東吳","e":"水","a":4300,"d":4200,"ev":0,"art":"img/s1/card_SANK-P-UC-163.webp","intro":"尹默，字思潛，梓潼涪城人。","full":"尹默（？—？），字思潛，梓潼涪城人。三國時蜀漢官員，學者。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-163"},{"i":"SANK-E-A-UC-014","pid":"44631014355181259256","h":"屯田兵甲","s":"屯田兵甲","cat":"鎧甲","sub":"","y":"UC","fac":"","e":"","a":null,"d":127,"ev":null,"art":"img/s1/card_SANK-E-A-UC-014.webp","intro":"屯田兵甲，屯田兵所穿的簡甲。","full":"屯田兵甲，屯田兵所穿的簡甲。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-UC-014"},{"i":"SANK-P-UC-83","pid":"64234823797101442175","h":"崔諒","s":"崔谅","cat":"人物","sub":"","y":"UC","fac":"蜀漢","e":"木","a":4900,"d":5900,"ev":0,"art":"img/s1/card_SANK-P-UC-83.webp","intro":"安定太守，演義被騙","full":"崔諒可以指： 崔諒 (西晉)：西晉時尚書、大鴻臚、中書令。 崔諒 (三國演義)：《三國演義》虛構的安定郡太守。","wiki":"https://seanown.org/mylegends-wiki.html# -P-UC-188","pid":"71079366032458792624","h":"曹羲","s":"曹羲","cat":"人物","sub":"武將","y":"UC","fac":"東吳","e":"水","a":4500,"d":4600,"ev":0,"art":"img/s1/card_SANK-P-UC-188.webp","intro":"曹羲，字昭叔，三國時期魏國之臣。","full":"曹羲（？—249年），字昭叔，三國時期魏國之臣，魏國重臣曹真之子，大將軍曹爽之弟，曹訓、曹彥之兄，封安鄉侯。 曹爽專權，曹羲有所規勸，但曹爽不聽。249年，曹爽出行高平陵，曹羲勸他保持警惕，曹爽仍不聽，遂遭太傅司馬懿政變奪權。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-188"},{"i":"SANK-P-UC-33","pid":"62845092808508003565","h":"曹肇","s":"曹肇","cat":"人物","sub":"武將","y":"UC","fac":"曹魏","e":"火","a":4700,"d":5700,"ev":0,"art":"img/s1/card_SANK-P-UC-33.webp","intro":"曹肇，字長思，三國時代曹魏將領，大司馬曹休之子，有殊色","full":"曹肇，字長思，三國時代曹魏將領，大司馬曹休之子，有殊色。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-33"},{"i":"SANK-P-UC-135","pid":"26781030845889650781","h":"曹芳","s":"曹芳","cat":"人物","sub":"君主宗室","y":"UC","fac":"蜀漢","e":"木","a":4200,"d":4100,"ev":0,"art":"img/s1/card_SANK-P-UC-135.webp","intro":"曹芳，字蘭卿，魏明帝養子，是三國時曹魏皇帝，在位15年","full":"曹芳，字蘭卿，魏明帝養子，是三國時曹魏皇帝，在位15年。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-135"},{"i":"SANK-P-UC-238","pid":"18942375703575587170","h":"曹豹","s":"曹豹","cat":"人物","sub":"武將","y":"UC","fac":"群雄","e":"金","a":5300,"d":5000,"ev":0,"art":"img/s1/card_SANK-P-UC-238.webp","intro":"曹豹（2世紀？—196年？）","full":"曹豹（2世紀？—196年？），東漢末期人物，原本是陶謙的故將，陶謙死後屬劉備，為下邳相。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-238"},{"i":"SANK-E-T-UC-001","pid":"10195782132447730324","h":"木印","s":"木印","cat":"寶物","sub":"","y":"UC","fac":"","e":"","a":null,"d":80,"ev":null,"art":"img/s1/card_SANK-E-T-UC-001.webp","intro":"木印，木製印章。","full":"木印，木製印章。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UC-001"},{"i":"SANK-E-W-UC-002","pid":"15708474063919962166","h":"木柄長槍","s":"木柄长枪","cat":"武器","sub":"","y":"UC","fac":"","e":"","a":139,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-UC-002.webp","intro":"槍又稱鎗，長槓末端裝尖刃，是東亞長柄武器。","full":"槍又稱鎗，是用略有彈性的長槓末端裝有尖刃製成的矛，是東亞特有的長柄武器，自隋唐時期起長期在戰場使用，有「百兵之王」之稱。槍桿剛度略低可產生彎曲、重量較輕便，適合輕步兵與輕騎兵運用。","wiki":"https://seanown.org/mylegends-wiki ki.html#SANK-P-UC-48"},{"i":"SANK-P-UC-152","pid":"09493546196395270807","h":"李朝","s":"李朝","cat":"人物","sub":"","y":"UC","fac":"東吳","e":"水","a":4700,"d":5000,"ev":0,"art":"img/s1/card_SANK-P-UC-152.webp","intro":"李朝，別駕從事，李邵兄。","full":"李朝可以指： 李朝 (蜀漢)，中國三國時期蜀漢將領 前李朝（544年－602年），越南朝代，建國者為李賁 李朝 (越南)（1009年－1225年），越南朝代，建國者為李公蘊 朝鮮王朝（1392年－1897年），朝鮮半島朝代，建國者為李成桂。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-152"},{"i":"SANK-P-UC-72","pid":"89593283244594617550","h":"李球","s":"李球","cat":"人物","sub":"","y":"UC","fac":"曹魏","e":"火","a":5500,"d":4500,"ev":0,"art":"img/s1/card_SANK-P-UC-72.webp","intro":"李球，李恢侄，綿竹戰死。","full":"南延君（韓語：남연군／南延君，1788年—1836年），名李球（韓語：이구／李球），朝鮮王朝的王族，朝鮮仁祖第三子麟坪大君的六世孫，為朝鮮王朝末年的政治實權者興宣大院君李昰應的父親、朝鮮高宗的親生祖父，謚號忠正、榮僖。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-72"},{"i":"SANK-P-UC-181","pid":"36513731798276214147","h":"李異","s":"李异","cat":"人物","sub":"武將","y":"UC","fac":"東吳","e":"水","a":5500,"d":5100,"ev":0,"art":"img/s1/card_SANK-P-UC-181.webp","intro":"李異，三國時期劉璋部下，後轉為吳國武將。","full":"李異（？—？），三國時期劉璋部下，後轉為吳國武將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-181"},{"i":"SANK-P-UC-35","pid":"08919065009352864412","h":"李福","s":"李福","cat":"人物","sub":"文官","y":"UC","fac":"曹魏","e":"火","a":4800,"d":5200,"ev":0,"art":"img/s1/card_SANK-P-UC-35.webp","intro":"李福，字孫德，三國蜀漢官員，官至尚書僕射。","full":"李福可指： 李福 (三國)，字號孫德，三國時期人物，劉備定益州後為書佐、西充國長、成都令，建興時為巴西太守、江州督、楊威將軍、尚書僕射、平陽亭侯 李福 (成漢)，漢昭文帝李壽之子 李福 (趙王)，為唐太宗和楊妃所生，趙王 李福嗣，唐朝楚國公。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-35"},{"i":"SANK-P-UC-196","pid":"60224473267339342017","h":"李肅","s":"李肃","cat":"人物","sub":"","y":"UC","fac":"東吳","e":"水","a":5300,"d":4900,"ev":0,"art":"img/s1/card_SANK-P-UC-196.webp","intro":"武將，參與誅殺董卓","full":"李肅可以指： 李肅 (東漢)，東漢末期人物，曾參與誅殺董卓，在攻擊牛輔時因戰敗被呂布誅殺 李肅 (東吳)，東吳官員，南陽人 李肅 (北魏)，南北朝時期北魏的官員，性格狂放 李肅 (北宋)，北宋時期作家 李肅 (企業家)，和君創業諮詢集團總裁。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-196"},{"i":"SANK-P-UC-214","pid":"15546438946244910602","h":"李譔","s":"李譔","cat":"人物","sub" nds-wiki.html#SANK-P-UC-41"},{"i":"SANK-P-UC-252","pid":"30864815044484520646","h":"波才","s":"波才","cat":"人物","sub":"","y":"UC","fac":"群雄","e":"土","a":5400,"d":5500,"ev":0,"art":"img/s1/card_SANK-P-UC-252.webp","intro":"潁川渠帥，圍皇甫嵩","full":"黃巾軍人物為東漢末年參與黃巾之亂的黃巾軍人物，包含《三國志》以及其他史書所記載的史實人物及《三國演義》中的虛構人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-252"},{"i":"SANK-E-W-UC-0007","pid":"83518949246598981703","h":"流星錘","s":"流星锤","cat":"武器","sub":"","y":"UC","fac":"","e":"","a":139,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-UC-0007.webp","intro":"流星錘是將金屬錘頭繫於長繩的軟兵器，靠離心力傷敵。","full":"流星錘，或稱流星鎚、飛錘、飛鎚，是一種將金屬錘頭繫於長繩一端或兩端製成的軟兵器。本身的構思為「利用揮舞武器的離心力來增加破壞力」，而帶刺流星錘本身的刺更增加破壞力。流星錘分為單流星錘和雙流星錘兩種，流星形狀也可分為西瓜和木瓜形兩種。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-UC-0007"},{"i":"SANK-P-UC-216","pid":"87435109089621800321","h":"淳于瓊","s":"淳于琼","cat":"人物","sub":"","y":"UC","fac":"晉","e":"土","a":5300,"d":5400,"ev":0,"art":"img/s1/card_SANK-P-UC-216.webp","intro":"武將，烏巢守將醉酒誤事","full":"淳于瓊（？—200年），字仲簡，複姓淳于，潁川人。漢朝末期政治人物。為袁紹大將，與張郃、高覽齊名。在官渡之戰時鎮守烏巢，遭到曹操的偷襲而慘敗，自己也被曹操處斬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-216"},{"i":"SANK-P-UC-193","pid":"26833780440547050880","h":"潘氏","s":"潘氏","cat":"人物","sub":"","y":"UC","fac":"東吳","e":"水","a":4800,"d":4500,"ev":0,"art":"img/s1/card_SANK-P-UC-193.webp","intro":"潘氏，潘皇后，孫權皇后。","full":"潘姓是一個漢字姓氏，在《百家姓》中排名第43位。朝鮮半島及越南亦有潘姓氏族居住。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-193"},{"i":"SANK-P-UC-472","pid":"19337181202463734635","h":"潘鳳","s":"潘凤","cat":"人物","sub":"","y":"UC","fac":"曹魏","e":"金","a":5500,"d":5100,"ev":0,"art":"img/s1/card_SANK-P-C-80.webp","intro":"上將，演義被華雄斬","full":"潘鳳，《三國演義》虛構人物，冀州牧韓馥部下將領，使大斧；諸侯討董卓時於汜水關與華雄交戰，被華雄所斬，為關羽「溫酒斬華雄」之襯托。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-472"},{"i":"SANK-P-UC-93","pid":"94205981167007612798","h":"焦彝","s":"焦彝","cat":"人物","sub":"","y":"UC","fac":"蜀漢","e":"木","a":5300,"d":5200,"ev":0,"art":"img/s1/card_SANK-P-UC-93.webp","intro":"焦彝，部將，諸葛誕部下。","full":"壽春之戰 SANK-P-UC-170.webp","intro":"王子服，字子由，又名王服或李服，東漢末期的越騎校尉、偏將軍。","full":"王子服（？—200年2月11日），字子由。又名王服（《後漢書》和《資治通鑑》中）或李服（《後出師表》中），東漢末期的越騎校尉、偏將軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-170"},{"i":"SANK-P-UC-24","pid":"23246295231370383835","h":"王業","s":"王业","cat":"人物","sub":"","y":"UC","fac":"曹魏","e":"火","a":4100,"d":4600,"ev":0,"art":"img/s1/card_SANK-P-UC-24.webp","intro":"大臣，晉朝開國功臣","full":"王業可以指： 帝王霸業，諸葛亮《後出師表》稱「先帝慮漢賊不兩立，王業不偏安，故托臣以討賊也」 王業 (三國)，曹魏政治人物，官謁者僕射，王弼之父，劉表外孫 王業 (西晉)，魏末晉初政治人物，官散騎常侍，武陵郡人 王業 (嘉靖進士)，明代官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-24"},{"i":"SANK-P-UC-156","pid":"90000016957457418898","h":"王楷","s":"王楷","cat":"人物","sub":"","y":"UC","fac":"東吳","e":"水","a":4400,"d":4500,"ev":0,"art":"img/s1/card_SANK-P-UC-156.webp","intro":"王楷，謀士，出使袁術。","full":"王楷可以指： 王楷 (東漢)，東漢末期人物，呂布部下。《三國志》、《資治通鑑》都有記載此人 王楷 (劉宋)，王導玄孫，劉宋太中大夫 高麗仁宗，高麗君主 王楷 (嘉靖進士)，浙江永康人，明朝嘉靖三十五年進士 王楷 (餘姚舉人)，浙江餘姚人，明。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-156"},{"i":"SANK-P-UC-66","pid":"12337159990602705068","h":"王累","s":"王累","cat":"人物","sub":"文官","y":"UC","fac":"曹魏","e":"火","a":4600,"d":4500,"ev":0,"art":"img/s1/card_SANK-P-UC-66.webp","intro":"王累，益州廣漢郡新都縣人，東漢末益州牧劉璋部下，任從事","full":"王累，益州廣漢郡新都縣人，東漢末益州牧劉璋部下，任從事。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-66"},{"i":"SANK-P-UC-23","pid":"45158540776537097218","h":"王謀","s":"王谋","cat":"人物","sub":"","y":"UC","fac":"曹魏","e":"火","a":4300,"d":4500,"ev":0,"art":"img/s1/card_SANK-P-UC-23.webp","intro":"王謀，字元泰，三國時代蜀漢名士，漢嘉人。","full":"王謀（？年—225年），字元泰。三國時代蜀漢名士，漢嘉人。歷仕劉焉、劉璋、劉備三主。性格有容止操行，善美謹慎。劉璋時代歷任巴郡太守、治中從事。劉備入蜀，兼任益州牧，任命其為別駕。劉備為漢中王時，王謀被任命為少府。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-23"},{"i":"SANK-P-UC-20","pid":"22152970541156345447","h":"王連","s":"王连","cat":"人物","sub":"文官","y":"UC","fac":"曹魏","e":"火","a":4200,"d":4300,"ev":0,"art":"img/s1/card_SANK-P-UC-20.webp","intro":"王連，字文儀，南陽人。","full":"王連（？—？），字文儀，南陽人。三國時蜀漢官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-20"},{"i ","h":"閔純","s":"闵纯","cat":"人物","sub":"文官","y":"UC","fac":"群雄","e":"金","a":5400,"d":4400,"ev":0,"art":"img/s1/card_SANK-P-UC-244.webp","intro":"閔純，字伯典，東漢末韓馥別駕，曾諫阻韓馥讓冀州。","full":"閔純（？—191年），字伯典，東漢末期的人物，韓馥別駕，在韓馥企圖讓冀州於袁紹時曾和耿武及李歷一同勸諫韓馥，認為韓馥可以利用軍糧把袁紹玩弄於股掌之間而不必寄人籬下，韓馥拒絕採納。在袁紹將來到冀州時，以刀杖抗拒袁紹而被袁紹命田豐殺害。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-244"},{"i":"SANK-P-UC-449","pid":"95199544771960312038","h":"閻象","s":"阎象","cat":"人物","sub":"","y":"UC","fac":"群雄","e":"土","a":4500,"d":4600,"ev":0,"art":"img/s1/card_SANK-P-C-449.webp","intro":"閻象，東漢末期人物，袁術部下為主簿。","full":"閻象，東漢末期人物，袁術部下為主簿。建安元年（196年），袁術欲稱帝，閻象以袁術勢力未足，而且漢室又未算暴虐，勸諫袁術不要稱帝。袁術聽後默然不悅，最後袁術仍然在建安二年（197年）稱帝，並因勢力未足而且民心盡失而敗亡。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-449"},{"i":"SANK-P-UC-144","pid":"03723396779988270731","h":"關彝","s":"关彝","cat":"人物","sub":"","y":"UC","fac":"蜀漢","e":"木","a":5200,"d":5000,"ev":0,"art":"img/s1/card_SANK-P-UC-144.webp","intro":"關彝，關興之子，關羽之孫。","full":"關彝（？—？），三國時蜀國漢壽亭侯，關興庶子，關羽之孫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-144"},{"i":"SANK-P-UC-16","pid":"10488483773467782253","h":"阮籍","s":"阮籍","cat":"人物","sub":"文官","y":"UC","fac":"曹魏","e":"火","a":4400,"d":4300,"ev":0,"art":"img/s1/card_SANK-P-UC-16.webp","intro":"阮籍，字嗣宗，陳留尉氏人，三國時期魏國詩人、官員。","full":"阮籍（210年—263年），字嗣宗，陳留尉氏（今河南開封）人，三國時期魏國詩人、官員，「竹林七賢」之一。曾任步兵校尉，人稱阮步兵。與嵇康並稱嵇阮。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-16"},{"i":"SANK-P-UC-116","pid":"74077331112674687443","h":"陳壽","s":"陈寿","cat":"人物","sub":"","y":"UC","fac":"蜀漢","e":"木","a":4400,"d":4200,"ev":0,"art":"img/s1/card_SANK-P-UC-116.webp","intro":"史學家 / 三國志作者","full":"陳壽（233年－297年），字承祚，巴西郡安漢縣（今四川省南充市）人，蜀漢至西晉時期的歷史學家。陳壽早年師從同郡學者譙周，在蜀漢任觀閣令史等職；蜀漢亡後入仕西晉，歷任佐著作郎、陽平令、著作郎等職。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UC-116"},{"i":"SANK-P-UC-11","pid":"18206344100081760262","h":"陳琳","s":"陈琳","cat":"人物","sub":"文官","y":"UC","fac":"曹魏","e":"火","a":4200,"d":4300,"ev":0,"art":"img/s1/card_SANK-P-UC-11.webp","intro":"陳琳，三國時期人物。","full": card_SANK-P-C-123.webp","intro":"丁固，字子賤，會稽山陰人，孫吳後期重臣。","full":"丁固可以指： 丁公，秦末武將，季布的舅父。 丁固 (東吳)，三國吳國官吏。 丁固 (香港)，香港前市政局主席和市政事務署署長。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-123"},{"i":"SANK-P-C-355","pid":"91125039962169904218","h":"丁斐","s":"丁斐","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2800,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-355.webp","intro":"丁斐，字文侯，東漢末年沛國譙縣人。","full":"丁斐（?—?），字文侯，東漢末年沛國譙縣（治今安徽省亳州市）人。 丁斐博覽群書，個性沈毅。與曹操同鄉，為曹操所喜愛。永漢元年（189年）十二月，曹操在陳留招兵，丁斐前來投奔。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-355"},{"i":"SANK-P-C-120","pid":"05843806282354161286","h":"丁沖","s":"丁冲","cat":"人物","sub":"武將","y":"C","fac":"蜀漢","e":"木","a":2300,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-120.webp","intro":"丁衝，沛國人，於東漢末年三國初期效力於曹操，官至司隸校尉","full":"丁衝，沛國人，於東漢末年三國初期效力於曹操，官至司隸校尉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-120"},{"i":"SANK-P-C-128","pid":"37256250926365087507","h":"上官勝","s":"上官胜","cat":"人物","sub":"武將","y":"C","fac":"蜀漢","e":"木","a":2400,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-128.webp","intro":"上官勝，原為魏人，後降蜀漢，官至太尉。","full":"上官勝（？年—？年），剛開始為魏人，後在蜀漢丞相諸葛亮於建興六年(曹魏太和二年，228年)發動第一次北伐時隨姜維、尹賞、梁虔、梁緒等以及上官家族等一同投降蜀漢，後官至蜀漢太尉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-128"},{"i":"SANK-P-C-34","pid":"55012111619343512923","h":"上官子脩","s":"上官子修","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3000,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-34.webp","intro":"上官子脩，部將，隨軍征戰。","full":"三國時期小人物，史料記載零散，卡池依所屬營別與稀有度歸檔，數值按檔位預設，待日後補考據。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-34"},{"i":"SANK-P-C-129","pid":"98073942936510646686","h":"上官雝","s":"上官雝","cat":"人物","sub":"武將","y":"C","fac":"蜀漢","e":"木","a":2600,"d":3600,"ev":0,"art":"img/s1/card_SANK-P-C-129.webp","intro":"上官雝，蜀漢將領，官至行中典軍、討虜將軍。","full":"上官雝（？—？），蜀漢將領，官至行中典軍、討虜將軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-129"},{"i":"SANK-P-C-130","pid":"22390083181129167366","h":"上官顯","s":"上官显","cat":"人物","sub":"武將","y":"C","fac":"蜀漢","e":"木","a":2700,"d":3700,"ev":0,"art":"img/s1/card_SANK-P-C-130.webp","intro":"上官顯，三國時期人物","full":"上官顯，三國時期人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-130"},{"i":"SANK-P-C-131","pid":"72913204329260309592","h":"丘建","s":"丘建","cat":"人物","sub":"武將","y":"C","fac":"蜀漢","e":"木","a":3000,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-131.webp","intro":"丘建，魏國武將，鍾會心腹，官至帳下督。","full":"丘建，魏國武將，是鍾會的心腹，在263年魏滅漢之戰中擔任鍾會的帳下督，隨鍾會出征。丘建原本是胡烈的部屬，胡烈將他推薦給司馬昭，鍾會喜愛他，又請司馬昭讓丘建跟著他。到了264年正月，鍾會在成都決定謀反的那一晚，丘建在巧合中遇見被正在被鍾會逼反的監軍衛瓘。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-131"},{"i":"SANK-P-C-370","pid":"94278832622086590148","h":"丘本","s":"丘本","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2800,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-370.webp","intro":"丘本，《三國演義》中出現的虛構人物。","full":"丘本，《三國演義》中出現的虛構人物，在魏滅漢之戰中擔任鄧艾的監軍（正史中監軍是衛瓘）。在綿竹時建議鄧艾寫封信向諸葛瞻勸降，遭到拒絕後，便進言改用奇兵取勝。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-370"},{"i":"SANK-P-C-132","pid":"76234450783813178658","h":"丞相沇","s":"丞相沇","cat":"人物","sub":"文官","y":"C","fac":"蜀漢","e":"木","a":3000,"d":2000,"ev":0,"art":"img/s1/card_SANK-P-C-132.webp","intro":"丞相沇，三國東吳丞相","full":"丞相沇（?—?），三國東吳丞相。梁章鉅推測可能是許沇。 《三國志》無丞相沇記載，但天璽元年（276年）所立的《禪國山碑》有「丞相沇」之語。梁章鉅《三國志旁證》曰：「又案<真誥>注許長史世譜云：吳丞相許晏，字孝然，長史四世族祖也。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-132"},{"i":"SANK-P-C-447","pid":"19139000743650620493","h":"于毒","s":"于毒","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3400,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-447.webp","intro":"于毒，三國時期人物。","full":"東漢末黑山賊將領，與張燕等活動於并州、冀州。後於朝歌縣鹿場山蒼巖谷為袁紹軍圍攻多日，戰死。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-447"},{"i":"SANK-P-C-369","pid":"63321433379207658136","h":"于詮","s":"于诠","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3400,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-369.webp","intro":"于詮，三國時期人物。","full":"于詮（？—258年4月10日），或作于銓，中國三國時期吳國將領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-369"},{"i":"SANK-P-C-137","pid":"45370484732897187346","h":"五梁","s":"五梁","cat":"人物","sub":"文官","y":"C","fac":"蜀漢","e":"木","a":3300,"d":2300,"ev":0,"art":"img/s1/card_SANK-P-C-137.webp","intro":"五梁，字德山，犍為南安人。","full":"五梁（？—？），字德山，犍為南安人。三國時蜀漢官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-137"},{"i":"SANK-P-C-37","pid":"11934430671593099432","h":"任夔","s":"任夔","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3400,"d":2400,"ev":0,"art":"img/s1/card_SANK-P-C-37.webp","intro":"吳蘭部將，被曹洪斬","full":"任𧃍（—218年）。劉備手下，是一位蜀國牙將。 建安二十三年，在劉備進兵漢中時，將軍吳蘭想退兵，但任䕫說：「賊兵初至，若不先挫其銳氣，何顏見孟起乎？」。他徑出迎戰，被曹洪打下馬，死在馬下。最後，曹洪破吳蘭。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-37"},{"i":"SANK-P-C-139","pid":"02002942310163236121","h":"任氏","s":"任氏","cat":"人物","sub":"君主宗室","y":"C","fac":"蜀漢","e":"木","a":3500,"d":2500,"ev":0,"art":"img/s1/card_SANK-P-C-139.webp","intro":"任夫人，為魏文帝曹丕未登基時的妻妾","full":"任夫人，為魏文帝曹丕未登基時的妻妾。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-139"},{"i":"SANK-P-C-470","pid":"93632543758581811606","h":"伍孚","s":"伍孚","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2900,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-470.webp","intro":"伍瓊，字德瑜，汝南人，東漢城門校尉。","full":"伍瓊（？—190年3月28日），字德瑜，汝南（今河南駐馬店市汝南縣）人，東漢城門校尉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-470"},{"i":"SANK-P-C-140","pid":"49206731745625246643","h":"伍習","s":"伍习","cat":"人物","sub":"武將","y":"C","fac":"蜀漢","e":"木","a":3200,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-140.webp","intro":"伍習，東漢末年的武將","full":"伍習，東漢末年的武將。《典略》記載其名為五習。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-140"},{"i":"SANK-P-C-141","pid":"34350711563738013105","h":"伏夫人","s":"伏夫人","cat":"人物","sub":"君主宗室","y":"C","fac":"蜀漢","e":"木","a":3800,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-141.webp","intro":"伏夫人，三國曹魏大臣司馬懿的姬妾。","full":"伏夫人（227年前—283年前），三國曹魏大臣司馬懿的姬妾，晉元帝的曾祖母，汝南文成王司馬亮、琅邪武王司馬伷、清惠亭侯司馬京、扶風武王司馬駿的生母。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-141"},{"i":"SANK-P-C-44","pid":"72650558933915544653","h":"何儀","s":"何仪","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3300,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-44.webp","intro":"何儀，汝南黃巾，降曹操。","full":"東漢末汝南黃巾餘部將領，與劉辟、黃邵、何曼等各擁數萬眾，先應袁術、後附孫堅。建安元年曹操進軍討破，劉辟、黃邵被斬，何儀率眾投降。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-44"},{"i":"SANK-P-C-143","pid":"58565018672108269515","h":"何姬","s":"何姬","cat":"人物","sub":"君主宗室","y":"C","fac":"蜀漢","e":"木","a":2000,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-143.webp","intro":"何姬，丹陽句容人，孫和姬妾，吳末帝孫皓之母。","full":"何姬(？—？)，丹陽句容（今江蘇省句容市）人，為廢太子南陽王孫和姬妾，吳末帝孫皓之母。孫皓即位後，被尊為昭獻皇后，不久又進為皇太后。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-143"},{"i":"SANK-P-C-144","pid":"62538279166000727320","h":"何宗","s":"何宗","cat":"人物","sub":"文官","y":"C","fac":"蜀漢","e":"木","a":2200,"d":2300,"ev":0,"art":"img/s1/card_SANK-P-C-144.webp","intro":"何宗，字彥英，蜀郡郫縣人。","full":"何宗 （？年—？年），字彥英，一作字彥若，蜀郡郫縣（今四川省成都市）人。精通經緯、天官、推步、圖讖之術。蜀漢大鴻臚。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-144"},{"i":"SANK-P-C-145","pid":"43570143736966930095","h":"何定","s":"何定","cat":"人物","sub":"文官","y":"C","fac":"蜀漢","e":"木","a":2200,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-145.webp","intro":"何定，汝南郡人，三國時孫吳政治人物","full":"何定，汝南郡人，三國時孫吳政治人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-145"},{"i":"SANK-P-C-26","pid":"65849693940903923065","h":"何曼","s":"何曼","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":2300,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-26.webp","intro":"何曼，東漢時期人物，黃巾軍將領。","full":"何曼（？—？），東漢時期人物，黃巾軍將領。曾參與黃巾起義，叛亂平息後，與劉辟、黃邵、何儀等人佔壉著汝南（今河南駐馬店）、潁川（今河南省中部）一帶。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-26"},{"i":"SANK-P-C-440","pid":"93241495874644881185","h":"何楨","s":"何桢","cat":"人物","sub":"","y":"C","fac":"晉","e":"土","a":3000,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-440.webp","intro":"何楨，一作何禎，字元幹，廬江郡灊縣人。","full":"何楨（？年—？年），一作何禎，字元幹，廬江郡灊縣（今屬安徽霍山）人。曹魏弘農郡太守、幽州刺史、廷尉、晉尚書，終官至西晉光祿大夫，封爵雩婁侯。 有文才，著有《許都賦》、《冠儀約制》，有文集一卷（一說五卷）。與張儼有交情。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-440"},{"i":"SANK-P-C-534","pid":"14486688303751877975","h":"何氏","s":"何氏","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2600,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-534.webp","intro":"何氏，三國時期人物。","full":"何姓為中文姓氏之一，在《百家姓》中排第21位，何姓是中國第十七大姓，四川、廣東、湖南多何姓。何氏原本世居湞陽、雲浮、合肥等地，但在南宋、元末明初時移到廣東。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-534"},{"i":"SANK-P-C-147","pid":"25340034043580566041","h":"何祗","s":"何祗","cat":"人物","sub":"文官","y":"C","fac":"蜀漢","e":"木","a":2600,"d":3600,"ev":0,"art":"img/s1/card_SANK-P-C-147.webp","intro":"何祗，字君肅，三國時期蜀漢官員。","full":"何祗（ㄓ）（？—？），字君肅，三國時期蜀漢官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-147"},{"i":"SANK-P-C-454","pid":"51880040504726009884","h":"何苗","s":"何苗","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2900,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-454.webp","intro":"何苗，字叔達，東漢時期政治人物。","full":"何苗（2世紀?—189年），字叔達。本朱氏子，故名為朱苗。何進的異父異母弟，漢靈帝皇后何氏同母兄（司馬彪《續漢書·五行一》被誤載成同母弟），東漢時期政治人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-454"},{"i":"SANK-P-C-148","pid":"98851367525207174780","h":"何雙","s":"何双","cat":"人物","sub":"文官","y":"C","fac":"蜀漢","e":"木","a":2800,"d":3800,"ev":0,"art":"img/s1/card_SANK-P-C-148.webp","intro":"何雙，字漢偶，何宗之子，博學多才。","full":"何雙 （？—？年），字漢偶，何宗子，博學多才，善於辯論，滑稽多智，世人讚為有古之淳于髡、東方朔之風。曾任建寧郡雙柏縣長，早卒。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-148"},{"i":"SANK-P-C-149","pid":"86850741224395813327","h":"何顒","s":"何颙","cat":"人物","sub":"文官","y":"C","fac":"蜀漢","e":"木","a":2900,"d":3900,"ev":0,"art":"img/s1/card_SANK-P-C-149.webp","intro":"何顒，字伯求，南陽郡襄鄉縣人，東漢末年名士、官員。","full":"何顒（ㄩㄥˊ）（？—？），字伯求，南陽郡襄鄉縣（今湖北省棗陽市）人，東漢末年名士、官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-149"},{"i":"SANK-P-C-15","pid":"47380822929597876038","h":"侯成","s":"侯成","cat":"人物","sub":"武將","y":"C","fac":"曹魏","e":"火","a":3400,"d":3500,"ev":0,"art":"img/s1/card_SANK-P-C-15.webp","intro":"侯成，東漢末期人物，呂布騎將，隨呂布轉戰各地。","full":"侯成（？—？），東漢末期人物，呂布騎將，隨呂布轉戰各地。 侯成請一人照顧他十五匹馬，但那人卻帶著馬逃走，朝著沛城打算歸降劉備。侯成於是自己追還，馬匹失而復得。眾將於是合資送禮祝賀侯成，侯成釀了五六斛酒，捕獲了十餘頭豬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-15"},{"i":"SANK-P-C-537","pid":"08152678263698685539","h":"侯氏","s":"侯氏","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2400,"d":2500,"ev":0,"art":"img/s1/card_SANK-P-C-537.webp","intro":"侯氏，三國時期人物。","full":"侯姓為漢姓之一，在北宋成書的《百家姓》中排第230位，在2020年中國大陸全國姓氏中人口排第74位，據2008年統計約有300萬人口；在2018年全中華民國姓氏人數統計中則排第58位，約有5萬3千餘人口；在香港，上水侯氏是新界五大氏族之一。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-537"},{"i":"SANK-P-C-467","pid":"34306692304831760865","h":"侯音","s":"侯音","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-467.webp","intro":"侯音，東漢末年宛城守將。","full":"侯音（？—219年），東漢末年宛城守將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-467"},{"i":"SANK-P-C-32","pid":"32545613101909913495","h":"俄何燒戈","s":"俄何烧戈","cat":"人物","sub":"武將","y":"C","fac":"曹魏","e":"火","a":3400,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-32.webp","intro":"俄何燒戈，小説《三國演義》登場的羌族武將","full":"俄何燒戈，小説《三國演義》登場的羌族武將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-32"},{"i":"SANK-P-C-512","pid":"26166505477311949118","h":"俞涉","s":"俞涉","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3500,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-512.webp","intro":"俞涉為歷史小說《三國演義》中的虛構人物。","full":"俞涉為歷史小說《三國演義》中的虛構人物。根據《三國演義》中的描寫，俞涉是袁術部下將領。在各諸侯起兵討伐董卓時，俞涉與董卓軍將領華雄交戰，被華雄斬殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-512"},{"i":"SANK-P-C-150","pid":"09278575861805902150","h":"修允","s":"修允","cat":"人物","sub":"武將","y":"C","fac":"蜀漢","e":"木","a":3300,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-150.webp","intro":"修允，臨川人，三國時期孫吳將領","full":"修允，臨川人，三國時期孫吳將領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-150"},{"i":"SANK-P-C-151","pid":"83841553271471239086","h":"修則","s":"修则","cat":"人物","sub":"武將","y":"C","fac":"蜀漢","e":"木","a":3200,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-151.webp","intro":"修則，是三國時期孫吳將領，官至交州刺史、前部督","full":"修則，是三國時期孫吳將領，官至交州刺史、前部督。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-151"},{"i":"SANK-P-C-152","pid":"202765419 "s":"全寄","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":2200,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-159.webp","intro":"全寄，揚州吳郡錢唐縣人","full":"全寄（3世紀—250年），揚州吳郡錢唐縣（今浙江省杭州市）人。東吳將領全琮之次子，兄全緒，弟全懌、全吳。全琮娶東吳皇帝孫權女孫魯班，史書沒有記載全寄是否是她親生。 衛將軍全琮讓兒子全寄侍奉魯王孫霸，寫信告訴丞相陸遜，陸遜以為不可取。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-159"},{"i":"SANK-P-C-416","pid":"72137979916185139403","h":"全柔","s":"全柔","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":2800,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-416.webp","intro":"全柔，吳郡錢唐人，東吳將領全琮之父。","full":"全琮（198年—240年代247年或249年），字子璜，吳郡錢唐縣（今浙江省杭州市西）人，三國時東吳的重要將領，為人謙恭而有謀，常以國家為重。妻子雖是孫權的長女孫魯班，但仍能謙虛接士，毫不驕恣。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-416"},{"i":"SANK-P-C-161","pid":"11399390936658110347","h":"全緒","s":"全绪","cat":"人物","sub":"武將","y":"C","fac":"蜀漢","e":"木","a":2400,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-161.webp","intro":"全緒，揚州吳郡錢唐縣人","full":"全緒（3世紀—3世紀），揚州吳郡錢唐縣（今浙江省杭州市）人。東吳將領全琮之長子，弟全寄、全懌、全吳。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-161"},{"i":"SANK-P-C-165","pid":"43828111948859499841","h":"公孫脩","s":"公孙修","cat":"人物","sub":"君主宗室","y":"C","fac":"蜀漢","e":"木","a":2500,"d":3500,"ev":0,"art":"img/s1/card_SANK-P-C-165.webp","intro":"公孫脩，三國時期魏國人，公孫淵之子","full":"公孫脩，三國時期魏國人，公孫淵之子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-165"},{"i":"SANK-P-C-168","pid":"68741054648579861740","h":"典滿","s":"典满","cat":"人物","sub":"其他","y":"C","fac":"蜀漢","e":"木","a":3300,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-168.webp","intro":"典滿，表字不詳，陳留己吾人。","full":"典滿（？—？），表字不詳，陳留己吾人。東漢末曹操麾下猛將典韋之子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-168"},{"i":"SANK-P-C-170","pid":"29790731844683174638","h":"冬逢","s":"冬逢","cat":"人物","sub":"其他","y":"C","fac":"蜀漢","e":"木","a":2700,"d":3700,"ev":0,"art":"img/s1/card_SANK-P-C-170.webp","intro":"冬逢是三國時期蜀漢的蘇祁邑君","full":"冬逢（？—3世紀）是三國時期蜀漢的蘇祁邑君。 蜀漢建興年間（223年—237年），蘇祁邑君冬逢和他的弟弟隗渠，投降後又反叛。於是，越嶲太守張嶷誅殺冬逢。冬逢的妻子是旄牛王的女兒，張嶷通過計謀寬赦了她。而隗渠逃到西部邊境。","wiki":"https://seanown.org/mylege ,"art":"img/s1/card_SANK-P-C-189.webp","intro":"劉胄是三國時期蜀漢的南夷首領","full":"劉胄（?—233年）是三國時期蜀漢的南夷首領。 蜀漢建興九年（231年），張翼任庲降都督、綏南中郎將。張翼性格剛毅，執行法律嚴明，不迎合世俗的喜好。建興十一年（233年），南夷首領劉胄反叛，戰亂波及多個郡，張翼率軍討伐劉胄。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-189"},{"i":"SANK-P-C-200","pid":"84463098879889447191","h":"劉虞","s":"刘虞","cat":"人物","sub":"君主宗室","y":"C","fac":"東吳","e":"水","a":2600,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-200.webp","intro":"劉虞，字伯安，東海郯人，漢光武帝劉秀之子東海恭王劉彊的五世孫","full":"劉虞，字伯安，東海郯人，漢光武帝劉秀之子東海恭王劉彊的五世孫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-200"},{"i":"SANK-P-C-524","pid":"45998222640544425004","h":"劉豹","s":"刘豹","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3100,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-524.webp","intro":"劉豹，蜀漢青衣侯。","full":"劉豹可以指： 劉豹 (常山王)，東漢明帝劉莊之子劉昞的曾孫 劉豹 (蜀漢)，東漢末年蜀漢議郎陽泉侯 劉豹 (匈奴)，東漢末年至三國中期的南匈奴左賢王。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-524"},{"i":"SANK-P-C-11","pid":"82969531744319813215","h":"劉賢","s":"刘贤","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3300,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-11.webp","intro":"劉賢，劉度子，勸父投降。","full":"劉賢可以指： 劉賢 (吳國太子)，吳王劉濞之子 劉賢 (菑川王)，西漢菑川王，劉邦孫，劉肥之子 劉賢 (膠東王)，西漢膠東王，漢景帝孫，劉寄子 劉賢 (眾陵侯)，西漢長沙定王劉發之子 劉賢 (臨眾侯)，西漢菑川懿王劉志之子劉始昌六世子孫 劉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-11"},{"i":"SANK-P-C-191","pid":"01046796525285911737","h":"劉辟","s":"刘辟","cat":"人物","sub":"其他","y":"C","fac":"群雄","e":"土","a":3400,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-191.webp","intro":"劉辟，是東漢末年黃巾軍首領之一","full":"劉辟可以指下列人物： 劉辟 (東漢)：東漢時期的黃巾軍將領。 劉闢 (唐朝)：唐朝節度使。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-191"},{"i":"SANK-P-C-201","pid":"09295893531993758912","h":"劉邕","s":"刘邕","cat":"人物","sub":"文官","y":"C","fac":"東吳","e":"水","a":3500,"d":2500,"ev":0,"art":"img/s1/card_SANK-P-C-201.webp","intro":"劉邕，字南和，蜀漢將領。","full":"劉邕可以指： 劉邕 (蜀漢)：字南和，義陽人（《華陽國志》作零陵人）三國時期蜀漢將領，曾跟隨劉備入蜀，益州平定後為江陽太守，建興時為監軍後將軍、關內侯。 劉邕 (劉宋)：南北朝時期南朝宋官員，東晉末期人物劉穆之之孫，性嗜酒，且嗜食瘡痂。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-201"},{"i":"SANK-P-C-5","pid":"89505599802998281841","h":"劉阿","s":"刘阿","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3600,"d":2600,"ev":0,"art":"img/s1/card_SANK-P-C-5.webp","intro":"劉阿，三國時代孫吳武將。","full":"劉阿（？—？），三國時代孫吳武將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-5"},{"i":"SANK-P-C-366","pid":"48612244739377788515","h":"劉靖","s":"刘靖","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2700,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-366.webp","intro":"劉靖，字文恭，官至鎮北將軍。","full":"劉靖可以指： 劉靖 (曹魏)，劉馥兒子，在三國曹魏任官 劉靖 (匈奴王)，曹魏時代的匈奴王 劉靖 (前燕)，十六國時期前燕太傅參軍 劉靖 (東晉)，宋武帝劉裕祖父 劉靖 (北周)，北周政治人物，官至天水郡太守 劉靖 (清朝)，清朝官員，管轄。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-366"},{"i":"SANK-E-W-C-0012","pid":"59828753294258127345","h":"劍","s":"剑","cat":"武器","sub":"","y":"C","fac":"","e":"","a":60,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-C-0012.webp","intro":"劍是尖頭雙邊開鋒的冷兵器，可斬擊亦可突刺。","full":"劍，是一種尖頭且雙邊開鋒的冷兵器，通常是藉助其重量來斬擊，亦可用來突刺。其結構主要為劍柄和劍身，在劍柄的底部有些有柄頭好減少脫手機率和調節重心，而劍柄握柄的部分有些會用布料、繩索或鋼線等材料捲起來止滑。劍身的部分在其邊緣開刃，有些劍的劍身中間會有「血槽」來減輕重量，用劍的方式稱為劍術。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-C-0012"},{"i":"SANK-E-M-C-001","pid":"12060211811118314170","h":"劣馬","s":"劣马","cat":"坐騎","sub":"","y":"C","fac":"","e":"","a":null,"d":35,"ev":null,"art":"img/s1/card_SANK-E-M-C-001.webp","intro":"劣馬，品質低劣的馬。","full":"劣馬，品質低劣的馬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-M-C-001"},{"i":"SANK-E-W-C-0006","pid":"09883890735450985884","h":"匕首","s":"匕首","cat":"武器","sub":"","y":"C","fac":"","e":"","a":60,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-C-0006.webp","intro":"匕首指雙刃短劍，全長約在30公分左右","full":"匕首指雙刃短劍，全長約在30公分左右","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-C-0006"},{"i":"SANK-P-C-68","pid":"09639890463671093519","h":"區星","s":"区星","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"金","a":3300,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-68.webp","intro":"區星，東漢末年荊州南部長沙地區亂軍首領","full":"區星，東漢末年荊州南部長沙地區亂軍首領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-68"},{"i":"SANK-P-C-55","pid":"87720574919690392754","h":"千萬","s":"千万","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3200,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-55.webp","intro":"千萬，氐王，隨馬超起兵。","full":"東漢末氐族首領，與馬騰、韓遂等聯結，活動於關隴一帶，事散見於正史邊族記載。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-55"},{"i":"SANK-P-C-380","pid":"18070136608159981070","h":"卓膺","s":"卓膺","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3200,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-380.webp","intro":"卓膺，東漢末期武將，劉備的屬下。","full":"卓膺（?—?），東漢末期武將，劉備的屬下。 劉備入蜀時，殺白水軍督楊懷，派黃忠、卓膺率兵為先鋒攻打劉璋。劉備以諸將和士卒妻兒為質，引兵與黃忠、卓膺等進到涪城，占領涪城。劉璋派遣劉璝、冷苞、張任、鄧賢等拒先主於涪城。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-380"},{"i":"SANK-P-C-29","pid":"13594850719217597538","h":"卞喜","s":"卞喜","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3300,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-29.webp","intro":"汜水關守將，被關羽斬","full":"黃巾軍人物為東漢末年參與黃巾之亂的黃巾軍人物，包含《三國志》以及其他史書所記載的史實人物及《三國演義》中的虛構人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-29"},{"i":"SANK-P-C-207","pid":"31271278633666203710","h":"去卑","s":"去卑","cat":"人物","sub":"其他","y":"C","fac":"東吳","e":"水","a":2200,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-207.webp","intro":"去卑，生卒年不詳，大約生於東漢末年，歷經三國時代","full":"去卑，生卒年不詳，大約生於東漢末年，歷經三國時代。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-207"},{"i":"SANK-E-W-C-0015","pid":"38878383511519890316","h":"叉","s":"叉","cat":"武器","sub":"","y":"C","fac":"","e":"","a":60,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-C-0015.webp","intro":"叉是古代的一種用具，用於捕魚、農事與戰場上。","full":"叉是古代的一種用具，用於捕魚、農事與戰場上。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-C-0015"},{"i":"SANK-P-C-208","pid":"41358227062728237021","h":"句安","s":"句安","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-208.webp","intro":"句安，原是蜀漢的牙門將軍","full":"句安（?—?），原是蜀漢的牙門將軍。延熙十二年（249年）秋季，與李韶隨同姜維北伐魏國的雍州。姜維先差遣句安、李韶前往麴山修築二城並守之，但被魏將陳泰用計斷了糧道，城中糧缺，又苦等不到援兵，隨即降魏。","wiki":"https://seanown. legends-wiki.html#SANK-P-C-219"},{"i":"SANK-P-C-220","pid":"52455982471631329677","h":"向充","s":"向充","cat":"人物","sub":"文官","y":"C","fac":"東吳","e":"水","a":3600,"d":2600,"ev":0,"art":"img/s1/card_SANK-P-C-220.webp","intro":"向充，襄陽宜城人。","full":"向充（？—？），襄陽宜城人。三國時蜀漢將領。蜀漢官員向朗的侄兒，向寵之弟。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-220"},{"i":"SANK-P-C-221","pid":"04099151506789642297","h":"向條","s":"向条","cat":"人物","sub":"文官","y":"C","fac":"東吳","e":"水","a":3700,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-221.webp","intro":"向條，字文豹，襄陽宜城人，蜀漢、西晉官員。","full":"向條（？—？），字文豹，襄陽宜城人，蜀漢、西晉官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-221"},{"i":"SANK-P-C-223","pid":"82494441632271830944","h":"向舉","s":"向举","cat":"人物","sub":"文官","y":"C","fac":"東吳","e":"水","a":3800,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-223.webp","intro":"向舉，蜀漢青衣侯。","full":"向舉（？—？），蜀漢青衣侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-223"},{"i":"SANK-P-C-229","pid":"57575630815702798737","h":"吳匡","s":"吴匡","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":3400,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-229.webp","intro":"吳匡，東漢陳留人，何進部將，蜀漢吳班之父、吳懿之族父。","full":"吳匡（？—？），東漢陳留（今河南開封市）人，何進部將，蜀漢吳班之父、吳懿之族父。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-229"},{"i":"SANK-P-C-230","pid":"44860902422968316120","h":"吳奮","s":"吴奋","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":2000,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-230.webp","intro":"吳奮，吳郡人，東吳政治人物","full":"吳奮，吳郡人，東吳政治人物。是吳景的兒子。 建安八年吳景死後，吳奮被授兵為將，封為新亭侯。 死後由兒子吳安繼承。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-230"},{"i":"SANK-P-C-3","pid":"38749821453370544971","h":"吳子蘭","s":"吴子兰","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"金","a":2100,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-3.webp","intro":"將軍，衣帶詔參與者","full":"吳子蘭（2世紀—200年2月11日），東漢末年將軍。與車騎將軍董承、長水校尉种輯、偏將軍王子服同謀，稱受漢獻帝衣帶中密詔，與左將軍劉備謀誅司空曹操。劉備趁機在外起兵。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-3"},{"i":"SANK-P-C-231","pid":"88001615116018220068","h":"吳安","s":"吴安","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":2200,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-231.webp","intro":"吳安，吳郡人，孫吳政治人物","full":"吳安，吳郡人，孫吳政治人物。父吳奮死後，吳安被封為新亭侯。吳安屬魯王孫霸黨，因連坐死。由叔吳祺繼承。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-231"},{"i":"SANK-P-C-232","pid":"51284263103971073922","h":"吳巨","s":"吴巨","cat":"人物","sub":"文官","y":"C","fac":"東吳","e":"水","a":3200,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-232.webp","intro":"吳巨，荊州長沙郡人，官至蒼梧太守。","full":"吳巨（？—210年），荊州長沙郡人，東漢末年政治人物，官至蒼梧太守，與劉備為舊識。原本的蒼梧太守史璜死後，劉表派遣吳巨代替。吳巨後來與同為劉表派遣的交州刺史賴恭不和，吳巨舉兵逼走賴恭。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-232"},{"i":"SANK-P-C-234","pid":"56043553911539612231","h":"吳祺","s":"吴祺","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":2400,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-234.webp","intro":"吳祺，吳郡人，東吳政治人物","full":"吳祺可以指： 吳祺 (東吳) 吳祺 (弘治進士)。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-234"},{"i":"SANK-P-C-235","pid":"11126646172420741596","h":"吳範","s":"吴范","cat":"人物","sub":"其他","y":"C","fac":"東吳","e":"水","a":2100,"d":2200,"ev":0,"art":"img/s1/card_SANK-P-C-235.webp","intro":"吳範，字文則，會稽上虞人","full":"吳範（2世紀—226年），字文則，會稽上虞人。三國時東吳官員，擅長術數。與劉惇、趙達、嚴武、曹不興、皇象、宋壽和鄭嫗合稱東吳「八絕」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-235"},{"i":"SANK-P-C-538","pid":"38761567807061760427","h":"吳綱","s":"吴纲","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2700,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-538.webp","intro":"吳綱，諸葛誕的長史。","full":"吳綱可以指： 吳綱 (成化進士)，成化十一年進士、明朝政治人物。 吳綱 (弘治進士)，弘治三年進士、明朝政治人物。 吳綱 (曹魏)，諸葛誕的心腹。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-538"},{"i":"SANK-P-C-236","pid":"77305579731320188626","h":"吳纂","s":"吴纂","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":2700,"d":3700,"ev":0,"art":"img/s1/card_SANK-P-C-236.webp","intro":"吳纂，吳郡人，孫吳政治人物","full":"吳纂，吳郡人，孫吳政治人物。 父親吳祺死後，吳纂繼承，受封都亭侯。 吳纂的妻子是滕胤的女兒，滕胤被誅，一同遇害。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-236"},{"i":"SANK-P-C-240","pid":"2509657 ,"art":"img/s1/card_SANK-P-C-244.webp","intro":"呂曠，東平人，並被封為列侯。","full":"呂曠（？—？），東平人，與呂翔同是袁紹屬下，在袁紹去世後跟隨袁尚，曾當曹操於黎陽之戰敗北後與呂翔占據陽平，後來以陽平率眾投降曹操，並被封為列侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-244"},{"i":"SANK-P-C-227","pid":"43958930886997498846","h":"呂翔","s":"吕翔","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":3300,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-227.webp","intro":"呂翔，東平人，原袁紹屬下。","full":"呂翔（？—？），一作高翔，東平人，三國時人物，為袁紹之屬下，在袁紹去世後跟隨袁尚，曾當曹操於黎陽之戰敗北後與呂曠占據陽平，後來以陽平率眾投降曹操，被封為列侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-227"},{"i":"SANK-P-C-245","pid":"71745064771691596242","h":"呂興","s":"吕兴","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":3600,"d":2600,"ev":0,"art":"img/s1/card_SANK-P-C-245.webp","intro":"呂興，是三國時期孫吳末期人物","full":"呂興（？—264年），是三國時期孫吳末期人物。原本是吳交阯太守孫諝手下的郡吏。 吳永安六年（263年，魏景元四年）夏，吳主孫休派察戰鄧荀到交阯征調孔雀和大豬。鄧荀要求當地人護送三千隻孔雀到秣陵（今江蘇省南京市）。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-245"},{"i":"SANK-P-C-246","pid":"33558728742017584962","h":"呂雅","s":"吕雅","cat":"人物","sub":"文官","y":"C","fac":"東吳","e":"水","a":3700,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-246.webp","intro":"呂雅，南陽人，呂乂之子，曾任蜀漢謁者。","full":"呂雅 （？—？年），南陽人，呂乂子，呂辰弟，曾任蜀漢謁者，清廉嚴厲有文才，著有《格論》十五篇。 西晉泰始四年（268年）三月，羅憲跟隨晉武帝司馬炎在華林園參與宴會，晉武帝詢問故蜀漢大臣的子弟，又問起其中適合任用者，羅憲推薦了常忌、杜軫、壽良。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-246"},{"i":"SANK-P-C-247","pid":"77094807856021734425","h":"周喁","s":"周喁","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":3800,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-247.webp","intro":"周㬂，字仁明，會稽人，東漢末年人物","full":"周㬂，字仁明，會稽人，東漢末年人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-247"},{"i":"SANK-P-C-30","pid":"11663539165892198070","h":"周善","s":"周善","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":3000,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-30.webp","intro":"周善，《三國演義》杜撰之人物，史實上並無此人","full":"周善，《三國演義》杜撰之人物，史實上並無此人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-30"},{"i":"SANK-P-C-249","pid":"34544766221137320826","h":"周循","s":"周循","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":2000,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-249.webp","intro":"周循，周瑜長子，三國時期人物","full":"周循（2世紀—3世紀），周瑜長子，三國時期人物。據《三國志》記載，周循妻公主孫魯班，官拜騎都尉，有周瑜之風，但如同其父，也很早去世。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-249"},{"i":"SANK-P-C-250","pid":"19044518600818781976","h":"周旌","s":"周旌","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":2100,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-250.webp","intro":"周旌，東漢末沛國人","full":"周旌，東漢末沛國人。黃巾之亂時，與冀州刺史王芬、南陽許攸參與試圖廢靈帝改立合肥侯的事情，並試圖勸說曹操一起參加，但曹操拒絕，最後該事未能成功。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-250"},{"i":"SANK-P-C-251","pid":"48001724559397211481","h":"周昂","s":"周昂","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":3200,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-251.webp","intro":"周昂，會稽人，東漢末九江太守，周昕之兄。","full":"周昂可以指： 周昂 (東漢)，東漢末期人物，會稽人 周昂 (金朝)，金朝文學家 周昂 (正統舉人) 周昂 (成化應天舉人) 周昂 (成化進士)，明朝官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-251"},{"i":"SANK-P-C-252","pid":"69552502550645607059","h":"周昕","s":"周昕","cat":"人物","sub":"武將","y":"C","fac":"東吳","e":"水","a":3100,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-252.webp","intro":"周昕，字泰明，會稽人，東漢末年三國時期人物","full":"周昕，字泰明，會稽人，東漢末年三國時期人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-252"},{"i":"SANK-P-C-253","pid":"47932401146261402418","h":"周昭","s":"周昭","cat":"人物","sub":"文官","y":"C","fac":"東吳","e":"水","a":2400,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-253.webp","intro":"周昭，字恭遠，豫州穎川郡人。","full":"周昭，字恭遠，豫州穎川郡人，東吳中書郎，在《三國志·步騭傳》中上表提及步騭、嚴畯等人而列傳。孫亮即位時，下令周昭和韋昭、薛瑩、華覈、梁廣編纂《吳書》，然而周昭在孫休時代受連坐，華覈向孫休上表求情不得，最後周昭還是遭到伏法。著有《周子》九卷、《新論》，《周子》在隋朝之前就軼失，而《新論》在《太平御覽·職官部卷三十九》可見，當中描述宗室孫奇早年事蹟。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-253"},{"i":"SANK-P-C-541","pid":"07786395371976081381","h":"周朝","s":"周朝","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-541.webp","intro":"周朝是中國歷史上繼商朝之後的世襲王朝。","full":"周朝是中國歷史上繼商朝之後的世襲王朝，是先秦分封制度發展完善的 152259552966164781","h":"土安","s":"土安","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3200,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-92.webp","intro":"烏戈國部將，與奚泥並稱","full":"藤甲軍，《三國演義》第九十回登場的軍隊。南蠻之地烏戈國王兀突骨屬下的戰鬥軍隊。 諸葛亮率蜀漢大軍征伐南蠻，七擒七縱南蠻王孟獲。孟獲在帶來洞主的建議下逃亡烏戈國，依靠兀突骨。第七次挑戰諸葛亮。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-92"},{"i":"SANK-P-C-264","pid":"16847946688853940476","h":"士䵋","s":"士䵋","cat":"人物","sub":"文官","y":"C","fac":"晉","e":"土","a":3700,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-264.webp","intro":"士䵋，蒼梧郡廣信人，東漢政治人物","full":"士䵋，蒼梧郡廣信人，東漢政治人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-264"},{"i":"SANK-P-C-265","pid":"19785621809435534742","h":"士仁","s":"士仁","cat":"人物","sub":"其他","y":"C","fac":"晉","e":"土","a":3800,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-265.webp","intro":"士仁，字君義，幽州廣陽人，蜀漢與孫吳人物。","full":"士仁（？—？），字君義，一作傅士仁，幽州廣陽人（今北京市），三國時期蜀漢與孫吳人物。史書上一般都記載其姓名為士仁，然而《三國志·蜀志·關羽傳》有一個地方寫成傅士仁，《三國演義》乃至《資治通鑑》的一些章節亦將其記為傅士仁，但學者多認為是史書傳。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-265"},{"i":"SANK-P-C-267","pid":"50889193864794091897","h":"壽良","s":"寿良","cat":"人物","sub":"文官","y":"C","fac":"晉","e":"土","a":3900,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-267.webp","intro":"壽良，字文淑，蜀郡成都人。","full":"壽良（？—？），字文淑，蜀郡成都人。父親與祖父兩代都曾擔任犍為太守，年少時與犍為人張微、費緝齊名。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-267"},{"i":"SANK-P-C-269","pid":"75246418288961054345","h":"夏侯咸","s":"夏侯咸","cat":"人物","sub":"武將","y":"C","fac":"晉","e":"土","a":2000,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-269.webp","intro":"夏侯鹹是三國時期曹魏將領","full":"夏侯咸（生卒年不詳）是三國時期曹魏將領。曹魏景元四年（263年），曹魏相國司馬昭決定向蜀漢發動戰爭，派遣鍾會、鄧艾、諸葛緒兵分三路討伐蜀漢，夏侯咸隸屬鍾會麾下司馬，跟隨鍾會攻伐蜀漢。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-269"},{"i":"SANK-P-C-40","pid":"14206585964487533223","h":"夏侯德","s":"夏侯德","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3400,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-40.webp","intro":"以下是三國時期的虛構人物列表。","full":"以下是三國時期的虛構人物列表。列表主要包括14世紀羅貫中歷史小說《三國演義》和其他三國文化參考資料中的角色。","wiki": ，三國時期人物。","full":"孫嘿（ㄇㄛˋ）（？—？），孫吳中期人物，官至中書令。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-280"},{"i":"SANK-P-C-308","pid":"19147192710001358974","h":"孫奉","s":"孙奉","cat":"人物","sub":"君主宗室","y":"C","fac":"群雄","e":"土","a":3900,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-308.webp","intro":"孫奉，表字不詳，吳郡富春人","full":"孫奉（3世紀—270年），表字不詳，吳郡富春人。三國時孫吳長沙桓王孫策之孫。父親孫紹死後，孫奉繼承上虞侯爵位。 在吳末帝建衡二年（270年），民間有傳聞孫皓已死，說孫奉或章安侯孫奮其中一個會當上皇帝，孫皓知道後便誅殺他們。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-308"},{"i":"SANK-P-C-282","pid":"65877311624135479783","h":"孫寒華","s":"孙寒华","cat":"人物","sub":"君主宗室","y":"C","fac":"晉","e":"土","a":2000,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-282.webp","intro":"孫寒華，三國時期人物。","full":"孫寒華（？年—？年），東吳女道士，孫賁孫女，孫奚之女，一說則是孫權的孫女。杜契的弟子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-282"},{"i":"SANK-P-C-284","pid":"60562174917306039985","h":"孫康","s":"孙康","cat":"人物","sub":"武將","y":"C","fac":"晉","e":"土","a":2100,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-284.webp","intro":"孫康，東漢末年徐州刺史陶謙麾下騎都尉臧霸手下孫觀之兄","full":"孫康，東漢末年徐州刺史陶謙麾下騎都尉臧霸手下孫觀之兄。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-284"},{"i":"SANK-P-C-309","pid":"77606053843087734106","h":"孫弘","s":"孙弘","cat":"人物","sub":"君主宗室","y":"C","fac":"群雄","e":"土","a":2200,"d":2100,"ev":0,"art":"img/s1/card_SANK-P-C-309.webp","intro":"孫弘，會稽人，後為孫權託孤大臣。","full":"孫弘可以指： 孫弘 (三國)，三國時代東吳大臣 孫弘 (1970年)，吉林省遼源市委副書記、市長。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-309"},{"i":"SANK-P-C-310","pid":"90939892013026410574","h":"孫怡","s":"孙怡","cat":"人物","sub":"武將","y":"C","fac":"群雄","e":"土","a":2300,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-310.webp","intro":"孫怡，生於吉林省集安市，中國女演員。","full":"孫怡（1993年6月4日—），生於吉林省集安市，中國女演員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-310"},{"i":"SANK-P-C-285","pid":"21962670940616258903","h":"孫恩","s":"孙恩","cat":"人物","sub":"君主宗室","y":"C","fac":"晉","e":"土","a":2400,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-285.webp","intro":"孫恩，三國東吳的皇族","full":"孫恩（？—402年），字靈秀，琅邪郡（治所在今山東省臨沂市），西晉中書令孫秀之後，世奉五斗米道。399年起兵反晉，402年敗死，餘眾由孫恩妹夫盧循領導，世稱「孫恩盧循之亂」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-285"},{"i":"SANK-P-C-286","pid":"50817289447756196212","h":"孫據","s":"孙据","cat":"人物","sub":"君主宗室","y":"C","fac":"晉","e":"土","a":2500,"d":3500,"ev":0,"art":"img/s1/card_SANK-P-C-286.webp","intro":"孫據，三國東吳的皇族","full":"孫據（？—259年1月），三國東吳的皇族。孫堅弟弟孫靜的曾孫，孫暠的孫子，孫綽的兒子，孫綝的弟弟，孫恩、孫幹、孫闓的兄弟。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-286"},{"i":"SANK-P-C-419","pid":"96951697446638535365","h":"孫晧","s":"孙晧","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":2600,"d":3600,"ev":0,"art":"img/s1/card_SANK-P-C-419.webp","intro":"吳末帝孫皓，字元宗，幼名彭祖，又字皓宗，《三國志》原名為孫晧","full":"吳末帝孫皓（243年—284年），字元宗，幼名彭祖，又字皓宗，《三國志》原名為孫晧。為廢太子孫和之子，吳大帝孫權之孫，在位約十六年（264年—280年），是三國時期東吳的第四位，同時也是三國最後一位皇帝。 吳景帝孫休逝世時，太子非常年幼。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-419"},{"i":"SANK-P-C-287","pid":"52063440924320959618","h":"孫暠","s":"孙暠","cat":"人物","sub":"君主宗室","y":"C","fac":"晉","e":"土","a":2700,"d":3700,"ev":0,"art":"img/s1/card_SANK-P-C-287.webp","intro":"孫暠，三國吳吳郡富春人，孫靜之長子，孫策、孫權之堂兄","full":"孫暠，三國吳吳郡富春人，孫靜之長子，孫策、孫權之堂兄。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-287"},{"i":"SANK-P-C-14","pid":"21853853040789645666","h":"孫朗","s":"孙朗","cat":"人物","sub":"","y":"C","fac":"東吳","e":"火","a":2800,"d":2600,"ev":0,"art":"img/s1/card_SANK-P-C-14.webp","intro":"孫朗，軍閥孫堅庶子。","full":"孫朗（？—？），別名孫仁，三國時期人物，軍閥孫堅庶子，生母不詳，見於《三國志·吳書·孫堅傳》裴注引虞喜《志林》。而《三國演義》中則將其設定為字「早安」，母親是吳國太，孫堅庶子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-14"},{"i":"SANK-P-C-420","pid":"48297708790721348494","h":"孫松","s":"孙松","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3000,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-420.webp","intro":"孫松，字子喬，吳郡富春人。","full":"孫松（？—231年），字子喬，吳郡富春（今浙江杭州富陽）人。東吳宗室，孫堅三子孫翊之子。為人善與人交，輕財好施。 孫松鎮巴丘時曾多次訪問陸遜討論自己過失，後來就因犯下小錯而被陸遜當面責備，孫松當時顯得不太服氣。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-420"},{"i":"SANK-P-C-311","pid":"42109121636502224812","h":"孫楷","s":"孙楷","cat":"人物","sub":"武將","y":"C","fac":"群雄","e":"土","a":3000,"d":2000,"ev":0,"art":"img/s1/card_SANK-P-C-311.webp","intro":"孫楷可以是下列人物：\n\n孫楷，吳吳郡富春人，孫韶之子。","full":"孫楷可以是下列人物： 孫楷 (三國)，吳吳郡富春人，孫韶之子。 孫楷 (清朝史家)，《秦會要》作者。 孫楷 (清朝畫家)，字子書。清朝仁和（今杭州）人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-311"},{"i":"SANK-P-C-543","pid":"54735578591940570377","h":"孫氏","s":"孙氏","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2300,"d":2400,"ev":0,"art":"img/s1/card_SANK-P-C-543.webp","intro":"孫氏，三國時期人物。","full":"孫姓是一個漢姓，在中國以至韓國都有使用，在中國《百家姓》中排第3位，在現今中國大陸姓氏排行第12位。由來已久，姓源眾多，據史書記載，最早寬可追溯到3000多年前的周文王，也是東吳的國姓。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-543"},{"i":"SANK-P-C-418","pid":"09803874803313675077","h":"孫河","s":"孙河","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3400,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-418.webp","intro":"孫河，字伯海，吳郡富春縣人。","full":"孫河（2世紀—204年），字伯海，吳郡富春縣人。東漢末東吳勢力將領。孫堅族子，統領孫堅親兵，作戰常為前驅，典知內事，被視為心腹。孫堅死後，先後跟隨孫策平定江東及輔助年幼的孫權接任江東基業。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-418"},{"i":"SANK-P-C-290","pid":"83202046421022397955","h":"孫泰","s":"孙泰","cat":"人物","sub":"君主宗室","y":"C","fac":"晉","e":"土","a":3300,"d":2300,"ev":0,"art":"img/s1/card_SANK-P-C-290.webp","intro":"孫泰，三國東吳宗室，孫權之弟孫匡之子。","full":"孫泰可以指： 孫泰 (三國)，三國時期人物，孫匡之子 孫泰 (晉朝)，字敬遠，為五斗米道教主 孫泰，唐代陝西山陽人，少時拜皇甫穎為師，重仁義，有古賢之操守。娶阿姨瞎眼的大女兒為妻。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-290"},{"i":"SANK-P-C-291","pid":"48034563856123452590","h":"孫炎","s":"孙炎","cat":"人物","sub":"文官","y":"C","fac":"群雄","e":"土","a":3400,"d":2400,"ev":0,"art":"img/s1/card_SANK-P-C-291.webp","intro":"孫炎，三國時期人物。","full":"三國經學家，字叔然，樂安人，鄭玄再傳弟子，通《周易》《春秋》諸經，著有訓釋數種，時稱東州大儒。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-291"},{"i":"SANK-P-C-312","pid":"98129451959651681356","h":"孫狼","s":"孙狼","cat":"人物","sub":"其他","y":"C","fac":"群雄","e":"土","a":3500,"d":2500,"ev":0,"art":"img/s1/card_SANK-P-C-312.webp","intro":"孫狼，東漢末年民變首領。","full":"孫狼（？—？），東漢末年民變首領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-312"},{"i":"SANK-P-C-293","pid":"14594543804208168925","h":"孫瑾","s":"孙瑾","cat":"人物","sub":"君主宗室","y":"C","fac":"群雄","e":"土","a":3600,"d":2600,"ev":0,"art":"img/s1/card_SANK-P-C-293.webp","intro":"孫瑾，東吳末帝孫皓之長子。","full":"孫瑾，三國東吳末帝孫皓之長子。孫皓字元宗，是吳大帝孫權之孫，在位約十六年（264—280），為東吳第四位、也是三國最後一位皇帝。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-293"},{"i":"SANK-P-C-296","pid":"28517311492946505369","h":"孫盛","s":"孙盛","cat":"人物","sub":"武將","y":"C","fac":"群雄","e":"土","a":3700,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-296.webp","intro":"孫盛，三國時代孫吳將領","full":"孫盛（302年—373年），字安國，太原中都（今山西省平遙縣西北）人。東晉史學家。馮翊郡太守孫楚之孫，潁川郡太守孫恂之子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-296"},{"i":"SANK-P-C-300","pid":"36273033990399355278","h":"孫綽","s":"孙绰","cat":"人物","sub":"君主宗室","y":"C","fac":"群雄","e":"土","a":3800,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-300.webp","intro":"孫綽，三國東吳宗室，是孫靜長子孫暠的長子","full":"孫綽，三國東吳宗室，是孫靜長子孫暠的長子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-300"},{"i":"SANK-P-C-313","pid":"36128913609479009343","h":"孫虔","s":"孙虔","cat":"人物","sub":"君主宗室","y":"C","fac":"群雄","e":"土","a":3900,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-313.webp","intro":"孫虔，三國時代東吳末代皇帝孫皓的次子。","full":"孫虔（3世紀—？），中國三國時代東吳末代皇帝孫皓的次子，寶鼎四年（269年）春正月，孫皓立孫虔為淮陽王，鳳凰二年（273年）秋九月，改封為魯王。天紀四年（280年）三月，孫皓率太子孫瑾、魯王孫虔等21人投降晉朝，東吳政權滅亡。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-313"},{"i":"SANK-P-C-314","pid":"57880371236953658089","h":"孫諝","s":"孙谞","cat":"人物","sub":"文官","y":"C","fac":"群雄","e":"土","a":2000,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-314.webp","intro":"孫諝，三國時期孫吳官員，在孫休時任交阯太守","full":"孫諝，三國時期孫吳官員，在孫休時任交阯太守。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-314"},{"i":"SANK-P-C-316","pid":"09708477344064835422","h":"孫鄰","s":"孙邻","cat":"人物","sub":"武將","y":"C","fac":"群雄","e":"土","a":2100,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-316.webp","intro":"孫鄰，字公達，吳郡富春人","full":"孫鄰（202年—249年），字公達，吳郡富春（今浙江富陽）人。東吳宗室，孫權堂兄孫賁子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-316"},{"i":"SANK-P-C-317","pid":"37435216908455154045","h":"孫𩅦","s":"孙𩅦","cat":"人物","sub":"君主宗室","y":"C","fac":"群雄","e":"土","a":2200,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-317.webp","intro":"孫𩅦，字莔，三國東吳景帝孫休的長子","full":"孫𩅦，字莔，三國東吳景帝孫休的長子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-317"},{"i":"SANK-P-C-318","pid":"70950067356241586970","h":"宋建","s":"宋建","cat":"人物","sub":"君主宗室","y":"C","fac":"群雄","e":"土","a":2300,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-318.webp","intro":"宋建，涼州之亂的地方割據軍閥，東漢末年隴西郡枹罕縣人","full":"宋建，涼州之亂的地方割據軍閥，東漢末年隴西郡枹罕縣人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-318"},{"i":"SANK-P-C-480","pid":"77046995530805647831","h":"宋忠","s":"宋忠","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2600,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-480.webp","intro":"宋忠，三國時期人物。","full":"宋忠可以指： 宋忠 (三國)，東漢末年儒家學者、注釋家 宋忠 (明朝)，明朝軍事將領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-480"},{"i":"SANK-P-C-70","pid":"81229285148269862698","h":"宋憲","s":"宋宪","cat":"人物","sub":"武將","y":"C","fac":"曹魏","e":"火","a":3500,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-70.webp","intro":"宋憲，東漢末年武將，早期為呂布部將，隨呂布轉戰各地。","full":"宋憲（？—？），東漢末年武將，早期為呂布部將，隨呂布轉戰各地。呂布被圍於下邳時，宋憲、魏續和侯成投降曹操，促使呂布最終失敗被曹操所殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-70"},{"i":"SANK-P-C-10","pid":"56601097560727110466","h":"審榮","s":"审荣","cat":"人物","sub":"武將","y":"C","fac":"曹魏","e":"火","a":3100,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-10.webp","intro":"審榮，魏郡人，東漢末期人物，審配兄子，袁尚部下，為東門校尉","full":"審榮，魏郡人，東漢末期人物，審配兄子，袁尚部下，為東門校尉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-10"},{"i":"SANK-P-C-320","pid":"92220272910612445409","h":"射堅","s":"射坚","cat":"人物","sub":"武將","y":"C","fac":"群雄","e":"土","a":2600,"d":2500,"ev":0,"art":"img/s1/card_SANK-P-C-320.webp","intro":"射堅，字文固，扶風郡人。","full":"射堅（？—？），字文固，扶風郡人，射援兄，年少時就有美好的名聲，被徵辟到三公府擔任黃門侍郎。官至蜀郡太守 。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-320"},{"i":"SANK-P-C-376","pid":"47993810618867448237","h":"射援","s":"射援","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":2700,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-376.webp","intro":"射援，字文雄，扶風郡人，射堅弟，官至蜀漢從事中郎。","full":"射援（？—？），字文雄，扶風郡人，射堅弟，官至蜀漢從事中郎 。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-376"},{"i":"SANK-P-C-511","pid":"92407567569907391649","h":"尤突","s":"尤突","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-511.webp","intro":"尤突，三國時期人物。","full":"東吳鄱陽一帶賊帥，後為陸遜、賀齊等率軍討破。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-511"},{"i":"SANK-P-C-321","pid":"35368360940474736942","h":"尹大目","s":"尹大目","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2200,"d":2100,"ev":0,"art":"img/s1/card_SANK-P-C-321.webp","intro":"尹大目，字大目，曹家的家奴，曹魏建國後，在天子左右侍奉。","full":"尹大目（？—？），字大目，曹家的家奴，曹魏建國後，在天子左右侍奉。曾任殿中校尉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-321"},{"i":"SANK-P-C-446","pid":"85993847676139989865","h":"尹楷","s":"尹楷","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3100,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-446.webp","intro":"尹楷，東漢末年人物，袁尚部下，武安長。","full":"尹楷，東漢末年人物，袁尚部下，武安長。建安九年（204年），袁尚再攻平原，曹操趁機攻鄴。尹楷屯毛城，以通上黨糧道，為曹操擊敗，期後下落不明。《三國演義》加插一段尹楷為許褚斬殺一幕。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-446"},{"i":"SANK-P-C-21","pid":"01406399900462720571","h":"尹禮","s":"尹礼","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-21.webp","intro":"尹禮，泰山賊將，降曹。","full":"尹禮可以指： 尹禮 (東漢) 尹禮 (正統進士)。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-21"},{"i":"SANK-P-C-348","pid":"61565995139906051176","h":"岑威","s":"岑威","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3100,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-348.webp","intro":"以下是三國時期的虛構人物列表。","full":"以下是三國時期的虛構人物列表。列表主要包括14世紀羅貫中歷史小說《三國演義》和其他三國文化參考資料中的角色。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-348"},{"i":"SANK-P-C-76","pid":"76324140156957878896","h":"岑昏","s":"岑昏","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":2000,"d":2100,"ev":0,"art":"img/s1/card_SANK-P-C-76.webp","intro":"岑昏，南陽郡棘陽縣人","full":"岑昏（？—280年），南陽郡棘陽縣人。三國時期東吳人，吳末帝孫皓的佞臣。是東漢征南大將軍岑彭，名士岑晊的後代。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-76"},{"i":"SANK-P-C-528","pid":"61872072729477011617","h":"崔勇","s":"崔勇","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3200,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-528.webp","intro":"崔勇，三國時期人物。","full":"崔勇可以指： 崔勇 (三國演義)：《三國演義》虛構人物 崔勇 (1969年)：上海交通大學教授。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-528"},{"i":"SANK-P-C-336","pid":"22117174139198832286","h":"崔林","s":"崔林","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2400,"d":2600,"ev":0,"art":"img/s1/card_SANK-P-C-336.webp","intro":"崔林，字德儒，清河郡東武城縣人，崔琰從弟。","full":"崔林（2世紀？—245年），字德儒，清河郡東武城縣（今河北省衡水市故城縣）人，崔琰從弟。有子崔述、崔隨、崔參。出身清河崔氏南祖。在曹操平定冀州時被授為塢縣縣長，遷冀州別駕、丞相掾屬。曹操成為魏王后，擔任魏國御史中丞。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-336"},{"i":"SANK-P-C-539","pid":"83868477555004272941","h":"崔氏","s":"崔氏","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2500,"d":2200,"ev":0,"art":"img/s1/card_SANK-P-C-539.webp","intro":"崔氏，三國時期人物。","full":"崔（漢語拼音:Cui；威妥瑪拼音:Tsui），是漢字姓氏之一，在《百家姓》中排第189位，目前在中國大陸的人口統計中排名第56，約有509萬人（2013年統計資料）。但這個姓氏同時也常見於朝鮮半島。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-539"},{"i":"SANK-P-C-437","pid":"74670057295863668320","h":"左奕","s":"左奕","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-437.webp","intro":"左奕，三國時期人物。","full":"東吳將領，呂蒙襲取荊州時麾下部將之一。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-437"},{"i":"SANK-P-C-540","pid":"17896281734083501415","h":"左靈","s":"左灵","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2800,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-540.webp","intro":"左靈，東漢末期政治人物。","full":"左靈（？—？），東漢末期政治人物。官至遙領南郡太守。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-540"},{"i":"SANK-P-C-337","pid":"63430652924349682815","h":"師纂","s":"师纂","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a 0,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-489.webp","intro":"張先，字子野，湖州烏程人。","full":"張先（990年—1078年），字子野，湖州烏程（今浙江湖州吳興）人，因張先曾在安陸郡（今湖北省安陸市）任職多年，人亦稱張安陸，北宋婉約派詞人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-489"},{"i":"SANK-P-C-485","pid":"19084342617322862686","h":"張勳","s":"张勋","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-485.webp","intro":"張勳，字少軒，號松壽老人，為長江巡閱使、定武上將軍。","full":"張勳（1854年12月14日—1923年9月12日），原名張和，字少軒，號松壽老人，中國江西南昌府奉新縣赤田村人。清末民初大臣。清朝官至議政大臣、北洋大臣、直隸總督，歷任江南提督，護理兩江總督，民國時，為長江巡閱使、定武上將軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-485"},{"i":"SANK-P-C-424","pid":"83737737122863169356","h":"張承","s":"张承","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-424.webp","intro":"張承，字仲嗣，三國時東吳官員，重臣張昭之子。","full":"張承（177年—244年），字仲嗣，三國時東吳官員，重臣張昭之子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-424"},{"i":"SANK-P-C-52","pid":"61485130374710182066","h":"張橫","s":"张横","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3300,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-52.webp","intro":"張橫，歷史上也確有其人，小說《水滸傳》中人物。","full":"張橫，小說《水滸傳》中人物，綽號船火兒，上應三十六天罡中的天平星，歷史上也確有其人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-52"},{"i":"SANK-P-C-352","pid":"53538491721407158686","h":"張泉","s":"张泉","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2900,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-352.webp","intro":"張泉，三國時期人物。","full":"張泉可以指： 張泉 (東漢)，東漢末年政治人物 張泉 (香港)，香港花卉工會理事長，第四屆、五屆全國人大代表 張泉 (1978年)，山東德州人，合肥市人民政府市長 張泉 (1980年)，中國工程師，第十二屆全國人大代表。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-352"},{"i":"SANK-P-C-546","pid":"44975911016076996657","h":"張球","s":"张球","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3400,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-546.webp","intro":"張球，三國時期人物。","full":"《三國演義》魏國將領。隨曹叡於合淝抵禦響應諸葛亮北伐的吳軍，協助滿寵火攻諸葛瑾船隊，擊退吳軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-546"},{"i":"SANK-P-C-545","pid":"9095748244
