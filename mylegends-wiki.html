mylegends-wiki.html#SANK-P-C-13"},{"i":"SANK-P-C-529","pid":"14637123108180485010","h":"張英","s":"张英","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3400,"d":3500,"ev":0,"art":"img/s1/card_SANK-P-C-529.webp","intro":"張英，三國時期人物。","full":"張英可以指： 張英 (東漢)，東漢末期人物 張英 (前燕)，前燕軍事人物 張英 (永樂進士)，明朝永樂二年進士，政治人物 張英 (正統解元)，明朝正統三年解元 張英 (成化進士)，明朝成化八年進士，政治人物 張英 (正德進士)，明朝正德三年。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-529"},{"i":"SANK-P-C-383","pid":"71171169993881023165","h":"張著","s":"张著","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3100,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-383.webp","intro":"張著，三國時期人物。","full":"蜀漢將領。漢中之戰時隨黃忠襲擊曹軍糧庫，戰亂中負傷，被趙雲救出。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-383"},{"i":"SANK-P-C-382","pid":"96116558773944660351","h":"張達","s":"张达","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3100,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-382.webp","intro":"張達，三國時期人物。","full":"張達可以指： 張達 (三國)，三國時期蜀漢的將領，曾和范彊共同謀殺張飛 張達 (材官)，曹魏齊王材官 張達 (南宋)，南宋末期的將領，曾參與厓山海戰 張達 (天順進士)，明朝官員，天順八年進士，官至工部右侍郎 張達 (嘉靖進士)，嘉靖二十三。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-382"},{"i":"SANK-P-C-97","pid":"93692260627065941683","h":"張闓","s":"张闿","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"金","a":3300,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-97.webp","intro":"張闓，部將，殺曹操父親。","full":"張闓可以指： 張闓 (東漢)，東漢末期陶謙部將。出現在《三國志·魏書·武帝紀》的引注《吳書》中 張闓 (東晉)，東晉時期的人物，東吳名臣張昭之曾孫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-97"},{"i":"SANK-P-C-484","pid":"74660750138477915304","h":"張顗","s":"张𫖮","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3200,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-484.webp","intro":"張顗，東漢末年人物，袁尚部下。","full":"張顗，東漢末年人物，袁尚部下。建安九年（204年），袁尚再攻平原，曹操趁機攻鄴。袁尚領兵來救，馬延、張顗臨陣倒戈，令袁尚軍潰不成軍，期後下落不明。《三國演義》加插一段二人在曹操赤壁之戰敗陣時為甘寧斬殺一幕。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-484"},{"i":"SANK-P-C-20","pid":"30132674690899806179","h":"強端","s":"强端","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3500,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-20.webp","intro":"強端，氐王，斬吳蘭。","full":"強端（？—？），東漢末至三國時陰平氐人，曾經在建安二十三年（218年）下辯之戰時斬殺劉備部將吳蘭。強端可能在蜀漢占領武都郡、陰平郡時投降蜀漢。在諸葛亮去世後不久的青龍三年（235年）再次投降曹魏。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-20"},{"i":"SANK-E-W-C-004","pid":"67715029360688465508","h":"彈弓","s":"弹弓","cat":"武器","sub":"","y":"C","fac":"","e":"","a":60,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-C-004.webp","intro":"彈弓可作為冷兵器或玩具。","full":"彈弓可作為冷兵器或玩具。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-C-004"},{"i":"SANK-P-C-347","pid":"96087445051870355408","h":"徐商","s":"徐商","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-347.webp","intro":"徐商，字義聲，河內郡濟源縣人，唐朝官員。","full":"徐商（？—？），字義聲，一字秋卿，河內郡濟源縣人，唐朝官員，唐懿宗年間任宰相。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-347"},{"i":"SANK-P-C-412","pid":"48080030476934259048","h":"徐琨","s":"徐琨","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-412.webp","intro":"徐琨，三國時期人物。","full":"徐琨可以指： 徐琨 (東漢)，吳郡富春縣人，東漢末及三國時東吳勢力將領 徐琨 (臺灣縣知縣)，漢軍正黃旗人。台灣府台灣縣知縣 徐琨 (隣水典史)，嘉慶年間任隣水縣典史。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-412"},{"i":"SANK-P-C-346","pid":"77794024561692583298","h":"徐璆","s":"徐璆","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2900,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-346.webp","intro":"徐璆，字孟玉，廣陵海西人，活躍於東漢末年，度遼將軍徐淑之子。","full":"徐璆（？—？），字孟玉，廣陵海西人，活躍於東漢末年，度遼將軍徐淑(表字伯進)之子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-346"},{"i":"SANK-P-C-50","pid":"70274934035219894512","h":"忙牙長","s":"忙牙长","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":3500,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-50.webp","intro":"忙牙長，中國古典通俗歷史小説《三國演義》登場的虛構武將","full":"忙牙長，中國古典通俗歷史小説《三國演義》登場的虛構武將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-50"},{"i":"SANK-P-C-527","pid":"33243007747022362214","h":"惠衢","s":"惠衢","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2900,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-527.webp", 氏。李姓在朝鮮半島及越南也是常見姓氏，於韓國李姓是第二大氏。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-556"},{"i":"SANK-P-C-90","pid":"61133506416888909672","h":"李蒙","s":"李蒙","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-90.webp","intro":"李傕部將，隨軍作戰","full":"李蒙可以指： 李蒙 (東漢)，東漢末期人物 李蒙 (1937年)，中國政治人物，第十屆全國政協副主席、中國農工民主黨中央原常務副主席 李蒙 (美國華人)，美國華人，生於洛杉磯，前美國駐華大使駱家輝的第二任妻子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-90"},{"i":"SANK-P-C-434","pid":"96386169277864705762","h":"李衡","s":"李衡","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":2500,"d":2600,"ev":0,"art":"img/s1/card_SANK-P-C-434.webp","intro":"李衡，三國時期人物。","full":"李衡可以指： 李衡 (東吳)，三國時孫吳文官，曾出使蜀漢等 李衡 (紹興進士)，宋朝政治人物、紹興十五年進士 李衡 (永樂進士)，明朝政治人物、永樂二年進士。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-434"},{"i":"SANK-P-C-364","pid":"77610391658899387603","h":"李豐","s":"李丰","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2900,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-364.webp","intro":"李豐，三國時期人物。","full":"李豐可以指： 李豐 (東漢)，東漢末期人物，袁術部將 李豐 (曹魏)，三國時期曹魏人物，中書令 李豐 (蜀漢)，三國時期蜀漢人物，李嚴之子 李豐 (西晉)，西晉時期叛軍領袖汲桑麾下武將 李豐 (北魏)，北魏宦官 李豐，泰陵令，北宋宰相李沆曾。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-364"},{"i":"SANK-P-C-521","pid":"22134066403143397289","h":"李輔","s":"李辅","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3200,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-521.webp","intro":"李輔，三國時期人物。","full":"李輔可以指： 李輔 (曹魏) 李輔 (西晉) 李輔 (北魏) 李輔 (嘉靖進士)，嘉靖三十八年進士、明朝政治人物 李輔 (道光進士)，道光二十四年進士、清朝政治人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-521"},{"i":"SANK-P-C-386","pid":"62890355939783783231","h":"杜瓊","s":"杜琼","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":2700,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-386.webp","intro":"杜瓊，字伯瑜，蜀郡成都人，蜀漢官員，占星家。","full":"杜瓊（160年代—250年），字伯瑜。蜀郡成都人，蜀漢官員，占星家。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-386"},{"i":"SANK-P-C-459","pid":"14188524063453674238","h":"桓鄰","s":"桓邻","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":24 孫綝從兄,又名孫憲）、王惇、孫慮和王惇共謀殺害孫綝。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-327"},{"i":"SANK-P-C-77","pid":"38370658995267097073","h":"王方","s":"王方","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-77.webp","intro":"李傕部將，被馬超斬","full":"王方可以指： 王方 (東漢) 王方 (宋朝)，進士，王弗之父 王方 (1983年)。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-77"},{"i":"SANK-P-C-22","pid":"99177170450178211854","h":"王植","s":"王植","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2100,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-22.webp","intro":"滎陽太守，被關羽斬","full":"王植可以指： 王植 (三國演義) 王植 (資治通鑑) 王植 (康熙進士)，字櫰三，號戇思，直隸深澤人 王植 (嘉慶進士)，字叔培，號曉林，直隸清苑人 王植 (第三屆全國人大代表)。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-22"},{"i":"SANK-P-C-325","pid":"47523216681554791738","h":"王沈","s":"王沈","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2300,"d":2400,"ev":0,"art":"img/s1/card_SANK-P-C-325.webp","intro":"王沈，三國時期人物。","full":"王沈可以指： 王沈 (西晉文學家)，字彥伯。高平（今山東鉅野）人。西晉文學家 王沈 (博陵縣公)，字處道，太原晉陽人，魏晉政治家 王沈 (十六國)，十六國之匈奴漢國貪腐的宦官、中常侍 王沈 (南朝)，祖籍東海郡，南朝循吏。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-325"},{"i":"SANK-P-C-323","pid":"72421048729194676372","h":"王粲","s":"王粲","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2100,"d":2200,"ev":0,"art":"img/s1/card_SANK-P-C-323.webp","intro":"王粲，字仲宣，山陽郡高平縣人。","full":"王粲（177年—217年2月17日），字仲宣，山陽郡高平縣（今山東省濟寧市微山縣）人。擅長辭賦，建安七子之一，被譽為「七子之冠冕」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-323"},{"i":"SANK-P-C-38","pid":"37720004104691414367","h":"王門","s":"王门","cat":"人物","sub":"武將","y":"C","fac":"曹魏","e":"火","a":3200,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-38.webp","intro":"王門，東漢末年公孫瓚的武將","full":"王門，東漢末年公孫瓚的武將。公孫瓚與袁紹相爭時，王門倒戈投向袁紹，並領一萬兵攻打公孫瓚，在正要攻打束州縣時，被縣令田豫說服，慚愧而退。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-38"},{"i":"SANK-P-C-532","pid":"57023521994642406257","h":"王韜","s":"王韬","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3100,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-532.webp","intro":"王韜，三國時期人物。","full":"王韜可以指： 王韜 (永樂進士)，明朝官員，永樂年間進士 王韜 (思想家)（1828－1897），晚清思想家、政論家和新聞記者 王韜 (1866年)（1866－1937），清末民初政治人物，曾任天津市長 王韜 (中國男演員)，中國內地男演員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-532"},{"i":"SANK-P-C-27","pid":"73103429317145424611","h":"環氏","s":"环氏","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2100,"d":2200,"ev":0,"art":"img/s1/card_SANK-P-C-27.webp","intro":"環氏，曹操妾室，曹沖母。","full":"未具名的環姓婦女，以姓氏歸檔，籍貫與出處待考。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-27"},{"i":"SANK-P-C-549","pid":"75250410639442397860","h":"甯隨","s":"宁随","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-549.webp","intro":"甯隨，《三國演義》的虛構人物，在《演義》中是姜維的副將。","full":"甯隨（亞東本作「寗隨」，音同「寧」），《三國演義》的虛構人物，在《演義》中是姜維的副將。魏滅蜀之戰中，魏將諸葛緒屯陰平橋頭斷姜維後路，甯隨向姜維獻計「攻敵之必救」，要姜維假裝殺向雍州，騙諸葛緒回兵去救。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-549"},{"i":"SANK-P-C-496","pid":"20779031770779466740","h":"田疇","s":"田畴","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-496.webp","intro":"田疇，字子泰，右北平郡無終縣人，東漢官員。","full":"田疇（169年—214年），字子泰，右北平郡無終縣（今天津市薊州區）人，東漢官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-496"},{"i":"SANK-P-C-357","pid":"75527395499738905821","h":"田續","s":"田续","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3100,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-357.webp","intro":"田續，右北平郡無終縣人，三國時曹魏將領。","full":"田續（？—？），右北平郡無終縣（今天津市薊州區）人，三國時曹魏將領，是東漢議郎田疇的侄孫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-357"},{"i":"SANK-E-M-C-008","pid":"40550489107236461209","h":"瘦馬","s":"瘦马","cat":"坐騎","sub":"","y":"C","fac":"","e":"","a":null,"d":35,"ev":null,"art":"img/s1/card_SANK-E-M-C-008.webp","intro":"瘦馬，瘦弱的馬。","full":"瘦馬，瘦弱的馬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-M-C-008"},{"i":"SANK-P-C-334","pid":"48704517855820670618","h":"皇甫闓","s":"皇甫闿","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3000,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-334.webp","intro":"曹魏滅蜀漢之戰，或稱魏滅蜀之戰、蜀漢滅亡，是三國後期的吞併戰","full":"曹魏滅蜀漢之戰，或稱魏滅蜀之戰、蜀漢滅亡，是三國後期的吞併戰。263年，曹魏政權實際掌權者司馬昭決定向蜀漢發動戰爭，派遣鍾會、鄧艾、諸葛緒等分東、中、西三路進攻漢中。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-334"},{"i":"SANK-P-C-414","pid":"57569344600743150327","h":"盛曼","s":"盛曼","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-414.webp","intro":"盛曼，孫吳人，孫休時期擔任建平太守。","full":"盛曼，孫吳人，孫休時期擔任建平太守。公元264年，蜀漢滅亡後，被孫休派去跟隨陸抗等人攻打蜀漢的巴東太守羅憲，盛曼勸羅憲開城門投降，但遭到羅憲的參軍楊宗辱罵，最終失敗而退軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-414"},{"i":"SANK-P-C-368","pid":"55857815237978532034","h":"盧毓","s":"卢毓","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2400,"d":2600,"ev":0,"art":"img/s1/card_SANK-P-C-368.webp","intro":"盧毓，字子家，涿郡涿縣人。","full":"盧毓（183年—257年），字子家，涿郡涿縣（今河北省涿州市）人。三國時代曹魏政治人物。東漢末年名臣盧植的第四子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-368"},{"i":"SANK-E-W-C-0013","pid":"63957125719099939918","h":"盾","s":"盾","cat":"武器","sub":"","y":"C","fac":"","e":"","a":60,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-C-0013.webp","intro":"盾是保護裝備，用於阻擋箭矢與刀劍攻擊。","full":"盾，或稱干、楯、牌、盾牌，是一種保護裝備，和盔甲一樣用於武裝衝突中。各種盾的大小相差可以很大，有的大到可覆蓋整個身體，小的則只適用於近身交戰。盾的厚度亦有分別，分別於厚的能夠保護軍人免受矛、弩甚至槍傷，薄的則只能阻檔刀刃。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-C-0013"},{"i":"SANK-P-C-64","pid":"06684101775279258165","h":"眭元進","s":"眭元进","cat":"人物","sub":"武將","y":"C","fac":"曹魏","e":"火","a":3300,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-64.webp","intro":"眭元進，東漢末年人物，袁紹部下為督將","full":"眭元進，東漢末年人物，袁紹部下為督將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-64"},{"i":"SANK-P-C-476","pid":"82494967328782628042","h":"眭固","s":"眭固","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-476.webp","intro":"眭固，字白兔，薊州人，東漢末期人物。","full":"眭固（？—199年），字白兔，薊州人，東漢末期人物。原為黑山賊，與于毒、白繞齊名，與袁術合謀共攻東郡，反為曹操所敗，後成為張楊部下。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-476"},{"i":"SANK-E-W-C-003","pid":"87746819829372459489","h":"短匕","s":"短匕","cat":"武器","sub":"","y":"C","fac":"","e":"","a":60,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-C-003.webp","intro":"匕首指雙刃短劍，全長約在30公分左右","full":"匕首指雙刃短劍，全長約在30公分左右","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-C-003"},{"i":"SANK-P-C-441","pid":"76225144405191235457","h":"石鑒","s":"石鉴","cat":"人物","sub":"","y":"C","fac":"晉","e":"土","a":3100,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-441.webp","intro":"石鑒，字大郎，十六國時期後趙國君主。","full":"石鑒（？—350年），字大郎，一作大朗，十六國時期後趙國君主，為石虎第三子，石遵、石世之兄。後趙建平三年（333年），後趙帝石勒去世，石虎掌控大權，石鑒當時被封為代王。建武三年（337年），石虎改稱天王後，被降封為義陽公。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-441"},{"i":"SANK-P-C-417","pid":"68174204535788148202","h":"祖茂","s":"祖茂","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-417.webp","intro":"祖茂，三國時期人物。","full":"祖茂可以指： 祖茂 (三國)：三國時期孫堅的部將。 祖茂 (北齊)：北齊時期的人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-417"},{"i":"SANK-P-C-475","pid":"82663039517707271371","h":"秦宜祿","s":"秦宜禄","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2900,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-475.webp","intro":"秦宜祿，新興雲中人。","full":"秦宜祿（？—200年），新興雲中人。漢末三國時期呂布的部下。魏驍騎將軍秦朗生父。秦宜祿在呂布敗後曾投靠曹操，後一度為張飛所誘而叛歸劉備，惟不久因反悔被殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-475"},{"i":"SANK-P-C-413","pid":"71382983717405437156","h":"秦松","s":"秦松","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":2300,"d":2400,"ev":0,"art":"img/s1/card_SANK-P-C-413.webp","intro":"秦松，字文表，東漢末期廣陵人，為孫吳大臣。","full":"秦松（？—？年），字文表，東漢末期廣陵人，曾侍奉孫策、孫權，為孫吳大臣，早卒。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-413"},{"i":"SANK-P-C-89","pid":"84732449645104178587","h":"秦琪","s":"秦琪","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":3900,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-89.webp","intro":"秦琪有可能為歷史小說《三國演義》的虛構人物。","full":"秦琪有可能為歷史小說《三國演義》的虛構人物，在正史《三國志》中暫無此人記載。根據《三國演義》第27回記載，秦琪為夏侯惇部將，蔡陽的外甥，負責鎮守黃河渡口關隘。關羽護送甘、糜二嫂投奔劉備，經過最後一關的黃河渡口，他雖知關羽一路過關斬將，仍不讓其渡河，關羽大怒，與之交鋒並將他斬殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-89"},{"i":"SANK-P-C-428","pid":"98536286484816404339","h":"程咨","s":"程咨","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3000,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-428.webp","intro":"程普，字德謀，幽州右北平土垠人。","full":"程普（2世紀—210年），字德謀，幽州右北平土垠人（今河北豐潤）。東漢末年孫堅麾下將軍，東吳孫氏三代元勳之一；是江表之虎臣之一。因為在早期的將領中，程普最為年長，所以被時人尊稱為程公。程普天性樂善好施，喜愛結交士大夫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-428"},{"i":"SANK-P-C-356","pid":"46153063740343076758","h":"程武","s":"程武","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2700,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-356.webp","intro":"程武，三國時期人物。","full":"程武可以指： 程武 (三國)，曹魏政治人物 程武 (企業家)，騰訊集團副總裁、閱文集團CEO。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-356"},{"i":"SANK-P-C-384","pid":"80570997369163473603","h":"程畿","s":"程畿","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3100,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-384.webp","intro":"程畿，字季然，東漢末年巴郡閬中人。","full":"程畿（？—222年），字季然，東漢末年巴郡閬中人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-384"},{"i":"SANK-P-C-84","pid":"11428020396563027039","h":"程遠志","s":"程远志","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3400,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-84.webp","intro":"幽州渠帥，演義被關羽斬","full":"黃巾軍人物為東漢末年參與黃巾之亂的黃巾軍人物，包含《三國志》以及其他史書所記載的史實人物及《三國演義》中的虛構人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-84"},{"i":"SANK-P-C-7","pid":"90171240789972106940","h":"程銀","s":"程银","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3400,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-7.webp","intro":"潼關之戰是曹操與馬超、韓遂等西方諸侯發生的戰爭。","full":"潼關之戰是曹操與馬超、韓遂等西方諸侯發生的戰爭。當時曹操在南方戰線失利，所以決定攻擊漢中的五斗米道領袖張魯。盤踞關中的馬超、韓遂等諸侯認為曹兵即將攻擊自己，紛紛起兵抵抗，在潼關附近與曹軍發生大戰，最後曹操用計取勝，壓制關中。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-7"},{"i":"SANK-P-C-510","pid":"91691114871268381773","h":"穆順","s":"穆顺","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3500,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-510.webp","intro":"穆順，為《三國演義》的虛構人物，有兩位同名同姓的人物登場。","full":"穆順，為《三國演義》的虛構人物 legends-wiki.html#SANK-P-C-329"},{"i":"SANK-P-C-397","pid":"55485259177456817573","h":"賈範","s":"贾范","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3200,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-397.webp","intro":"賈範，公孫淵部下，將軍，章回小說《三國演義》為副將。","full":"賈範(？—238年)，公孫淵部下，將軍，章回小說《三國演義》為副將。直諫公孫淵不應反叛曹魏，被公孫淵斬首。司馬懿入襄平城後厚待其子孫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-397"},{"i":"SANK-P-C-402","pid":"96265059056337182390","h":"賈華","s":"贾华","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3200,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-402.webp","intro":"賈華，三國時期人物。","full":"東吳將領，孫權部下，常隨護左右；事蹟散見《三國演義》及後世衍生作品。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-402"},{"i":"SANK-P-C-391","pid":"39137992719927935596","h":"賴恭","s":"赖恭","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":2700,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-391.webp","intro":"賴恭，三國時期人物。","full":"賴恭（？—？），零陵人，東漢末年人物，先後事奉劉表、劉備。《三國志》記載：賴恭，東漢末年，在荊州刺史劉表手下，任交州剌史。為人忠勇剛直，才華傑出，豪義很強。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-391"},{"i":"SANK-P-C-12","pid":"25497619845883843255","h":"越吉","s":"越吉","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3600,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-12.webp","intro":"西羌元帥，被關興斬","full":"以下是三國時期的虛構人物列表。列表主要包括14世紀羅貫中歷史小說《三國演義》和其他三國文化參考資料中的角色。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-12"},{"i":"SANK-P-C-399","pid":"18070248850501138465","h":"趙叡","s":"赵叡","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3100,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-399.webp","intro":"趙叡，東漢末年人物，袁紹部下。","full":"趙叡（?—200年），東漢末年人物，袁紹部下。官渡之戰時與淳于瓊護送糧草，被斬殺。《三國演義》中淳于瓊，督領部將眭元進、韓莒子、呂威璜、趙叡等守衛糧倉，趙叡與眭元進運糧途中與曹軍交戰被殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-399"},{"i":"SANK-P-C-423","pid":"20262781536232213072","h":"趙咨","s":"赵咨","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":2700,"d":2200,"ev":0,"art":"img/s1/card_SANK-P-C-423.webp","intro":"趙咨，三國時期人物。","full":"趙咨可以指： 趙咨 (東漢) 趙咨 (孫吳) 趙咨 (曹魏)。","wiki":"https://seanown.org/m mylegends-wiki.html#SANK-P-C-328"},{"i":"SANK-P-C-452","pid":"65456113253451099948","h":"郭石","s":"郭石","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3200,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-452.webp","intro":"郭石，三國時期人物。","full":"東漢末叛首，與長沙區星互相呼應，聯合周朝在零陵、桂陽一帶舉兵，後為長沙太守孫堅所討平。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-452"},{"i":"SANK-P-C-453","pid":"31179773848810710719","h":"郭馬","s":"郭马","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-453.webp","intro":"郭馬，三國時期人物。","full":"東吳末年會稽亂首，於鳳凰三年聚眾起事，旋為官軍討平。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-453"},{"i":"SANK-P-C-533","pid":"18789674201370541537","h":"鄂煥","s":"鄂焕","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3600,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-533.webp","intro":"鄂煥，《三國演義》虛構人物，為高定部將，善使方天畫戟。","full":"鄂煥，《三國演義》虛構人物，為高定部將，善使方天畫戟。於孔明征朱褒、雍闓時粉墨登場，後被魏延擒獲，孔明以禮相待，成功離間高定與朱、雍二人。 後高定派鄂煥斬朱褒、平雍闓，二人一起歸蜀，鄂煥遂因其功而被封為牙門將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-533"},{"i":"SANK-P-C-85","pid":"61945458257164263576","h":"鄒氏","s":"邹氏","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2100,"d":2200,"ev":0,"art":"img/s1/card_SANK-P-C-85.webp","intro":"張濟妻，曹操納之引叛亂","full":"張濟之妻、張繡伯母。張繡初降曹操時，曹操私納鄒氏，激得張繡復叛，致曹昂、典韋戰死。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-85"},{"i":"SANK-P-C-477","pid":"46039175748431206482","h":"鄒靖","s":"邹靖","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3200,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-477.webp","intro":"鄒靖，三國時期人物。","full":"鄒靖（？—？），東漢末年破虜校尉、北軍中侯。曾參與平定黃巾之亂。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-477"},{"i":"SANK-P-C-358","pid":"97640237247741872113","h":"鄧忠","s":"邓忠","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3600,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-358.webp","intro":"鄧忠，表字不詳，義陽棘陽人。","full":"鄧忠可以指： 鄧忠 (曹魏)，曹魏武將 鄧中夏，筆名鄧忠，中共早期領導人 鄧忠 (1968年)，三沙市人民政府市長。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-358"},{"i":"SANK-P-C-385","pid":"51394764498471053712","h":"鄧方","s":"邓方","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-385.webp","intro":"鄧方，三國時期人物。","full":"鄧方（？—221或222年），表字孔山。東漢時代末年及三國時代初期的武將與政治人物。荊州南郡人。蜀漢將領與第一任庲降都督。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-385"},{"i":"SANK-P-C-497","pid":"59009740954205349754","h":"鄧義","s":"邓义","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2400,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-497.webp","intro":"鄧義，三國時期人物。","full":"鄧義可以指： 鄧羲 鄧義 (永樂進士)。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-497"},{"i":"SANK-P-C-99","pid":"40216428112062437522","h":"鄧茂","s":"邓茂","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3400,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-99.webp","intro":"程遠志副將，被張飛刺","full":"黃巾軍人物為東漢末年參與黃巾之亂的黃巾軍人物，包含《三國志》以及其他史書所記載的史實人物及《三國演義》中的虛構人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-99"},{"i":"SANK-P-C-439","pid":"66537285776679970178","h":"鄧龍","s":"邓龙","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3300,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-439.webp","intro":"鄧龍，中國東漢時代末期武將。","full":"鄧龍（?—?），中國東漢時代末期武將。 鄧龍是劉表屬下。建安十一年（206年），黃祖命鄧龍率軍數千人攻打孫權占領的柴桑。鄧龍在孫權部下周瑜反擊下戰敗，敗走時周瑜將其俘獲，之後送他到揚州吳郡獻俘。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-439"},{"i":"SANK-P-C-495","pid":"40049990464162398411","h":"鄭度","s":"郑度","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2500,"d":2600,"ev":0,"art":"img/s1/card_SANK-P-C-495.webp","intro":"鄭度，廣漢郡綿竹縣人。","full":"鄭度可以指： 鄭度 (自然地理學家)，中國自然地理學家 鄭度 (三國)，三國時期人物，曾為劉璋獻策。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-495"},{"i":"SANK-P-C-429","pid":"78723175228120522530","h":"鄭泉","s":"郑泉","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":2500,"d":2400,"ev":0,"art":"img/s1/card_SANK-P-C-429.webp","intro":"鄭泉，三國時期人物。","full":"鄭泉（？—？），字文淵，三國時期吳國人物，官至太中大夫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-429"},{"i":"SANK-P-C-354","pid":"14082035907667915577","h":"鄭渾","s":"郑浑","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2600,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-354.webp","intro":"鄭渾，三國時期人物。","full":"鄭渾（？—？），字文公，河南郡開封縣（今河南省開封市）人。東漢名儒鄭眾的曾孫。東漢末及三國時曹魏官員，多次出任地方官員，多次穩定當地混亂的局勢和改善當地人民生活。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-354"},{"i":"SANK-P-C-430","pid":"11158812474305096373","h":"鄭胄","s":"郑胄","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":2800,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-430.webp","intro":"鄭胄，三國時期人物。","full":"鄭冑（？—？），字敬先，沛國人，三國時期孫吳將領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-430"},{"i":"SANK-P-C-466","pid":"50949273484085719808","h":"金尚","s":"金尚","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2700,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-466.webp","intro":"金敞，史書多作金尚，字元休，東漢末年京兆杜陵人，孝廉。","full":"金敞（2世紀—197年），史書多作金尚，字元休，東漢末年京兆杜陵人，孝廉。與同郡韋休甫、第五文休都著名，號為「三休」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-466"},{"i":"SANK-P-C-39","pid":"08831189320761313823","h":"金環三結","s":"金环三结","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":3400,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-39.webp","intro":"金環三結，南蠻五溪洞人，為南蠻王孟獲配下之第一洞元帥。","full":"金環三結，《三國演義》虛構人物，南蠻五溪洞人，為南蠻王孟獲配下之第一洞元帥。 金環三結與同僚董荼那、阿會喃一起守備五溪洞的蠻寨，去抵抗來南征的蜀軍。但是，由於蜀將魏延、趙雲給諸葛亮的激將法挑撥去偷襲蠻寨，金環三結因而受到突如其來的攻擊。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-39"},{"i":"SANK-E-W-C-002","pid":"07005913868984495014","h":"銅劍","s":"铜剑","cat":"武器","sub":"","y":"C","fac":"","e":"","a":60,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-C-002.webp","intro":"劍是尖頭雙邊開鋒的冷兵器，可斬擊亦可突刺。","full":"劍，是一種尖頭且雙邊開鋒的冷兵器，通常藉助其重量來斬擊，亦可用來突刺。其結構主要為劍柄和劍身，劍身邊緣開刃，部分劍身中間設有血槽以減輕重量，用劍的方式稱為劍術。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-C-002"},{"i":"SANK-P-C-95","pid":"37742752211820820672","h":"鍾進","s":"钟进","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":2500,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-95.webp","intro":"鍾進，《三國演義》虛構人物，鍾繇之弟，守長安死於馬超。","full":"鍾進，是《三國演義》中的虛構人物，不見於正史記載，長安太守鍾繇之弟。 鍾進隨鍾繇一起守備長安，馬超為報父仇討伐長安，鍾進守衛西門。夜間發現長安西門起火，他前去救火時，馬超屬下乘亂潛入城內。馬超部將龐德夜襲進入，鍾進被他一刀斬於馬下。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-95"},{"i":"SANK-E-W-C-0009","pid":"07102383744273896262","h":"長矛","s":"长矛","cat":"武器","sub":"","y":"C","fac":"","e":"","a":60,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-C-0009.webp","intro":"長矛，長柄刺擊兵器。","full":"長矛，長柄刺擊兵器。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-C-0009"},{"i":"SANK-P-C-371","pid":"00274836665224747445","h":"閻宇","s":"阎宇","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3200,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-371.webp","intro":"閻宇，三國時期人物。","full":"閻宇（？—？），字文平，荊州南郡（治今湖北省荊州市）人。三國時期蜀漢將領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-371"},{"i":"SANK-P-C-531","pid":"33663415878278610906","h":"閻溫","s":"阎温","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2800,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-531.webp","intro":"閻溫，字伯儉，天水郡西縣人。","full":"閻溫（2世紀—213年），字伯儉，天水郡西縣人。東漢末涼州官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-531"},{"i":"SANK-P-C-505","pid":"06513277746873324198","h":"關純","s":"关纯","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2700,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-505.webp","intro":"關純，三國時期人物。","full":"閔純（？—191年），字伯典，東漢末期的人物，韓馥別駕，在韓馥企圖讓冀州於袁紹時曾和耿武及李歷一同勸諫韓馥，認為韓馥可以利用軍糧把袁紹玩弄於股掌之間而不必寄人籬下，韓馥拒絕採納。在袁紹將來到冀州時，以刀杖抗拒袁紹而被袁紹命田豐殺害。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-505"},{"i":"SANK-P-C-456","pid":"07507846895709467059","h":"關靖","s":"关靖","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3000,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-456.webp","intro":"關靖，字士起，太原人，東漢末期人物。","full":"關靖（？—199年），字士起，太原人，東漢末期人物。公孫瓚部下，為長史。《英雄記》稱之為酷吏，諂媚無能，為公孫瓚所寵信。建安三年，袁紹大攻公孫瓚。公孫瓚欲親自領兵攻擊袁紹大後方，但被關靖勸止。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-456"},{"i":"SANK-P-C-45","pid":"19673664911400273330","h":"阿會喃","s":"阿会喃","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":3400,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-45.webp","intro":"阿會喃，南蠻五溪洞人，為南蠻王孟獲配下第三洞元帥。","full":"阿會喃，《三國演義》虛構人物，南蠻五溪洞人，為南蠻王孟獲配下第三洞元帥。 阿會喃與同僚金環三結、董荼那一起守備五溪洞，去迎戰第一次南征的蜀漢軍。但是中了埋伏，打敗仗被擒後又遭到釋放。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-45"},{"i":"SANK-P-C-74","pid":"80782101345360737914","h":"阿貴","s":"阿贵","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":3400,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-74.webp","intro":"阿貴，南蠻將領，見於《三國演義》諸葛亮南征之役。","full":"阿貴是一個由台灣動畫暨網路公司春水堂科技娛樂自1999年起所製作的一系列Flash動畫，由於題材源自日常生活與逗趣的人物造型和劇情，曾受大眾歡迎，在代言和進軍日本方面都有不俗成績。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-74"},{"i":"SANK-P-C-530","pid":"55603659278210485139","h":"陰夔","s":"阴夔","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2500,"d":2400,"ev":0,"art":"img/s1/card_SANK-P-C-530.webp","intro":"陰夔，三國時期人物。","full":"陰夔（？—？），東漢末年豫州刺史。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-530"},{"i":"SANK-P-C-426","pid":"99222268109704558471","h":"陳化","s":"陈化","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":2500,"d":2300,"ev":0,"art":"img/s1/card_SANK-P-C-426.webp","intro":"陳化，男，湖北黃陂人，中國數學家，武漢大學教授。","full":"陳化（1956年—），男，湖北黃陂人，中國數學家，武漢大學教授。現任武漢大學數學與統計學院院長。研究方向為偏微分方程。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-426"},{"i":"SANK-P-C-427","pid":"79499164477973192068","h":"陳就","s":"陈就","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3200,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-427.webp","intro":"陳就，東漢末期武將。","full":"陳就（2世紀—208年），東漢末期武將。 陳就是劉表部將黃祖屬下。擔任都督，率領水軍。建安十三年（208年），孫權率軍攻打江夏，黃祖命陳就為先鋒，迎戰孫權，陳就被孫權先鋒呂蒙猛攻下戰敗陣亡，首級被吳軍所獲。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-427"},{"i":"SANK-P-C-65","pid":"64936592976913934059","h":"陳應","s":"陈应","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3400,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-65.webp","intro":"武將，演義與趙雲戰","full":"以下是三國時期的虛構人物列表。列表主要包括14世紀羅貫中歷史小說《三國演義》和其他三國文化參考資料中的角色。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-65"},{"i":"SANK-P-C-548","pid":"46785828551538879167","h":"陳橫","s":"陈横","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3200,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-548.webp","intro":"陳橫，三國時期人物。","full":"陳橫，是《三國演義》中的虛構人物，劉繇部將。 陳橫是揚州刺史劉繇的部將。劉繇被孫策擊敗依附劉表，派陳橫、薛禮、張英共守秣陵（後來孫吳國都、建業），繼續抵抗孫策。城上暗放冷箭，正中孫策左腿，翻身落馬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-548"},{"i":"SANK-P-C-491","pid":"25356736148990716450","h":"陳紀","s":"陈纪","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3200,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-491.webp","intro":"陳紀，三國時期人物。","full":"陳紀可以指: 陳紀 (潁川)，東漢名士陳寔之子，曹魏重臣陳群之父。在東漢官至大鴻臚 陳紀 (九江太守)，東漢末年，割據軍閥袁術的部下 陳紀 (永樂丙戌進士)，明朝永樂四年進士、政治人物 陳紀 (永樂戊戌進士)，明朝永樂十六年進士、政治人物 。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-491"},{"i":"SANK-P-C-493","pid":"26560880000213644802","h":"陳蘭","s":"陈兰","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-493.webp","intro":"陳蘭，三國時期人物。","full":"陳蘭可以指： 陳蘭 (東漢)，東漢末年人物，袁術部下 陳蘭 (1913年)，鄧子恢之妻，第五屆全國政協委員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-493"},{"i":"SANK-P-C-433","pid":"87665588393675581898","h":"陸瑁","s":"陆瑁","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":2200,"d":2300,"ev":0,"art":"img/s1/card_SANK-P-C-433.webp","intro":"陸瑁，字子璋，吳郡吳縣人。","full":"陸瑁（2世紀？—239年），字子璋，吳郡吳縣（今江蘇省蘇州市）人。東吳丞相陸遜之弟，自己也是重臣之一。其孫陸曄和陸玩都是東晉時期著名士族領袖和大臣。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-433"},{"i":"SANK-E-A-C-013","pid":"21408595665853943844","h":"雜役服","s":"杂役服","cat":"鎧甲","sub":"","y":"C","fac":"","e":"","a":null,"d":63,"ev":null,"art":"img/s1/card_SANK-E-A-C-013.webp","intro":"雜役服，雜役所穿的粗布衣。","full":"雜役服，雜役所穿的粗布衣。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-C-013"},{"i":"SANK-P-C-518","pid":"99634167154201338710","h":"雷敘","s":"雷叙","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3200,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-518.webp","intro":"雷敘，三國時期人物。","full":"即「雷銅」，蜀漢將領，與吳蘭等鎮守下辯抵禦曹軍，後於對魏作戰中兵敗。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-518"},{"i":"SANK-P-C-517","pid":"09201937672801440261","h":"雷緒","s":"雷绪","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-517.webp","intro":"雷緒，但不久遭夏侯淵等率領的曹軍討伐。","full":"雷緒，漢末三國時期江淮一帶的軍事將領，曾隨陳蘭與孫權的部將韓當等抗曹，但不久遭夏侯淵等率領的曹軍討伐，被擊敗後投靠劉備。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-517"},{"i":"SANK-P-C-519","pid":"84813530174126990670","h":"雷薄","s":"雷薄","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-519.webp","intro":"雷薄，東漢末年人物，袁術部下。","full":"雷薄（2世紀？—3世紀？），東漢末年人物，袁術部下。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-519"},{"i":"SANK-E-M-C-007","pid":"03222103448135060296","h":"青牛","s":"青牛","cat":"坐騎","sub":"","y":"C","fac":"","e":"","a":null,"d":35,"ev":null,"art":"img/s1/card_SANK-E-M-C-007.webp","intro":"青牛，又稱青牛怪、青牛精，是中國古代傳說中太上老君的坐騎","full":"青牛，又稱青牛怪、青牛精，是中國古代傳說中太上老君的坐騎","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-M-C-007"},{"i":"SANK-P-C-372","pid":"92000351987201167663","h":"鞏志","s":"巩志","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3000,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-372.webp","intro":"鞏志，後劉備任命其為武陵太守。","full":"鞏志，《三國演義》虛構人物，在武陵太守金旋手下擔任從事，後來劉備派張飛攻打武陵時，勸金旋降劉但不被接受，金旋敗給張飛之後，便一箭射殺金旋投與百姓一起歸順劉備，後劉備任命其為武陵太守。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-372"},{"i":"SANK-E-W-C-0014","pid":"37449862518598007140","h":"鞭","s":"鞭","cat":"武器","sub":"","y":"C","fac":"","e":"","a":60,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-C-0014.webp","intro":"鞭，軟鞭或硬鞭，纏打兵器。","full":"鞭，軟鞭或硬鞭，纏打兵器。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-C-0014"},{"i":"SANK-P-C-82","pid":"92927434291219437717","h":"韓德","s":"韩德","cat":"人物","sub":"武將","y":"C","fac":"曹魏","e":"火","a":3500,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-82.webp","intro":"韓德，是魏國涼州的大將。","full":"韓德，在《三國演義》中登場的人物，是魏國涼州的大將，善使一把大斧。根據《演義》描寫，在227年諸葛亮首度北伐時，韓德帶領西羌8萬兵馬，協助魏國大都督夏侯楙。韓德的身邊有4位引以為豪的兒子，皆嫻熟武藝、精通弓馬，並跟隨父親出戰。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-82"},{"i":"SANK-P-C-457","pid":"60668159761043206550","h":"韓忠","s":"韩忠","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-457.webp","intro":"韓忠，三國時期人物。","full":"韓忠可以指： 韓忠 (黃巾軍)，東漢末期南陽黃巾軍首領 韓忠 (遼東)，東漢末期公孫康屬下 韓忠 (1931年)，第三屆全國人大代表。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-457"},{"i":"SANK-P-C-330","pid":"23318773690451209755","h":"韓暨","s":"韩暨","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2100,"d":2200,"ev":0,"art":"img/s1/card_SANK-P-C-330.webp","intro":"韓暨，字公至，南陽堵陽人。","full":"韓暨（150年代—238年4月10日），字公至，南陽堵陽人。秦末將領韓王信的後代。東漢末及三國時曹魏官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-330"},{"i":"SANK-P-C-24","pid":"93707019162340502931","h":"韓暹","s":"韩暹","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-24.webp","intro":"韓暹，東漢末期人物，原本是河東白波帥","full":"韓暹，東漢末期人物，原本是河東白波帥。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-24"},{"i":"SANK-P-C-536","pid":"80973574153749018715","h":"韓珩","s":"韩珩","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2300,"d":2500,"ev":0,"art":"img/s1/card_SANK-P-C-536.webp","intro":"韓珩，字子佩，代郡人，東漢末期袁軍將領，任幽州別駕。","full":"韓珩（？—？），字子佩，代郡人，東漢末期袁軍將領，任幽州別駕。少喪父母，奉養兄姊，宗族稱孝悌。焦觸叛變反袁熙時因感袁氏恩惠，拒絕一同叛變。焦觸軍中大感慚愧，放韓珩回家。後曹操聞道其忠義，屢次欲求為部下，韓珩都一一拒絕，在家中死去。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-536"},{"i":"SANK-P-C-111","pid":"74264684689503723427","h":"韓琪","s":"韩琪","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3300,"d":2300,"ev":0,"art":"img/s1/card_SANK-P-C-111.webp","intro":"韓德四子，被趙雲斬","full":"韓琪可以指： 韓琪 (三國演義) 韓琪 (永善)，永善縣國有林場副場長，馬楠鄉黨委副書記（掛職），中國扶貧工作者 韓琪(鍘美案),戲曲鍘美案里的人物，被陳世美派去殺害秦香蓮母子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-111"},{"i":"SANK-P-C-100","pid":"77970239042661934745","h":"韓瑛","s":"韩瑛","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":3400,"d":2400,"ev":0,"art":"img/s1/card_SANK-P-C-100.webp","intro":"韓瑛，直隸順天府通州人，清朝政治人物、進士出身","full":"韓瑛，直隸順天府通州人，清朝政治人物、進士出身。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-100"},{"i":"SANK-P-C-105","pid":"09470191643550507790","h":"韓瑤","s":"韩瑶","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3500,"d":2500,"ev":0,"art":"img/s1/card_SANK-P-C-105.webp","intro":"韓德次子，被趙雲斬","full":"以下是三國時期的虛構人物列表。列表主要包括14世紀羅貫中歷史小說《三國演義》和其他三國文化參考資料中的角色。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-105"},{"i":"SANK-P-C-107","pid":"23578681475563298275","h":"韓瓊","s":"韩琼","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3600,"d":2600,"ev":0,"art":"img/s1/card_SANK-P-C-107.webp","intro":"韓德三子，被趙雲斬","full":"以下是三國時期的虛構人物列表。列表主要包括14世紀羅貫中歷史小說《三國演義》和其他三國文化參考資料中的角色。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-107"},{"i":"SANK-P-C-47","pid":"10703104836051458733","h":"韓福","s":"韩福","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3700,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-47.webp","intro":"洛陽太守，被關羽斬","full":"韓福可以指： 韓福 (三國演義) 韓福 (成化進士)。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-47"},{"i":"SANK-P-C-331","pid":"46393531937746705846","h":"韓範","s":"韩范","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3000,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-331.webp","intro":"韓範，三國時期人物。","full":"三國時期小人物，史料記載零散，卡池依所屬營別與稀有度歸檔，數值按檔位預設，待日後補考據。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-331"},{"i":"SANK-P-C-455","pid":"51461009765043408113","h":"韓胤","s":"韩胤","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2600,"d":2500,"ev":0,"art":"img/s1/card_SANK-P-C-455.webp","intro":"韓胤，三國時期人物。","full":"韓胤（？—197年），袁術之部下，擔任使者前往與呂布說媒。 袁術欲結呂布為援，乃為子索呂布女，呂布許之。袁術遣使韓胤以僭號議告呂布，並求迎婦。沛相陳珪恐袁術、呂布結為親家，則徐州、揚州合從，將為國難，於是往說服呂布。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-455"},{"i":"SANK-P-C-83","pid":"82093339131340088960","h":"韓莒子","s":"韩莒子","cat":"人物","sub":"武將","y":"C","fac":"曹魏","e":"火","a":3100,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-83.webp","intro":"韓莒子，東漢末年人物，袁紹部下為騎督","full":"韓莒子，東漢末年人物，袁紹部下為騎督。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-83"},{"i":"SANK-P-C-535","pid":"68024227342772362025","h":"韓起","s":"韩起","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3400,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-535.webp","intro":"韓起，姬姓、韓氏，名起，諡號宣，史稱韓宣子。","full":"韓起（？—前514年），姬姓、韓氏，名起，諡號宣，史稱韓宣子。韓厥的庶子。是中國春秋時期晉國韓氏第六任的領袖。 嫡兄韓無忌罹患不治之症，韓起代兄為繼承人。前566年，韓厥後継為韓氏領袖。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-535"},{"i":"SANK-P-C-500","pid":"40035333546590938749","h":"馬延","s":"马延","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3100,"d":2900,"ev":0,"art":"img/s1/card_SANK-P-C-500.webp","intro":"馬延，東漢末年人物，袁尚部下。","full":"馬延，東漢末年人物，袁尚部下。建安九年（204年），袁尚再攻平原，曹操趁機攻鄴。袁尚領兵來救，馬延、張顗臨陣倒戈，令袁尚軍潰不成軍，期後下落不明。《三國演義》加插一段二人在曹操赤壁之戰敗陣時為甘寧斬殺一幕。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-500"},{"i":"SANK-P-C-501","pid":"04292854634987445662","h":"馬日磾","s":"马日䃅","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":2500,"d":2800,"ev":0,"art":"img/s1/card_SANK-P-C-501.webp","intro":"馬日磾，字翁叔，扶風茂陵人。","full":"馬日磾（ㄉㄧ）（145年前—194年），字翁叔，扶風茂陵人。經學大師馬融族孫，一作族子。官至太傅。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-501"},{"i":"SANK-P-C-53","pid":"01846238328796996473","h":"馬玩","s":"马玩","cat":"人物","sub":"武將","y":"C","fac":"曹魏","e":"火","a":3400,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-53.webp","intro":"馬玩，東漢末年將領","full":"馬玩（？－212年），東漢末年將領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-53"},{"i":"SANK-P-C-387","pid":"90909931030951847351","h":"馬邈","s":"马邈","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":2200,"d":2400,"ev":0,"art":"img/s1/card_SANK-P-C-387.webp","intro":"馬邈，三國時期人物。","full":"三國時期小人物，史料記載零散，卡池依所屬營別與稀有度歸檔，數值按檔位預設，待日後補考據。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-387"},{"i":"SANK-P-C-443","pid":"10105540078257067071","h":"馬隆","s":"马隆","cat":"人物","sub":"","y":"C","fac":"晉","e":"土","a":3300,"d":3600,"ev":0,"art":"img/s1/card_SANK-P-C-443.webp","intro":"馬隆，字孝興，東平平陸人。","full":"馬隆（？—？），字孝興，東平平陸人。三國時曹魏武官，後來入仕西晉，協助西晉平定涼州的叛亂，並鎮守涼州十多年。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-443"},{"i":"SANK-P-C-359","pid":"74545808048334782795","h":"馮楷","s":"冯楷","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3300,"d":3200,"ev":0," 將，隨呂布轉戰各地。","full":"魏續（？—？），東漢末年武將，是呂布部將，隨呂布轉戰各地。郝萌兵變被殺之後，由於魏續和呂布有親戚關係，因此呂布令魏續接掌高順兵權，高順只能在戰事才能統領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-58"},{"i":"SANK-P-C-333","pid":"25019521801999398157","h":"魏諷","s":"魏讽","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":2400,"d":3000,"ev":0,"art":"img/s1/card_SANK-P-C-333.webp","intro":"魏諷，字子京，沛國人。","full":"魏諷（？—219年），字子京，沛國人（或作濟陰郡人），有惑眾之才，鄴城為之傾動，於是鍾繇徵辟魏諷為西曹掾，但與魏諷同郡的鄭泰之子鄭袤認為：「諷奸雄，終必為亂。」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-333"},{"i":"SANK-P-C-49","pid":"78578966164391792432","h":"魏越","s":"魏越","cat":"人物","sub":"武將","y":"C","fac":"曹魏","e":"火","a":3500,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-49.webp","intro":"魏越，中國東漢末年武將，呂布之親信，被《後漢書》稱為「健將」","full":"魏越，中國東漢末年武將，呂布之親信，被《後漢書》稱為「健將」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-49"},{"i":"SANK-P-C-398","pid":"45301810924950134752","h":"魏邈","s":"魏邈","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":3200,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-398.webp","intro":"魏邈，三國時期孫吳將軍，任大夫一職。","full":"魏邈（生卒年不詳），三國時期孫吳將軍，任大夫一職。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-398"},{"i":"SANK-P-C-436","pid":"17902574321635800573","h":"魯淑","s":"鲁淑","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3000,"d":3300,"ev":0,"art":"img/s1/card_SANK-P-C-436.webp","intro":"魯淑，吳國大臣魯肅的遺腹子，濡須督張承說他將來必能終當到至。","full":"魯淑（約217年—274年），吳國大臣魯肅的遺腹子，濡須督張承說他將來必能終當到至。永安年間，昇為昭武將軍、都亭侯。歷任武昌督、夏口督。魯淑有著整治地區的才幹，並在任時將治區嚴整。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-436"},{"i":"SANK-P-C-360","pid":"02615359784224884898","h":"鮑勳","s":"鲍勋","cat":"人物","sub":"","y":"C","fac":"曹魏","e":"火","a":3700,"d":2700,"ev":0,"art":"img/s1/card_SANK-P-C-360.webp","intro":"鮑勳，字叔業，泰山郡平陽人，官至右中郎將。","full":"鮑勳（2世紀—226年6月9日），字叔業，泰山郡平陽（今山東新泰）人，西漢司隸校尉鮑宣的九世孫，東漢濟北相鮑信之子。漢末三國時曹魏官員，官至右中郎將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-360"},{"i":"SANK-P-C-71","pid":"04739814489424842365","h":"鮑隆","s":"鲍隆","cat":"人物","sub":"其他","y":"C","fac":"曹魏","e":"火","a":3400,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-71.webp","intro":"鮑隆，東漢末期桂陽太守趙範屬下管軍校尉。","full":"鮑隆，是《三國演義》中的虛構人物，一作鮑龍，東漢末期桂陽太守趙範屬下管軍校尉。 他和陳應原為桂陽岒山鄉獵戶，鮑龍曾經射殺兩頭老虎。趙雲攻桂陽郡，趙範想要歸降，他勸說趙範出兵相拒，陳應率軍三千挑戰趙雲。與趙雲交鋒便被生擒。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-71"},{"i":"SANK-P-C-415","pid":"16110604858474386656","h":"鮮于丹","s":"鲜于丹","cat":"人物","sub":"","y":"C","fac":"東吳","e":"水","a":3300,"d":3200,"ev":0,"art":"img/s1/card_SANK-P-C-415.webp","intro":"鮮于丹，東吳將領。","full":"鮮于丹（？—？），東吳將領。曾隨呂蒙攻取荊南三郡，後參加了夷陵之戰。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-415"},{"i":"SANK-P-C-479","pid":"01796433727320295972","h":"鮮于輔","s":"鲜于辅","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-479.webp","intro":"鮮于輔，漁陽人，官至輔國將軍。","full":"鮮于輔（？—223年後），漁陽人，東漢末年人物，原劉虞屬下，劉虞身亡後為劉虞報仇打敗公孫瓚，打敗公孫瓚後被田豫說服，投降曹操終成曹魏將領，官至輔國將軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-479"},{"i":"SANK-P-C-460","pid":"67929337611370527583","h":"麴演","s":"曲演","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3400,"ev":0,"art":"img/s1/card_SANK-P-C-460.webp","intro":"麴演，西平郡人，東漢末年人物。","full":"麴（ㄑㄩ）演（2世紀—220年），西平郡（今青海省西寧市）人。東漢末年人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-460"},{"i":"SANK-E-A-C-002","pid":"96803757853900429593","h":"麻繩甲","s":"麻绳甲","cat":"鎧甲","sub":"","y":"C","fac":"","e":"","a":null,"d":63,"ev":null,"art":"img/s1/card_SANK-E-A-C-002.webp","intro":"麻繩甲，麻繩編結的護甲。","full":"麻繩甲，麻繩編結的護甲。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-C-002"},{"i":"SANK-P-C-469","pid":"20309703281386869766","h":"黃亂","s":"黄乱","cat":"人物","sub":"","y":"C","fac":"群雄","e":"土","a":3300,"d":3100,"ev":0,"art":"img/s1/card_SANK-P-C-469.webp","intro":"黃亂，三國時期人物。","full":"三國時期小人物，史料記載零散，卡池依所屬營別與稀有度歸檔，數值按檔位預設，待日後補考據。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-C-469"},{"i":"SANK-P-C-374","pid":"50290615749764445981","h":"黃射","s":"黄射","cat":"人物","sub":"","y":"C","fac":"蜀漢","e":"木","a":2900,"d":3000,"ev":0,"art":"img/s1/ const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BY={};D.forEach(c=>BY[c.i]=c);
const cats=[...new Set(D.map(c=>c.cat).filter(Boolean))].sort();
const rars=['EXR','UR','SSR','SR','R','UC','C'];
$('#fcat').insertAdjacentHTML('beforeend',cats.map(c=>'<option>'+esc(c)+'</option>').join(''));
$('#frar').insertAdjacentHTML('beforeend',rars.map(c=>'<option>'+esc(c)+'</option>').join(''));
let cur=null;
function show(cid){
  const c=BY[cid];if(!c)return;
  cur=cid;
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',e.dataset.id===cid));
  const d=$('#detail');d.classList.add('on');
  d.innerHTML='<div>'+(c.art?'<img src="https://mylegends.org/'+esc(c.art)+'" alt="'+esc(c.h)+'">':'<div class="muted">尚無卡圖</div>')+'</div>'
   +'<div><h2>'+esc(c.h)+'</h2><div class="muted">'+esc(c.s||c.h)+'　·　'+esc(c.i)+'</div>'
   +'<div class="tags"><span class="rar">'+esc(c.y||'—')+'</span>'
   +(c.cat?'<span class="tag">'+esc(c.cat)+(c.sub?' · '+esc(c.sub):'')+'</span>':'')
   +(c.fac?'<span class="tag">'+esc(c.fac)+'</span>':'')
   +(c.e?'<span class="tag">'+esc(c.e)+'</span>':'')+'</div>'
   +(c.intro?'<div class="cardintro">卡面簡介：'+esc(c.intro)+'</div>':'')
   +'<div class="full">'+esc(c.full||'尚無簡介。')+'</div>'
   +(c.wiki?'<a class="link" href="'+esc(c.wiki)+'" target="_blank" rel="noopener">'+(c.wiki.includes('wikipedia')?'查看維基百科條目':'查看完整條目')+' ↗</a>':'')
   +'</div>';
  history.replaceState(null,'','#'+encodeURIComponent(cid));
  d.scrollIntoView({block:'start',behavior:'smooth'});
}
function render(){
  const q=$('#q').value.trim().toLowerCase(), fc=$('#fcat').value, fr=$('#frar').value;
  const list=D.filter(c=>(!q||[c.h,c.s,c.fac,c.cat,c.sub,c.full].join(' ').toLowerCase().includes(q))
    &&(!fc||c.cat===fc)&&(!fr||c.y===fr));
  $('#grid').innerHTML=list.slice(0,400).map(c=>
    '<div class="item'+(c.i===cur?' on':'')+'" data-id="'+esc(c.i)+'">'
    +(c.art?'<img loading="lazy" src="https://mylegends.org/'+esc(c.art)+'" alt="">':'')
    +'<div class="nm">'+esc(c.h)+'</div><div class="meta">'+esc(c.y||'—')+' · '+esc(c.cat||'')+(c.fac?' · '+esc(c.fac):'')+'</div></div>').join('');
  document.querySelectorAll('.item').forEach(e=>e.onclick=()=>show(e.dataset.id));
  const n=document.createElement('div');n.className='muted';n.style.marginTop='14px';
  n.textContent='顯示 '+Math.min(list.length,400)+' / '+list.length+' 張'+(list.length>400?'（輸入關鍵字縮小範圍）':'');
  $('#grid').after(n);
  const old=$('#grid').nextSibling;if(old&&old!==n&&old.className==='muted')old.remove();
}
['#q','#fcat','#frar'].forEach(s=>$(s).addEventListener('input',render));
render();
(function(){const h=decodeURIComponent(location.hash.slice(1));if(h&&BY[h])setTimeout(()=>show(h),80)})();
</script>
