const D=[{"i":"SANK-P-EXR-003","pid":"58287952892074053537","h":"諸葛亮","s":"诸葛亮","cat":"人物","sub":"謀臣","y":"EXR","fac":"蜀漢","e":"木","a":13800,"d":14900,"ev":0.18,"art":"img/s1/card_SANK-P-EXR-003.webp","intro":"諸葛亮，字孔明，徐州琅琊陽都人，蜀漢丞相","full":"諸葛亮，字孔明，徐州琅琊陽都人，蜀漢丞相。隱居隆中，劉備三顧茅廬而出，獻隆中對策，輔佐建國，執政期間屢次北伐，卒於五丈原，諡忠武。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-EXR-003"},{"i":"SANK-P-EXR-008","pid":"59389454389739731207","h":"周瑜","s":"周瑜","cat":"人物","sub":"謀臣","y":"EXR","fac":"東吳","e":"水","a":14400,"d":14900,"ev":0.17,"art":"img/s1/card_SANK-P-EXR-008.webp","intro":"周瑜，字公瑾，廬江郡舒縣人，東漢末年孫吳陣營首要的統帥。","full":"周瑜，字公瑾，人稱「周郎」，廬江郡舒縣人，東漢末年孫吳陣營首要的統帥。周瑜為人相貌俊美、天資聰穎、精熟音律，酒過三巡仍能聽出宴席間的音誤，故傳「曲有誤，周郎顧」，深得孫策、孫權器重。周瑜年少與孫策情同兄弟，稱總角之交，二十歲時與孫策渡過長江擊敗劉繇，嚴白虎，王朗等江東割據勢力，隨孫策平定江東。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-EXR-008"},{"i":"SANK-P-EXR-011","pid":"75615453000643546711","h":"郭嘉","s":"郭嘉","cat":"人物","sub":"武將","y":"EXR","fac":"曹魏","e":"火","a":13400,"d":14300,"ev":0.165,"art":"img/s1/card_SANK-P-EXR-011.webp","intro":"郭嘉，字奉孝，潁川陽翟人，曹操麾下重要謀士。","full":"郭嘉（170年—207年），字奉孝，潁川陽翟人（今河南省禹州市），初為東漢末年群雄袁紹麾下，後成為曹操麾下重要謀士，任司空府軍師祭酒，封洧陽亭侯，諡號貞侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-EXR-011"},{"i":"SANK-P-EXR-009","pid":"90831327632094135095","h":"陸遜","s":"陆逊","cat":"人物","sub":"武將","y":"EXR","fac":"東吳","e":"水","a":14400,"d":14900,"ev":0.165,"art":"img/s1/s1_luxun.jpg","intro":"陸遜，字伯言，吳郡吳縣人，三國時代吳國軍事家、政治家。","full":"陸遜（183年—245年3月19日），本名陸議，字伯言，吳郡吳縣（今江蘇省蘇州市）人，三國時代吳國軍事家、政治家，負責統領吳國軍事和政治多年，並同時掌管民事，輔佐太子等。歷任吳國大都督、上大將軍、丞相。63歲去世，孫休時追諡昭侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-EXR-009"},{"i":"SANK-P-EXR-002","pid":"62261259023342548982","h":"曹操","s":"曹操","cat":"人物","sub":"君主宗室","y":"EXR","fac":"曹魏","e":"火","a":14500,"d":15000,"ev":0.175,"art":"img/s1/card_SANK-P-EXR-002.webp","intro":"曹操，字孟德，小字阿瞞，沛國譙縣人","full":"曹操，字孟德，小字阿瞞，沛國譙縣人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-EXR-002"},{"i":"SANK-P-EXR-012","pid":"01981990885647360396","h":"貂蟬","s":"貂蝉","cat":"人物" "SANK-E-A-EXR-001","pid":"45850563059675193558","h":"唐猊鎧","s":"唐猊铠","cat":"鎧甲","sub":"","y":"EXR","fac":"","e":"","a":null,"d":1580,"ev":null,"art":"img/s1/card_SANK-E-A-EXR-001.webp","intro":"唐猊鎧，以猛獸皮為飾的鎧甲，取其堅韌懾敵。","full":"唐猊鎧，以猛獸皮為飾的鎧甲，取其堅韌懾敵。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-EXR-001"},{"i":"SANK-P-EXR-047","pid":"07485036007296408627","h":"太史慈","s":"太史慈","cat":"人物","sub":"武將","y":"EXR","fac":"東吳","e":"水","a":14900,"d":14700,"ev":0.105,"art":"img/s1/card_SANK-P-SSR-047.webp","intro":"太史慈，字子義，東萊郡黃縣人，東漢末年名將。","full":"太史慈，字子義，東萊郡黃縣人，重信守義，弓馬熟練，箭法精良，東漢末年諸侯群雄孔融的客將，曾經為了報答對其母有恩的北海相孔融，而在黃巾軍包圍下單騎突圍向平原相劉備求援。後南下渡江投靠於同鄉的揚州牧劉繇，在神亭嶺一戰跟孫策單挑不分勝負，後劉繇敗於孫策後，率眾歸降孫策，助其平定江東一帶，其義名聲望連丞相曹操都以當歸欲招攬之，但太史慈仍然選擇效忠孫策。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-EXR-047"},{"i":"SANK-E-W-EXR-004","pid":"59193574928021063984","h":"干將","s":"干将","cat":"武器","sub":"","y":"EXR","fac":"","e":"","a":1301,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-EXR-004.webp","intro":"干將，春秋吳國名劍，與莫邪成對，相傳為鑄劍師干將所鑄。","full":"干將，春秋吳國名劍，與莫邪成對，相傳為鑄劍師干將所鑄。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-EXR-004"},{"i":"SANK-E-W-EXR-003","pid":"05582181536643913161","h":"斬蛇劍(赤霄劍)","s":"斩蛇(赤霄)剑","cat":"武器","sub":"","y":"EXR","fac":"","e":"","a":1301,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-EXR-003.webp","intro":"赤霄劍，漢高祖劉邦斬白蛇起義所用，又名斬蛇劍。","full":"赤霄劍，漢高祖劉邦斬白蛇起義所用，又名斬蛇劍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-EXR-003"},{"i":"SANK-E-W-EXR-001","pid":"85975420207143782362","h":"方天畫戟","s":"方天画戟","cat":"武器","sub":"","y":"EXR","fac":"","e":"","a":1301,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-EXR-001.webp","intro":"方天戟，又稱方天畫戟，其尖頭兩旁有一對月牙形戈身。","full":"方天戟，又稱方天畫戟，其尖頭兩旁有一對月牙形戈身。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-EXR-001"},{"i":"SANK-P-EXR-046","pid":"51031370184104925547","h":"甘寧","s":"甘宁","cat":"人物","sub":"武將","y":"EXR","fac":"東吳","e":"水","a":14900,"d":14800,"ev":0.11,"art":"img/s1/card_SANK-P-SSR-046.webp","intro":"甘寧，字興霸，巴郡臨江人，東吳名將","ful 為趙雲所奪。","full":"青釭劍，曹操所藏寶劍之一，長坂坡之役為趙雲所奪。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-EXR-006"},{"i":"SANK-E-W-EXR-007","pid":"05804957919957558859","h":"青龍偃月刀","s":"青龙偃月刀","cat":"武器","sub":"","y":"EXR","fac":"","e":"","a":1301,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-EXR-002.webp","intro":"青龍偃月刀是偃月刀的其中一種。","full":"青龍偃月刀是偃月刀的其中一種。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-EXR-007"},{"i":"SANK-P-UR-006","pid":"78152865222146921025","h":"荀彧","s":"荀彧","cat":"人物","sub":"謀臣","y":"UR","fac":"曹魏","e":"火","a":11400,"d":12100,"ev":0.12,"art":"img/s1/card_SANK-P-UR-006.webp","intro":"荀彧，字文若，潁川郡潁陰縣人，朗陵侯相荀淑之孫","full":"荀彧，字文若，潁川郡潁陰縣人，朗陵侯相荀淑之孫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-006"},{"i":"SANK-P-UR-012","pid":"49112016910981445930","h":"龐統","s":"庞统","cat":"人物","sub":"謀臣","y":"UR","fac":"蜀漢","e":"木","a":11700,"d":12600,"ev":0.12,"art":"img/s1/card_SANK-P-UR-012.webp","intro":"龐統，字士元，襄陽人，號「鳳雛」，與諸葛亮齊名","full":"龐統，字士元，襄陽人，號「鳳雛」，與諸葛亮齊名。投靠劉備後獻取益州三策，進軍雒城時於落鳳坡中箭身亡。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-012"},{"i":"SANK-P-UR-007","pid":"73523431394674768132","h":"賈詡","s":"贾诩","cat":"人物","sub":"謀臣","y":"UR","fac":"曹魏","e":"火","a":12000,"d":12700,"ev":0.125,"art":"img/s1/card_SANK-P-UR-007.webp","intro":"賈詡，字文和，武威姑臧人，曹魏謀臣","full":"賈詡，字文和，武威姑臧人，曹魏謀臣。善於權變與自保，先後隨董卓、段煨、張繡，歸曹後助曹丕確立世子之位，官至太尉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-007"},{"i":"SANK-P-UR-013","pid":"40103801908860260777","h":"法正","s":"法正","cat":"人物","sub":"謀臣","y":"UR","fac":"蜀漢","e":"木","a":12000,"d":12700,"ev":0.125,"art":"img/s1/card_SANK-P-UR-013.webp","intro":"法正，字孝直，東漢司隸右扶風郿人，定軍山之戰策劃襲殺夏侯淵。","full":"法正（176年—220年），字孝直。東漢司隸右扶風郿（今陝西眉縣）人，三國時蜀漢重臣；深有謀略，定軍山之戰策劃襲殺夏侯淵。劉備在世時，惟獨法正有諡號，死後追諡為翼侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-013"},{"i":"SANK-P-UR-011","pid":"17085001116618430091","h":"荀攸","s":"荀攸","cat":"人物","sub":"文官","y":"UR","fac":"曹魏","e":"火","a":11600,"d":12500,"ev":0.09,"art":"img/s1/card_SANK-P-SSR-011.webp","intro":"荀攸，字公達，潁川潁陰人，曹魏謀士。","full":"荀攸（157年—214年），字公達，漢末豫州潁川潁陰（今河南許昌）人，三國時代曹魏著名政治家、軍事家。尚書令荀彧的堂侄，荀攸祖父荀曇，官至廣陵太守。荀攸被曹操徵為汝南太守，入為尚書，以功封陵樹亭侯。建安十二年，轉為中軍師。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-011"},{"i":"SANK-P-UR-005","pid":"76042648498326426915","h":"鍾會","s":"钟会","cat":"人物","sub":"文官","y":"UR","fac":"曹魏","e":"火","a":12100,"d":12700,"ev":0.12,"art":"img/s1/card_SANK-P-UR-005.webp","intro":"鍾會，字士季，潁川郡長社縣人，三國時期曹魏大臣，官至司徒","full":"鍾會，字士季，潁川郡長社縣人，三國時期曹魏大臣，官至司徒。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-005"},{"i":"SANK-P-UR-010","pid":"88064382779108133970","h":"程昱","s":"程昱","cat":"人物","sub":"武將","y":"UR","fac":"曹魏","e":"火","a":12000,"d":12400,"ev":0.09,"art":"img/s1/card_SANK-P-SSR-010.webp","intro":"程昱，字仲德，兗州東郡東阿人，三國時代曹魏將領和政治家","full":"程昱，字仲德，兗州東郡東阿人，三國時代曹魏將領和政治家。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-010"},{"i":"SANK-P-UR-004","pid":"30520487334088510986","h":"鄧艾","s":"邓艾","cat":"人物","sub":"武將","y":"UR","fac":"曹魏","e":"火","a":12800,"d":12900,"ev":0.125,"art":"img/s1/card_SANK-P-UR-004.webp","intro":"鄧艾，字士載，義陽棘陽人，曹魏滅蜀名將","full":"鄧艾，字士載，義陽棘陽人，曹魏滅蜀名將。屯田治軍有方，偷渡陰平直取成都，蜀亡後遭鍾會構陷，被收殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-004"},{"i":"SANK-P-UR-017","pid":"89389968724169089975","h":"魯肅","s":"鲁肃","cat":"人物","sub":"謀臣","y":"UR","fac":"東吳","e":"水","a":12200,"d":12600,"ev":0.12,"art":"img/s1/card_SANK-P-UR-017.webp","intro":"魯肅，字子敬，臨淮東城人，東吳重臣","full":"魯肅，字子敬，臨淮東城人，東吳重臣。力主聯劉抗曹，參與赤壁之謀，繼周瑜主持東吳軍事，為人持重，致力維護孫劉同盟。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-017"},{"i":"SANK-P-UR-019","pid":"13795255660089646392","h":"司馬師","s":"司马师","cat":"人物","sub":"武將","y":"UR","fac":"晉","e":"土","a":12300,"d":12600,"ev":0.12,"art":"img/s1/card_SANK-P-UR-019.webp","intro":"司馬師，字子元，河內溫縣人，三國時期魏國後期權臣，官至大將軍","full":"司馬師，字子元，河內溫縣人，三國時期魏國後期權臣，官至大將軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-019"},{"i":"SANK-P-UR-093","pid":"15440013801638147877","h":"姜維","s":"姜维","cat":"人物","sub":"武將","y":"UR","fac":"蜀漢","e":"木","a":12800,"d":12900,"ev":0.13,"art":"img/s1/card_SANK-P-UR-011.webp","intro":"姜維，字伯約，天水冀縣人，蜀漢後期大將","full":"姜維，字伯約，天水冀縣人，蜀漢後期大將。本為魏將，降蜀後受諸葛亮器重，繼承北伐遺志屢次出兵，蜀亡後圖謀復國，事敗被殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-093"},{"i":"SANK-P-UR-020","pid":"28646378664369902968","h":"司馬昭","s":"司马昭","cat":"人物","sub":"武將","y":"UR","fac":"晉","e":"土","a":12200,"d":12500,"ev":0.12,"art":"img/s1/card_SANK-P-UR-020.webp","intro":"司馬昭，字子上，河內溫縣人，司馬懿次子，曹魏後期權臣","full":"司馬昭，字子上，河內溫縣人，司馬懿次子，曹魏後期權臣。專斷朝政，出兵滅蜀，封晉王，死後追尊為晉文帝，為司馬炎代魏立晉鋪路。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-020"},{"i":"SANK-P-UR-032","pid":"01279389220578998378","h":"陳宮","s":"陈宫","cat":"人物","sub":"謀臣","y":"UR","fac":"群雄","e":"土","a":12100,"d":12600,"ev":0.12,"art":"img/s1/card_SANK-P-UR-032.webp","intro":"陳宮，字公台，東郡東武陽人","full":"陳宮，字公台，東郡東武陽人。初勸曹操入主兗州，後因不滿其為人而背離，輔佐呂布；下邳城破被俘，寧死不降，為曹操所殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-032"},{"i":"SANK-P-UR-016","pid":"55103440134508901360","h":"呂蒙","s":"吕蒙","cat":"人物","sub":"謀臣","y":"UR","fac":"東吳","e":"水","a":12600,"d":12800,"ev":0.125,"art":"img/s1/card_SANK-P-UR-016.webp","intro":"呂蒙，字子明，汝南富陂人，東吳名將","full":"呂蒙，字子明，汝南富陂人，東吳名將。士別三日刮目相看，代魯肅鎮守陸口，白衣渡江襲取荊州，擒斬關羽。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-016"},{"i":"SANK-P-UR-023","pid":"29091027757787458535","h":"杜預","s":"杜预","cat":"人物","sub":"武將","y":"UR","fac":"晉","e":"土","a":11700,"d":12700,"ev":0.115,"art":"img/s1/card_SANK-P-UR-023.webp","intro":"杜預，字元凱，京兆杜陵人，西晉名將","full":"杜預，字元凱，京兆杜陵人，西晉名將。鎮守荊州，籌劃並統兵滅吳，結束三國分裂；兼通經學兵法，時人稱「杜武庫」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-023"},{"i":"SANK-P-UR-022","pid":"69538278409948902283","h":"羊祜","s":"羊祜","cat":"人物","sub":"武將","y":"UR","fac":"晉","e":"土","a":12300,"d":12800,"ev":0.12,"art":"img/s1/card_SANK-P-UR-022.webp","intro":"羊祜，字叔子，泰山郡南城縣人","full":"羊祜（221年—278年12月27日），字叔子，泰山郡南城縣（今山東省新泰市）人。曹魏晚期與西晉早期大臣、作家，一代名將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-022"},{"i":"SANK-P-UR-018","pid":"63640697757047482842","h":"陸抗","s":"陆抗","cat":"人物","sub":"武將","y":"UR","fac":"東吳","e":"水","a":12300,"d":12800,"ev":0.125,"art":"img/s1/card_SANK-P-UR-018.webp","intro":"陸抗，字幼節，吳郡吳縣人，孫吳後期名將。","full":"陸抗（226年—274年），字幼節，陸遜的次子，亦是孫策的外孫，吳郡吳縣（今江蘇省蘇州市）人，中國三國時孫吳後期名將，官至大司馬、荊州牧。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-018"},{"i":"SANK-P-UR-056","pid":"54651824054391602981","h":"張昭","s":"张昭","cat":"人物","sub":"文官","y":"UR","fac":"東吳","e":"水","a":11200,"d":11700,"ev":0.085,"art":"img/s1/card_SANK-P-SSR-056.webp","intro":"張昭，字子布，徐州彭城人，孫吳重臣。","full":"張昭，字子布，徐州彭城人，東漢末年孫吳的重臣、政治家、文學家、書法家；享年八十一歲，死後諡曰文侯。孫策創業時，任命其為長史、撫軍中郎將，將文武之事都委任於張昭。孫策臨終前，將其弟孫權託付給張昭，張昭率群臣忠心竭盡全力幫助孫權，並安撫百姓、討伐山賊，與中護軍周瑜共同掌管軍政，穩定內憂外患的局勢。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-056"},{"i":"SANK-P-UR-027","pid":"91886075571663142040","h":"張角","s":"张角","cat":"人物","sub":"其他","y":"UR","fac":"群雄","e":"土","a":11600,"d":12800,"ev":0.13,"art":"img/s1/card_SANK-P-UR-027.webp","intro":"張角，鉅鹿人，東漢末年太平道首領、黃巾之亂領導人。","full":"張角（？—184年），鉅鹿人。東漢末年太平道首領、黃巾之亂領導人。張角死後所領導的叛亂很快被平定，但也成為造成漢朝衰亡的原因之一。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-027"},{"i":"SANK-E-W-UR-005","pid":"74558546124776557892","h":"七星寶刀","s":"七星宝刀","cat":"武器","sub":"","y":"UR","fac":"","e":"","a":988,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-UR-005.webp","intro":"七星寶刀，刀身嵌七星紋，曹操曾持之刺董卓。","full":"七星寶刀，刀身嵌七星紋，曹操曾持之刺董卓。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-UR-005"},{"i":"SANK-E-W-UR-001","pid":"90442887329434565075","h":"丈八蛇矛","s":"丈八蛇矛","cat":"武器","sub":"","y":"UR","fac":"","e":"","a":988,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-UR-001.webp","intro":"丈八蛇矛，矛身長一丈八尺、蜿蜒如蛇，張飛所持。","full":"丈八蛇矛，矛身長一丈八尺、蜿蜒如蛇，張飛所持。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-UR-001"},{"i":"SANK-E-T-UR-006","pid":"26027387865630201178","h":"九錫","s":"九锡","cat":"寶物","sub":"","y":"UR","fac":"","e":"","a":null,"d":758,"ev":null,"art":"img/s1/card_SANK-E-T-UR-006.webp","intro":"九錫，天子賜予權臣的九種禮器，受九錫者多被視為篡位前兆。","full":"九錫，天子賜予權臣的九種禮器，受九錫者多被視為篡位前兆。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-006"},{"i":"SANK-P-UR-003","pid":"77622633917481557625","h":"于禁","s":"于禁","cat":"人物","sub":"武將","y":"UR","fac":"曹魏","e":"火","a":12600,"d":12700,"ev":0.095,"art":"img/s1/card_SANK-P-SSR-003.webp","intro":"于禁，字文則，泰山鉅平縣人，東漢末曹魏左將軍，五子良將之一","full":"于禁，字文則，泰山鉅平縣人，東漢末曹魏左將軍，五子良將之一。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-003"},{"i":"SANK-P-UR-59","pid":"04472947020607361580","h":"凌統","s":"凌统","cat":"人物","sub":"武將","y":"UR","fac":"東吳","e":"水","a":12800,"d":12600,"ev":0,"art":"img/s1/card_SANK-P-SSR-59.webp","intro":"凌統，字公績，吳郡餘杭人，江表十二虎臣之一。","full":"凌統（189年—217年），字公績，一作公續，揚州吳郡餘杭（今浙江省杭州市餘杭區）人，東漢末年軍閥孫權的重要將領，江表十二虎臣之一。少有名盛，為人有國士之風；多次戰役中表現出色，後拜為偏將軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-59"},{"i":"SANK-P-UR-026","pid":"79796171214955498140","h":"劉表","s":"刘表","cat":"人物","sub":"","y":"UR","fac":"群雄","e":"土","a":11700,"d":12000,"ev":0.115,"art":"img/s1/card_SANK-P-UR-026.webp","intro":"劉表，字景升，山陽高平人，漢室宗室，荊州牧","full":"劉表，字景升，山陽高平人，漢室宗室，荊州牧。單騎入荊州，守境安民、收容流民，經營荊州近二十年，卒後次子劉琮舉州降曹。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-026"},{"i":"SANK-E-W-UR-003","pid":"91355143545562423884","h":"古錠刀","s":"古锭刀","cat":"武器","sub":"","y":"UR","fac":"","e":"","a":988,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-UR-003.webp","intro":"古錠刀，孫堅所持戰刀，隨其起兵討董卓。","full":"古錠刀，孫堅所持戰刀，隨其起兵討董卓。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-UR-003"},{"i":"SANK-E-T-UR-007","pid":"67995687647840305589","h":"史記","s":"史记","cat":"書籍","sub":"史書","y":"UR","fac":"","e":"","a":null,"d":752,"ev":null,"art":"img/s1/card_SANK-E-T-UR-007.webp","intro":"史記，三國典籍・史書","full":"史記，三國典籍・史書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-007"},{"i":"SANK-P-UR-021","pid":"83005428131939154825","h":"司馬炎","s":"司马炎","cat":"人物","sub":"君主宗室","y":"UR","fac":"晉","e":"土","a":12200,"d":12400,"ev":0.115,"art":"img/s1/card_SANK-P-UR-021.webp","intro":"晉武帝司馬炎，字安世，河內郡溫縣人","full":"晉武帝司馬炎，字安世，河內郡溫縣人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-021"},{"i":"SANK-P-UR-048","pid":"67039020884105233065","h":"周泰","s":"周泰","cat":"人物","sub":"武將","y":"UR","fac":"東吳","e":"水","a":12800,"d":12600,"ev":0.095,"art":"img/s1/card_SANK-P-SSR-048.webp","intro":"周泰，字幼平，揚州九江下蔡人","full":"周泰（？—222年），字幼平，揚州九江下蔡（今安徽鳳臺）人。漢末三國時期孫策麾下的孫吳名將；是江東十二虎臣之一。與蔣欽是同鄉九江人，因護主有功，孫權賞賜予御幘青縑蓋，官至漢中太守、奮威將軍，封陵陽侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-048"},{"i":"SANK-P-UR-001","pid":"34564079346858148217","h":"夏侯惇","s":"夏侯惇","cat":"人物","sub":"武將","y":"UR","fac":"曹魏","e":"火","a":12800,"d":12900,"ev":0.135,"art":"img/s1/card_SANK-P-UR-001.webp","intro":"夏侯惇，字元讓，別名盲夏侯，沛國譙縣人，曹操的族兄","full":"夏侯惇，字元讓，別名盲夏侯，沛國譙縣人，曹操的族兄。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-001"},{"i":"SANK-E-T-UR-010","pid":"89368848509353541248","h":"大克鼎","s":"大克鼎","cat":"寶物","sub":"","y":"UR","fac":"","e":"","a":null,"d":758,"ev":null,"art":"img/s1/card_SANK-E-T-UR-010.webp","intro":"大克鼎，西周青銅重器，腹飾竊曲紋，銘文記冊命之禮。","full":"大克鼎，西周青銅重器，腹飾竊曲紋，銘文記冊命之禮。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-010"},{"i":"SANK-E-T-UR-011","pid":"12579850115141261230","h":"大盂鼎","s":"大盂鼎","cat":"寶物","sub":"","y":"UR","fac":"","e":"","a":null,"d":758,"ev":null,"art":"img/s1/card_SANK-E-T-UR-011.webp","intro":"大盂鼎，西周康王時青銅鼎，銘文近三百字，記述訓誥。","full":"大盂鼎，西周康王時青銅鼎，銘文近三百字，記述訓誥。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-011"},{"i":"SANK-E-T-UR-002","pid":"32888262294441879196","h":"太平要術","s":"太平要术","cat":"書籍","sub":"奇書","y":"UR","fac":"","e":"","a":null,"d":752,"ev":null,"art":"img/s1/card_SANK-E-T-UR-002.webp","intro":"《太平經》又名《太平清領書》，是中國最早的道教經典。","full":"《太平經》，又名《太平清領書》，是中國最早的道教經典，東漢道教太平道的典籍，共一百七十卷，相傳由神人授予方士于吉。後來張角靠這部書創立太平道，成為漢末太平道的主要經典。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-002"},{"i":"SANK-P-UR-014","pid":"45698762533166534229","h":"孫堅","s":"孙坚","cat":"人物","sub":"","y":"UR","fac":"東吳","e":"水","a":12800,"d":12900,"ev":0.13,"art":"img/s1/card_SANK-P-UR-014.webp","intro":"孫堅，字文台，吳郡富春人，東吳政權奠基者","full":"孫堅，字文台，吳郡富春人，東吳政權奠基者。參與討伐黃巾與董卓，作戰驍勇，號「江東猛虎」，後攻劉表時於峴山中伏身死。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-014"},{"i":"SANK-E-T-UR-003","pid":"91489146056300545848","h":"孫子兵法","s":"孙子兵法","cat":"書籍","sub":"兵書","y":"UR","fac":"","e":"","a":null,"d":752,"ev":null,"art":"img/s1/card_SANK-E-T-UR-003.webp","intro":"孫子兵法，三國典籍・兵書","full":"孫子兵法，三國典籍・兵書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-003"},{"i":"SANK-P-UR-015","pid":"05185097609397801854","h":"孫策","s":"孙策","cat":"人物","sub":"","y":"UR","fac":"東吳","e":"水","a":12800,"d":12900,"ev":0.135,"art":"img/s1/card_SANK-P-UR-015.webp","intro":"孫策，字伯符，孫堅長子","full":"孫策，字伯符，孫堅長子。以玉璽借兵渡江，數年間平定江東六郡，人稱「小霸王」，重用周瑜、張昭，遇刺早逝，傳位其弟孫權。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-015"},{"i":"SANK-P-UR-094","pid":"46289011374773654810","h":"張遼","s":"张辽","cat":"人物","sub":"武將","y":"UR","fac":"曹魏","e":"火","a":12800,"d":12900,"ev":0.135,"art":"img/s1/card_SANK-P-UR-003.webp","intro":"張遼，字文遠，雁門郡馬邑縣人","full":"張遼（169年—222年），字文遠，雁門郡馬邑縣（今山西省朔州市朔城區）人。本姓聶，是西漢聶壹之後，為避禍改姓張。東漢末、三國時期曹魏前將軍，五子良將之一，諡號為剛侯。後為歷代所推崇，唐朝時位列古今六十四名將之一。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-094"},{"i":"SANK-P-UR-002","pid":"36077670973351082422","h":"張郃","s":"张郃","cat":"人物","sub":"武將","y":"UR","fac":"曹魏","e":"火","a":12800,"d":12900,"ev":0.1,"art":"img/s1/card_SANK-P-SSR-002.webp","intro":"張郃，字儁乂，河間國鄚縣人，三國時期曹魏名將。","full":"張郃（ㄏㄜˊ）（2世紀？—231年），字儁（ㄐㄩㄣˋ）乂（ㄧˋ），河間國鄚縣（今河北省任丘市）人，三國時期曹魏名將，官至征西車騎將軍，封鄚侯；死後，追封諡曰壯侯。以「臨場巧變」見稱，先隨韓馥，後隨袁紹。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-002"},{"i":"SANK-P-UR-008","pid":"31719218077518446446","h":"張飛","s":"张飞","cat":"人物","sub":"武將","y":"UR","fac":"蜀漢","e":"木","a":13000,"d":12700,"ev":0.13,"art":"img/s1/card_SANK-P-UR-008.webp","intro":"張飛，字益德，涿郡人，蜀漢五虎上將之一","full":"張飛，字益德，涿郡人，蜀漢五虎上將之一。當陽長坂橋一聲喝斥退曹軍，隨取益州、鎮守巴西，勇猛與關羽齊名，後為部將張達、范彊所害。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-008"},{"i":"SANK-P-UR-095","pid":"70432016042969346879","h":"徐晃","s":"徐晃","cat":"人物","sub":"武將","y":"UR","fac":"曹魏","e":"火","a":12800,"d":12900,"ev":0.105,"art":"img/s1/card_SANK-P-SSR-001.webp","intro":"徐晃，字公明，河東郡楊縣人，曹魏名將，五子良將之一。","full":"徐晃（? 年—227年），字公明，三國時期河東郡楊縣（今中國山西省洪洞縣東南）人，三國時期曹魏著名將領，五子良將之一。早年隨楊奉保護皇帝劉協，公元200年官渡之戰擊殺文醜，又襲擊韓猛押運的袁軍糧車，此戰徐晃功勞最大。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-095"},{"i":"SANK-E-A-UR-001","pid":"48824417757469079245","h":"明光鎧","s":"明光铠","cat":"鎧甲","sub":"","y":"UR","fac":"","e":"","a":null,"d":1070,"ev":null,"art":"img/s1/card_SANK-E-A-UR-001.webp","intro":"明光鎧，胸前嵌圓形護鏡，日光下反射明亮。","full":"明光鎧，胸前嵌圓形護鏡，日光下反射明亮。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-UR-001"},{"i":"SANK-E-T-UR-008","pid":"67465716328433009543","h":"易經","s":"易经","cat":"書籍","sub":"經書","y":"UR","fac":"","e":"","a":null,"d":752,"ev":null,"art":"img/s1/card_SANK-E-T-UR-008.webp","intro":"易經，三國典籍・經書","full":"易經，三國典籍・經書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-008"},{"i":"SANK-E-W-UR-008","pid":"02118862893027558627","h":"李廣弓","s":"李广弓","cat":"武器","sub":"","y":"UR","fac":"","e":"","a":988,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-UR-008.webp","intro":"李廣弓，相傳為漢飛將軍李廣所用，弓力強勁。","full":"李廣弓，相傳為漢飛將軍李廣所用，弓力強勁。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-UR-008"},{"i":"SANK-P-UR-096","pid":"13804622715879359533","h":"樂進","s":"乐进","cat":"人物","sub":"武將","y":"UR","fac":"曹魏","e":"火","a":12700,"d":12600,"ev":0.1,"art":"img/s1/card_SANK-P-SSR-004.webp","intro":"樂進，字文謙，兗州陽平郡衛國縣人，東漢末年曹操重要將領。","full":"樂進，字文謙，兗州陽平郡衛國縣人，東漢末年曹操重要將領，五子良將中最先跟隨曹操。在袁氏討伐的戰役中表現出色，每戰都率先到達戰場，經常立下戰功；公元215年，與張遼、李典七千兵馬一起駐屯合肥，樂進守城，張遼、李典出城迎擊。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-096"},{"i":"SANK-E-T-UR-009","pid":"98941244970869734227","h":"毛公鼎","s":"毛公鼎","cat":"寶物","sub":"","y":"UR","fac":"","e":"","a":null,"d":758,"ev":null,"art":"img/s1/card_SANK-E-T-UR-009.webp","intro":"毛公鼎，西周宣王時青銅鼎，銘文近五百字，為現存銘文最長之鼎。","full":"毛公鼎，西周宣王時青銅鼎，銘文近五百字，為現存銘文最長之鼎。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-009"},{"i":"SANK-E-M-UR-001","pid":"39793368855468209562","h":"爪黃飛電","s":"爪黄飞电","cat":"坐騎","sub":"","y":"UR","fac":"","e":"","a":null,"d":515,"ev":null,"art":"img/s1/card_SANK-E-M-SSR-001.webp","intro":"爪黃飛電，為歷史小說《三國演義》虛構的馬匹，不見於正史記載中","full":"爪黃飛電，為歷史小說《三國演義》虛構的馬匹，不見於正史記載中","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-M-UR-001"},{"i":"SANK-E-A-UR-002","pid":"90031775096442325045","h":"玄甲","s":"玄甲","cat":"鎧甲","sub":"","y":"UR","fac":"","e":"","a":null,"d":1070,"ev":null,"art":"img/s1/card_SANK-E-A-UR-002.webp","intro":"玄甲，黑漆鐵片編綴的重甲，防護力強。","full":"玄甲，黑漆鐵片編綴的重甲，防護力強。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-UR-002"},{"i":"SANK-E-A-UR-004","pid":"79185880693258416056","h":"白龍鱗甲","s":"白龙鳞甲","cat":"鎧甲","sub":"","y":"UR","fac":"","e":"","a":null,"d":1070,"ev":null,"art":"img/s1/card_SANK-E-A-UR-004.webp","intro":"白龍鱗甲，甲片層疊如龍鱗，色白而堅。","full":"白龍鱗甲，甲片層疊如龍鱗，色白而堅。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-UR-004"},{"i":"SANK-E-M-UR-002","pid":"24430605984187786614","h":"的盧馬","s":"的卢马","cat":"坐騎","sub":"","y":"UR","fac":"","e":"","a":null,"d":515,"ev":null,"art":"img/s1/card_SANK-E-M-UR-002.webp","intro":"的盧，古代一種白額馬，相傳為凶馬，劉備曾乘之。","full":"的盧，本字是的顱，古代一種白額馬，亦稱馰、馰顱或馰顙，又稱戴星馬。三國時代劉備所乘的名馬的盧又名榆雁，相傳是匹凶馬；《相馬經》稱「馬白額入口至齒者，名曰榆雁，一名的盧」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-M-UR-002"},{"i":"SANK-P-UR-049","pid":"77890476354288042128","h":"程普","s":"程普","cat":"人物","sub":"武將","y":"UR","fac":"東吳","e":"水","a":12600,"d":12700,"ev":0.09,"art":"img/s1/card_SANK-P-SSR-049.webp","intro":"程普，字德謀，幽州右北平土垠人","full":"程普，字德謀，幽州右北平土垠人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-049"},{"i":"SANK-P-UR-92","pid":"54628454804284186353","h":"華佗","s":"华佗","cat":"人物","sub":"","y":"UR","fac":"群雄","e":"土","a":12400,"d":11400,"ev":0,"art":"img/s1/card_SANK-P-UC-92.webp","intro":"華佗，字元化，沛國譙縣人。","full":"華佗（145年—208年），字元化，名旉（讀音同「敷」），沛國譙縣（今安徽亳州市）人，東漢末年的方士、醫師。華佗與董奉和張仲景被並稱為「建安三神醫」。與扁鵲、張仲景及李時珍並稱中國古代四大名醫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-92"},{"i":"SANK-P-UR-025","pid":"43181369173661833829","h":"董卓","s":"董卓","cat":"人物","sub":"武將","y":"UR","fac":"群雄","e":"土","a":12700,"d":12800,"ev":0.125,"art":"img/s1/card_SANK-P-UR-025.webp","intro":"董卓，字仲穎，涼州隴西臨洮人，東漢與羌的戰爭中崛起的漢軍將領","full":"董卓，字仲穎，涼州隴西臨洮人，東漢與羌的戰爭中崛起的漢軍將領。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-025"},{"i":"SANK-P-UR-024","pid":"24006693439314865039","h":"袁紹","s":"袁绍","cat":"人物","sub":"","y":"UR","fac":"群雄","e":"土","a":12400,"d":12600,"ev":0.12,"art":"img/s1/card_SANK-P-UR-024.webp","intro":"袁紹，字本初，汝南汝陽人，出身四世三公","full":"袁紹，字本初，汝南汝陽人，出身四世三公。為關東討董聯軍盟主，據冀、青、幽、并四州稱雄河北，官渡之戰大敗於曹操，不久憂憤而卒。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-024"},{"i":"SANK-E-W-UR-004","pid":"36037620557377168234","h":"諸葛連弩","s":"诸葛连弩","cat":"武器","sub":"","y":"UR","fac":"","e":"","a":988,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-UR-004.webp","intro":"連弩是一種古代的遠射武器，改進自弩，共分兩種。","full":"連弩是一種古代的遠射武器，改進自弩，共分兩種。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-UR-004"},{"i":"SANK-E-T-UR-005","pid":"88409864153509309406","h":"銅虎符","s":"铜虎符","cat":"寶物","sub":"","y":"UR","fac":"","e":"","a":null,"d":758,"ev":null,"art":"img/s1/card_SANK-E-T-UR-005.webp","intro":"虎符是源於中國的金屬製的虎形調兵憑證，後來傳至朝鮮、越南","full":"虎符是源於中國的金屬製的虎形調兵憑證，後來傳至朝鮮、越南","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-005"},{"i":"SANK-E-W-UR-006","pid":"42936570187683308874","h":"鐵脊蛇矛","s":"铁脊蛇矛","cat":"武器","sub":"","y":"UR","fac":"","e":"","a":988,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-UR-006.webp","intro":"鐵脊蛇矛，矛脊以鐵鍛成、形似蛇身的長矛。","full":"鐵脊蛇矛，矛脊以鐵鍛成、形似蛇身的長矛。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-UR-006"},{"i":"SANK-E-T-UR-012","pid":"97965520290958113133","h":"長信宮燈","s":"长信宫灯","cat":"寶物","sub":"","y":"UR","fac":"","e":"","a":null,"d":758,"ev":null,"art":"img/s1/card_SANK-E-T-UR-012.webp","intro":"長信宮燈是西漢青銅鎏金燈具之一。","full":"長信宮燈是西漢青銅鎏金燈具之一。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-012"},{"i":"SANK-E-W-UR-009","pid":"90788924046123544626","h":"雌雄一對劍","s":"雌雄一对剑","cat":"武器","sub":"","y":"UR","fac":"","e":"","a":988,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-UR-009.webp","intro":"雌雄一對劍，成對雙劍，一雌一雄，合璧使用。","full":"雌雄一對劍，成對雙劍，一雌一雄，合璧使用。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-UR-009"},{"i":"SANK-E-W-UR-002","pid":"00742160802231566325","h":"雙股劍","s":"双股剑","cat":"武器","sub":"","y":"UR","fac":"","e":"","a":988,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-UR-002.webp","intro":"雙股劍，劉備所持雙劍，左右各一，可分可合。","full":"雙股劍，劉備所持雙劍，左右各一，可分可合。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-UR-002"},{"i":"SANK-E-T-UR-004","pid":"35920492831352511732","h":"青囊書","s":"青囊书","cat":"書籍","sub":"醫書","y":"UR","fac":"","e":"","a":null,"d":752,"ev":null,"art":"img/s1/card_SANK-E-T-UR-004.webp","intro":"青囊書傳說是華佗所編寫的醫書，記載著華佗一生的醫學心得","full":"青囊書傳說是華佗所編寫的醫書，記載著華佗一生的醫學心得","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-UR-004"},{"i":"SANK-P-UR-009","pid":"40247172674288511877","h":"馬超","s":"马超","cat":"人物","sub":"武將","y":"UR","fac":"蜀漢","e":"木","a":12900,"d":12800,"ev":0.14,"art":"img/s1/card_SANK-P-UR-009.webp","intro":"馬超，字孟起，扶風茂陵人，西涼名將","full":"馬超，字孟起，扶風茂陵人，西涼名將。聯韓遂起兵反曹於潼關，兵敗後依附張魯，再歸劉備，官至驃騎將軍，封斄鄉侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-009"},{"i":"SANK-P-UR-080","pid":"38492417433958132617","h":"馬騰","s":"马腾","cat":"人物","sub":"武將","y":"UR","fac":"群雄","e":"土","a":12600,"d":12700,"ev":0.095,"art":"img/s1/card_SANK-P-SSR-080.webp","intro":"馬騰，字壽成，是東漢初名將馬援之後人。","full":"馬騰，字壽成，中國東漢末年之武將及軍閥，是東漢初名將馬援之後人，父親馬平任蘭干縣尉，後因失官而留在隴西。馬騰之父馬平最初因家貧而無妻，其後與羌人女性結婚生下馬騰，所以馬騰母系是羌人。馬騰是蜀漢武將馬超之父，此外亦有馬休與馬鐵二子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-080"},{"i":"SANK-P-UR-097","pid":"84582752986671255233","h":"魏延","s":"魏延","cat":"人物","sub":"武將","y":"UR","fac":"蜀漢","e":"木","a":12800,"d":12700,"ev":0.105,"art":"img/s1/card_SANK-P-SSR-026.webp","intro":"魏延，字文長，荊州義陽郡人，蜀漢中期重要將領。","full":"魏延（2世紀—234年），字文長，荊州義陽郡人，三國時期蜀漢中期重要將領，作戰英勇、並有將略、屢立戰功，深得蜀主劉備信任、丞相諸葛亮重用。劉備時期任魏延鎮北將軍、漢中太守，於諸葛亮北伐時期出任前軍師，參與北伐時前線戰事之決策。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-097"},{"i":"SANK-E-A-UR-003","pid":"62932250254942853555","h":"魚鱗鎧","s":"鱼鳞铠","cat":"鎧甲","sub":"","y":"UR","fac":"","e":"","a":null,"d":1070,"ev":null,"art":"img/s1/card_SANK-E-A-UR-003.webp","intro":"魚鱗鎧，甲片細密如魚鱗層疊，靈活而防護周全。","full":"魚鱗鎧，甲片細密如魚鱗層疊，靈活而防護周全。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-UR-003"},{"i":"SANK-P-UR-098","pid":"39587698792489794983","h":"黃忠","s":"黄忠","cat":"人物","sub":"武將","y":"UR","fac":"蜀漢","e":"木","a":12900,"d":12800,"ev":0.12,"art":"img/s1/card_SANK-P-UR-010.webp","intro":"黃忠，字漢升，南陽人，蜀漢名將","full":"黃忠，字漢升，南陽人，蜀漢名將。老當益壯，定軍山一戰親斬夏侯淵，位列五虎上將，官至後將軍，封關內侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-098"},{"i":"SANK-P-UR-050","pid":"26376976691122366470","h":"黃蓋","s":"黄盖","cat":"人物","sub":"武將","y":"UR","fac":"東吳","e":"水","a":12700,"d":12600,"ev":0.09,"art":"img/s1/card_SANK-P-SSR-050.webp","intro":"黃蓋，字公覆，荊州零陵泉陵人","full":"黃蓋（2世紀—215年前），字公覆，荊州零陵泉陵（今湖南零陵北）人。東漢末年將領，官至偏將軍、武陵太守，東吳孫氏三代元勳之一；是江東十二虎臣之一。赤壁之戰中率先提出火攻計策，親自詐降從而大敗曹操。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-UR-050"},{"i":"SANK-P-SSR-004","pid":"19162107321225803949","h":"司馬懿","s":"司马懿","cat":"人物","sub":"武將","y":"SSR","fac":"曹魏","e":"火","a":10600,"d":11000,"ev":0.17,"art":"img/s1/card_SANK-P-EXR-004.webp","intro":"司馬懿，字仲達，河內溫縣人，曹魏重臣","full":"司馬懿，字仲達，河內溫縣人，曹魏重臣。抵禦諸葛亮北伐、平定遼東，晚年發動高平陵之變掌握大權，其子司馬昭、孫司馬炎終結曹魏、開晉室基業。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-004"},{"i":"SANK-P-SSR-45","pid":"05701185066833722942","h":"田豐","s":"田丰","cat":"人物","sub":"謀臣","y":"SSR","fac":"曹魏","e":"火","a":10300,"d":10700,"ev":0,"art":"img/s1/card_SANK-P-R-45.webp","intro":"首席謀士，剛直被賜死","full":"田豐可以指： 田豐 (東漢)，東漢末年政治人物，為袁紹的謀士 田豐 (元朝)，元朝末年紅巾軍將領 田豐 (明朝)，明代湖廣永順土官 田豐 (1887年)，中國政治人物，河南省政協副主席 田豐 (演員)，香港演員 田豐 (金融人物)，中國農業。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-45"},{"i":"SANK-P-SSR-6","pid":"17069846663010481112","h":"徐庶","s":"徐庶","cat":"人物","sub":"謀臣","y":"SSR","fac":"曹魏","e":"火","a":10600,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-R-6.webp","intro":"徐庶，字元直，豫州潁川長社人。","full":"徐庶（活躍期2世紀—3世紀），字元直，原名福，小說《三國演義》將徐庶的化名誤植為單福，豫州潁川長社（今河南長葛）人。東漢末至三國時人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-6"},{"i":"SANK-P-SSR-105","pid":"59331310578573707553","h":"李儒","s":"李儒","cat":"人物","sub":"謀臣","y":"SSR","fac":"蜀漢","e":"木","a":10300,"d":10600,"ev":0,"art":"img/s1/card_SANK-P-UC-105.webp","intro":"李儒，字文優，司隸左馮翊郃陽人，東漢末期的博士。","full":"李儒（？—？），字文優，袁崧《後漢書》作李孝儒，東漢末期的博士，司隸左馮翊郃陽人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-105"},{"i":"SANK-P-SSR-14","pid":"28107448692427236804","h":"沮授","s":"沮授","cat":"人物","sub":"謀臣","y":"SSR","fac":"群雄","e":"土","a":10400,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-R-14.webp","intro":"沮授，冀州鉅鹿郡廣平縣人，袁紹破冀州後成為其重要謀臣。","full":"沮授，冀州鉅鹿郡廣平縣人，東漢末年謀士，五帝時黃帝的史官沮誦之後，原為韓馥麾下謀士，袁紹破冀州後成為其重要謀臣，沮授監統內外、威震三軍，提出鄴城對幫助袁紹奪取青州、幽州、并州而統一河北。袁紹入主冀州前，曾多次對韓馥提出抗袁良策，但不被採納。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-14"},{"i":"SANK-P-SSR-53","pid":"74551034562970391265","h":"蒯良","s":"蒯良","cat":"人物","sub":"謀臣","y":"SSR","fac":"曹魏","e":"火","a":10300,"d":10700,"ev":0,"art":"img/s1/card_SANK-P-R-53.webp","intro":"蒯良，字子柔，東漢末年荊州南郡襄陽中廬人。","full":"蒯良（？—？），字子柔，東漢末年荊州南郡襄陽中廬人，荊州牧劉表麾下的重要謀士，被劉表譽為「雍季之論」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-53"},{"i":"SANK-P-SSR-69","pid":"55881177532783868420","h":"諸葛恪","s":"诸葛恪","cat":"人物","sub":"武將","y":"SSR","fac":"東吳","e":"水","a":10500,"d":10700,"ev":0,"art":"img/s1/card_SANK-P-SSR-69.webp","intro":"諸葛恪，字元遜，琅琊陽都人，諸葛瑾之子，東吳太傅","full":"諸葛恪，字元遜，琅琊陽都人，諸葛瑾之子，東吳太傅。辯才敏捷，輔佐少帝孫亮，主政北伐魏國，後剛愎專斷，為宗室孫峻設計誅殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-69"},{"i":"SANK-P-SSR-23","pid":"79804118329438341197","h":"劉曄","s":"刘晔","cat":"人物","sub":"謀臣","y":"SSR","fac":"曹魏","e":"火","a":10300,"d":10400,"ev":0,"art":"img/s1/card_SANK-P-SSR-23.webp","intro":"劉曄，字子揚，淮南成德人，漢室阜陵王之後，曹魏謀臣","full":"劉曄，字子揚，淮南成德人，漢室阜陵王之後，曹魏謀臣。料事精準，屢獻決策於曹操、曹丕、曹叡三朝，官至太中大夫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-23"},{"i":"SANK-P-SSR-65","pid":"21846168112933867019","h":"張紘","s":"张纮","cat":"人物","sub":"文官","y":"SSR","fac":"東吳","e":"水","a":10200,"d":10300,"ev":0,"art":"img/s1/card_SANK-P-SSR-65.webp","intro":"張紘，字子綱，徐州廣陵郡射陽縣人。","full":"張紘（公元2世紀—209年或212年），字子綱，徐州廣陵郡射陽縣（今江蘇揚州）人，東漢末年孫吳的外交家、戰略家、政治家、文學家、書法家。張紘好文學，又擅於小篆、楷書有很深厚的造詣。其曾為柟榴枕作賦，受到陳琳的推崇。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-65"},{"i":"SANK-P-SSR-173","pid":"01260334212566698678","h":"黃月英","s":"黄月英","cat":"人物","sub":"其他","y":"SSR","fac":"晉","e":"土","a":10300,"d":10400,"ev":0,"art":"img/s1/card_SANK-P-R-173.webp","intro":"諸葛亮妻，相傳智慧過人","full":"黃夫人（2世紀—？），《三國志》裡沒有記述其名字，民間相傳為黃月英、黃綬、黃碩，蜀漢丞相忠武侯諸葛亮之妻、名士黃承彥之女。據其父所言，其髮黃膚黑，面貌奇醜，故民間稱其俗名為黃阿醜，雖然其貌不揚但博學多才且賢慧。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-173"},{"i":"SANK-P-SSR-074","pid":"89296781895300058669","h":"賈充","s":"贾充","cat":"人物","sub":"文官","y":"SSR","fac":"晉","e":"土","a":10300,"d":10500,"ev":0.08,"art":"img/s1/card_SANK-P-SSR-074.webp","intro":"賈充，字公閭，平陽襄陵人，西晉建國功臣。","full":"賈充，字公閭，平陽郡襄陵縣人，曹魏豫州刺史賈逵之子，是三國時代仕於魏國和西晉的大臣。西晉建國功臣，司馬昭和司馬炎的心腹，其女兒賈褒及賈南風分別嫁予司馬炎弟司馬攸及兒子司馬衷，與皇室結為姻親，地位顯赫，諡號武公。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-074"},{"i":"SANK-P-SSR-21","pid":"87949553683167027284","h":"陳泰","s":"陈泰","cat":"人物","sub":"文官","y":"SSR","fac":"曹魏","e":"火","a":10700,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-SSR-21.webp","intro":"陳泰，字玄伯，潁川許昌人，陳群之子","full":"陳泰，字玄伯，潁川許昌人，陳群之子。鎮守雍州抵御蜀將姜維，屢有戰績，後入朝任尚書左僕射，為人持重有德望。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-21"},{"i":"SANK-P-SSR-278","pid":"76152129193586697526","h":"馬良","s":"马良","cat":"人物","sub":"文官","y":"SSR","fac":"蜀漢","e":"木","a":10200,"d":10500,"ev":0,"art":"img/s1/card_SANK-P-SSR-45.webp","intro":"馬良，字季常，荊州襄陽宜城人，三國蜀漢時期是劉備的侍中","full":"馬良，字季常，荊州襄陽宜城人，三國蜀漢時期是劉備的侍中。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-278"},{"i":"SANK-P-SSR-036","pid":"68200227184580557845","h":"蔣琬","s":"蒋琬","cat":"人物","sub":"文官","y":"SSR","fac":"蜀漢","e":"木","a":10300,"d":10800,"ev":0.085,"art":"img/s1/card_SANK-P-SSR-036.webp","intro":"蔣琬，字公琰，三國時代蜀漢的重臣，是劉敏、潘濬表兄","full":"蔣琬，字公琰，三國時代蜀漢的重臣，是劉敏、潘濬表兄。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-036"},{"i":"SANK-P-SSR-48","pid":"93312848235439577950","h":"張寶","s":"张宝","cat":"人物","sub":"其他","y":"SSR","fac":"曹魏","e":"火","a":10700,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-R-48.webp","intro":"地公將軍，張角二弟","full":"張寶（？—184年），張角二弟，鉅鹿人，東漢末黃巾起義領導人之一。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-48"},{"i":"SANK-P-SSR-19","pid":"53070561338657904586","h":"滿寵","s":"满宠","cat":"人物","sub":"武將","y":"SSR","fac":"曹魏","e":"火","a":10600,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-SSR-19.webp","intro":"滿寵，字伯寧，山陽昌邑人，東漢末年至三國時期曹魏名將。","full":"滿寵（175前—242年），字伯寧，山陽昌邑人，東漢末年至三國時期曹魏名將，身高八尺，素來以廉潔著稱。初任東漢實質首都許縣縣令，掌管司法，不畏強權而執法嚴苛。後轉任汝南太守，開始參與軍事。魏文帝在位期間，駐扎在新野，負責荊州側對吳作戰。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-19"},{"i":"SANK-P-SSR-037","pid":"09739518357558529523","h":"費禕","s":"费祎","cat":"人物","sub":"文官","y":"SSR","fac":"蜀漢","e":"木","a":10300,"d":10800,"ev":0.085,"art":"img/s1/card_SANK-P-SSR-037.webp","intro":"費禕，字文偉，江夏鄳人","full":"費禕（？—253年2月16日後數日），字文偉，江夏鄳人。三國時代蜀漢的政治家和將領，官至大將軍，在蜀漢和諸葛亮、蔣琬、董允並稱四相或四英，在一次回途的筵會中，被曹魏降將郭脩刺殺而亡，死後諡號敬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-037"},{"i":"SANK-P-SSR-057","pid":"71152343504557834525","h":"顧雍","s":"顾雍","cat":"人物","sub":"文官","y":"SSR","fac":"東吳","e":"水","a":10200,"d":10400,"ev":0.08,"art":"img/s1/card_SANK-P-SSR-057.webp","intro":"顧雍，字元歎，吳郡吳縣人，東吳在位最久的丞相。","full":"顧雍（168年—243年），字元歎，吳郡吳縣（今江蘇省蘇州市）人，是三國時期東吳的政治家和丞相，年幼時拜蔡邕為師，蔡琰的師兄，也是陸議的姑丈，東吳在位最久的丞相，精通琴藝書法，謚號肅侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-057"},{"i":"SANK-P-SSR-071","pid":"04177159403804089914","h":"王濬","s":"王濬","cat":"人物","sub":"武將","y":"SSR","fac":"晉","e":"土","a":10700,"d":10800,"ev":0.09,"art":"img/s1/card_SANK-P-SSR-071.webp","intro":"王濬，字士治，小字阿童","full":"王濬（ㄐㄩㄣˋ）（206年—286年1月28日），字士治，小字阿童。弘農郡湖縣（今河南靈寶西）人，西晉政治人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-071"},{"i":"SANK-P-SSR-008","pid":"08511812521663451442","h":"郭淮","s":"郭淮","cat":"人物","sub":"武將","y":"SSR","fac":"曹魏","e":"火","a":10800,"d":10900,"ev":0.095,"art":"img/s1/card_SANK-P-SSR-008.webp","intro":"郭淮，字伯濟，太原郡陽曲縣人，三國時代曹魏重要將領。","full":"郭淮（2世紀—255年2月23日），字伯濟，太原郡陽曲縣（今山西省太原市）人，三國時代曹魏重要將領，曾經多次與陳泰一起抵抗蜀漢姜維的進攻。255年去世，死後魏少帝曹髦追封他為大將軍，諡曰貞侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-008"},{"i":"SANK-P-SSR-5","pid":"83861528669761461770","h":"曹丕","s":"曹丕","cat":"人物","sub":"君主宗室","y":"SSR","fac":"曹魏","e":"火","a":10700,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-R-5.webp","intro":"魏文帝曹丕，字子桓，沛國譙縣人","full":"魏文帝曹丕，字子桓，沛國譙縣人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-5"},{"i":"SANK-P-SSR-20","pid":"96813864296819856724","h":"王基","s":"王基","cat":"人物","sub":"武將","y":"SSR","fac":"曹魏","e":"火","a":10800,"d":10900,"ev":0,"art":"img/s1/card_SANK-P-SSR-20.webp","intro":"王基，字伯輿，曹魏重臣","full":"王基，字伯輿，曹魏重臣。歷任荊州、揚州方鎮，參與平定東吳叛亂與鎮壽春之戰，治軍安民有聲，官至征南將軍，諡景侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-20"},{"i":"SANK-P-SSR-24","pid":"05631992659680048964","h":"蔣濟","s":"蒋济","cat":"人物","sub":"文官","y":"SSR","fac":"曹魏","e":"火","a":10400,"d":10500,"ev":0,"art":"img/s1/card_SANK-P-SSR-24.webp","intro":"蔣濟，字子通，楚國平阿人。","full":"蔣濟（2世紀？—249年5月18日），字子通。楚國平阿（今安徽省懷遠縣）人。東漢末及三國時曹魏名臣，官至太尉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-24"},{"i":"SANK-P-SSR-058","pid":"39549246674243310626","h":"諸葛瑾","s":"诸葛瑾","cat":"人物","sub":"武將","y":"SSR","fac":"東吳","e":"水","a":10300,"d":10800,"ev":0.085,"art":"img/s1/card_SANK-P-SSR-058.webp","intro":"諸葛瑾，字子瑜，琅琊陽都人，諸葛亮之兄，東吳重臣","full":"諸葛瑾，字子瑜，琅琊陽都人，諸葛亮之兄，東吳重臣。避亂江東受孫權器重，與孫權諮議大政，官至大將軍，封宛陵侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-058"},{"i":"SANK-P-SSR-31","pid":"15255638121418712168","h":"曹植","s":"曹植","cat":"人物","sub":"君主宗室","y":"SSR","fac":"曹魏","e":"火","a":10200,"d":10300,"ev":0,"art":"img/s1/card_SANK-P-R-31.webp","intro":"曹植，字子建，沛國譙縣人，三國時期曹魏的著名詩人和文學家。","full":"曹植（192年—232年12月27日），字子建，沛國譙縣（今安徽亳州）人，出生於東漢鄄城（今山東省菏澤市鄄城縣），曹操與卞氏嫡出之第三子，三國時期曹魏的著名詩人和文學家。「才高八斗」（「八斗之才」）、「七步成詩」等詞之語源。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-31"},{"i":"SANK-P-SSR-055","pid":"39612331517485629229","h":"丁奉","s":"丁奉","cat":"人物","sub":"武將","y":"SSR","fac":"東吳","e":"水","a":10800,"d":10900,"ev":0.1,"art":"img/s1/card_SANK-P-SSR-055.webp","intro":"丁奉，字承淵，廬江安豐人，東吳老將","full":"丁奉，字承淵，廬江安豐人，東吳老將。自少從軍，歷事孫權、孫亮、孫休、孫皓，雪中奮短兵大破魏軍，數平內亂，官至大司馬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-055"},{"i":"SANK-E-W-SSR-015","pid":"30282948580784021097","h":"三丈矛","s":"三丈矛","cat":"武器","sub":"","y":"SSR","fac":"","e":"","a":730,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-SSR-015.webp","intro":"三丈矛，矛長三丈，需兩人共持，陣前拒馬之用。","full":"三丈矛，矛長三丈，需兩人共持，陣前拒馬之用。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-SSR-015"},{"i":"SANK-E-W-SSR-004","pid":"91462828454042197714","h":"三尖兩刃刀","s":"三尖两刃刀","cat":"武器","sub":"","y":"SSR","fac":"","e":"","a":730,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-SSR-004.webp","intro":"三尖兩刃刀，刀身分三尖兩刃，可刺可劈。","full":"三尖兩刃刀，刀身分三尖兩刃，可刺可劈。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-SSR-004"},{"i":"SANK-E-T-SSR-012","pid":"81145332951756603561","h":"三略","s":"三略","cat":"書籍","sub":"兵書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-012.webp","intro":"《三略》又稱《黃石公三略》，是中國古代的一本著名兵書。","full":"《三略》又稱《黃石公三略》，是中國古代的一本著名兵書。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-012"},{"i":"SANK-P-SSR-140","pid":"13448777760122202030","h":"于吉","s":"于吉","cat":"人物","sub":"其他","y":"SSR","fac":"東吳","e":"水","a":10400,"d":10900,"ev":0,"art":"img/s1/card_SANK-P-R-140.webp","intro":"于吉，琅琊郡人，東漢道士。","full":"于吉，《後漢書》作「干吉」，東漢道士，琅琊郡人，傳說是最早的道教典籍《太平清領書》的作者，後來的黃巾軍領袖張角靠此書中開創了最早的道教宗派之一太平道，相關經典被納入道藏太平部。于吉建立精舍，為百姓以符水治病，在吳、會等地廣受民眾敬奉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-140"},{"i":"SANK-E-T-SSR-029","pid":"94010480715810734877","h":"傷寒雜病論","s":"伤寒杂病论","cat":"書籍","sub":"醫書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-029.webp","intro":"傷寒雜病論，三國典籍・醫書","full":"傷寒雜病論，三國典籍・醫書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-029"},{"i":"SANK-E-A-SSR-002","pid":"45094164445596057298","h":"兩當鎧","s":"两当铠","cat":"鎧甲","sub":"","y":"SSR","fac":"","e":"","a":null,"d":725,"ev":null,"art":"img/s1/card_SANK-E-A-SSR-002.webp","intro":"兩當鎧，前後兩片以肩帶相連，穿脫便捷。","full":"兩當鎧，前後兩片以肩帶相連，穿脫便捷。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-SSR-002"},{"i":"SANK-E-T-SSR-001","pid":"69648416964692160549","h":"八陣圖","s":"八阵图","cat":"書籍","sub":"兵書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SR-001.webp","intro":"八陣圖，三國典籍・兵書","full":"八陣圖，三國典籍・兵書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-001"},{"i":"SANK-P-SSR-126","pid":"20431511215941896327","h":"公孫恭","s":"公孙恭","cat":"人物","sub":"君主宗室","y":"SSR","fac":"東吳","e":"水","a":10200,"d":10400,"ev":0,"art":"img/s1/card_SANK-P-R-126.webp","intro":"公孫恭，東漢末三國初年人物","full":"公孫恭，東漢末三國初年人物。父為公孫度，公孫康之弟。公孫康死後因二子尚幼而繼承遼東郡太守的職位，獲封永寧鄉侯。黃初二年（221年）三月，拜為車騎將軍、假節，封平郭侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-126"},{"i":"SANK-P-SSR-115","pid":"73570200168581198121","h":"公孫瓚","s":"公孙瓒","cat":"人物","sub":"","y":"SSR","fac":"群雄","e":"土","a":10800,"d":10900,"ev":0,"art":"img/s1/card_SANK-P-SR-115.webp","intro":"公孫瓚，字伯圭，幽州遼西令支人，曾任前將軍。","full":"公孫瓚，字伯圭，東漢末期人物，幽州遼西令支人，曾任前將軍，封易侯。曾與劉備和劉德然共同師事於盧植。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-115"},{"i":"SANK-E-T-SSR-011","pid":"61775992726678127320","h":"六韜","s":"六韬","cat":"書籍","sub":"兵書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-011.webp","intro":"六韜，三國典籍・兵書","full":"六韜，三國典籍・兵書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-011"},{"i":"SANK-E-T-SSR-028","pid":"35699368223961991949","h":"典論","s":"典论","cat":"書籍","sub":"論文","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-028.webp","intro":"典論，三國典籍・論文","full":"典論，三國典籍・論文","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-028"},{"i":"SANK-P-SSR-007","pid":"31525889624539115114","h":"劉備","s":"刘备","cat":"人物","sub":"","y":"SSR","fac":"蜀漢","e":"木","a":10700,"d":10800,"ev":0.165,"art":"img/s1/card_SANK-P-EXR-007.webp","intro":"劉備，字玄德，涿郡涿縣人，漢室宗親","full":"劉備，字玄德，涿郡涿縣人，漢室宗親。顛沛起兵，三顧茅廬得諸葛亮，取荊、益兩州，於成都稱帝建蜀漢，為漢昭烈帝，卒於白帝城。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-007"},{"i":"SANK-P-SSR-63","pid":"97654352805781577434","h":"劉封","s":"刘封","cat":"人物","sub":"武將","y":"SSR","fac":"蜀漢","e":"木","a":10800,"d":10900,"ev":0,"art":"img/s1/card_SANK-P-R-63.webp","intro":"劉封，東漢長沙郡羅縣人，官至副軍將軍。","full":"劉封，原名寇封（190年代—220年），東漢長沙郡羅縣（今湖北省宜昌市枝江市）人，出身名門世家，蜀漢開國之君劉備的過繼子，官至副軍將軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-63"},{"i":"SANK-P-SSR-116","pid":"27135616689455343127","h":"劉璋","s":"刘璋","cat":"人物","sub":"君主宗室","y":"SSR","fac":"群雄","e":"土","a":10000,"d":10200,"ev":0,"art":"img/s1/card_SANK-P-SR-116.webp","intro":"劉璋，字季玉，荊州江夏竟陵人，為漢朝宗室。","full":"劉璋（？—220年），字季玉，荊州江夏竟陵（今屬湖北省天門市）人，為漢朝宗室，漢景帝之子魯恭王劉餘裔孫竟陵侯的後裔。東漢末年三國時代割據軍閥之一。繼父親劉焉擔任益州牧，振威將軍，後為劉備所敗投降，被迫離開益州，病逝於荊州。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-116"},{"i":"SANK-P-SSR-16","pid":"84433810848551094291","h":"劉禪","s":"刘禅","cat":"人物","sub":"","y":"SSR","fac":"蜀漢","e":"木","a":10000,"d":10100,"ev":0,"art":"img/s1/card_SANK-P-C-16.webp","intro":"後主，亡國之君安享餘年","full":"劉禪（ㄕㄢˋ）（207年—271年），字公嗣，又字升之，幼名阿斗。漢昭烈帝劉備之子，蜀漢最後一位皇帝。陳壽著《三國志》稱其為後主，十六國時期的漢趙政權諡其為孝懷皇帝，史稱漢懷帝或蜀漢後主。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-16"},{"i":"SANK-P-SSR-22","pid":"70349088443455295309","h":"司馬朗","s":"司马朗","cat":"人物","sub":"文官","y":"SSR","fac":"曹魏","e":"火","a":10200,"d":10300,"ev":0,"art":"img/s1/card_SANK-P-SSR-22.webp","intro":"司馬朗，字伯達，河內溫縣人，東漢末年政治家，官至兗州刺史","full":"司馬朗，字伯達，河內溫縣人，東漢末年政治家，官至兗州刺史。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-22"},{"i":"SANK-E-T-SSR-003","pi :"","y":"SSR","fac":"東吳","e":"水","a":10700,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-R-127.webp","intro":"呂布之女，驍勇女戰將","full":"呂布（160年或更早—199年2月7日），字奉先，并州五原郡九原（今內蒙古自治區包頭市九原區）人，東漢末年武將與軍閥，被封為溫侯。先後為丁原、董卓的部將，也曾為袁紹效力，後趁劉備與袁術交戰時而佔據徐州，自成一方勢力。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-127"},{"i":"SANK-E-T-SSR-017","pid":"18772347640089568353","h":"商君書","s":"商君书","cat":"書籍","sub":"政書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-017.webp","intro":"商君書，三國典籍・政書","full":"商君書，三國典籍・政書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-017"},{"i":"SANK-P-SSR-078","pid":"30729998052440314693","h":"嚴顏","s":"严颜","cat":"人物","sub":"武將","y":"SSR","fac":"群雄","e":"土","a":10800,"d":10900,"ev":0.09,"art":"img/s1/card_SANK-P-SSR-078.webp","intro":"嚴顏，東漢末年巴郡臨江縣人，效力於劉焉、劉璋。","full":"嚴顏（？—？），東漢末年巴郡臨江縣人，效力於劉焉、劉璋。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-078"},{"i":"SANK-E-T-SSR-024","pid":"95370133720400621556","h":"塗漆鼎","s":"涂漆鼎","cat":"寶物","sub":"","y":"SSR","fac":"","e":"","a":null,"d":470,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-024.webp","intro":"塗漆鼎，外塗漆飾的青銅鼎。","full":"塗漆鼎，外塗漆飾的青銅鼎。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-024"},{"i":"SANK-E-T-SSR-013","pid":"06444056476960408410","h":"墨子","s":"墨子","cat":"書籍","sub":"兵書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SR-013.webp","intro":"墨子，三國典籍・兵書","full":"墨子，三國典籍・兵書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-013"},{"i":"SANK-E-T-SSR-008","pid":"59613418400396286070","h":"夜明珠","s":"夜明珠","cat":"寶物","sub":"","y":"SSR","fac":"","e":"","a":null,"d":470,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-008.webp","intro":"夜明珠，夜間能發光的寶珠，傳說可照室如晝。","full":"夜明珠，夜間能發光的寶珠，傳說可照室如晝。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-008"},{"i":"SANK-P-SSR-277","pid":"38853589211857973310","h":"大喬","s":"大喬","cat":"人物","sub":"君主宗室","y":"SSR","fac":"東吳","e":"水","a":10100,"d":10200,"ev":0,"art":"img/s1/card_SANK-P-C-277.webp","intro":"大橋，《三國演義》作大喬，廬江橋公之女，小橋之姊，孫策納為妾","full":"大橋，《三國演義》作大喬，廬江橋公之女，小橋之姊，孫策納為妾。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-277"},{"i":"SANK-P-SSR-54","pid":"61759759519342888922","h":"孔融","s":"孔融","cat":"人物","sub":"文官","y":"SSR","fac":"曹魏","e":"金","a":10000,"d":10300,"ev":0,"art":"img/s1/card_SANK-P-R-54.webp","intro":"孔融，字文舉，魯國曲阜人，鉅鹿太守。","full":"孔融（151年—208年9月26日），字文舉，魯國曲阜人，東漢末文學家，建安七子之一，孔子二十代孫，高祖父孔尚，鉅鹿太守。父孔宙，泰山都尉。由於曾任北海相，亦稱孔北海，後因得罪曹操，遭指控犯下叛亂罪而被處死。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-54"},{"i":"SANK-E-T-SSR-031","pid":"72194751664799805816","h":"孟德新書","s":"孟德新书","cat":"書籍","sub":"兵書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-001.webp","intro":"《孟德新書》是《三國演義》中曹操所編著的兵法書，共十四篇。","full":"《孟德新書》，羅貫中在《三國演義》中稱是曹操所編著的兵法書籍，仿照《孫子兵法》13篇而寫作，皆為用兵之要法，共14篇。張松看完此書後，說是戰國時無名氏所作。曹操知道後說：「莫非古人與我暗合否？。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-031"},{"i":"SANK-P-SSR-43","pid":"87333702880514562413","h":"孟獲","s":"孟获","cat":"人物","sub":"其他","y":"SSR","fac":"蜀漢","e":"木","a":10900,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-SSR-43.webp","intro":"孟獲，三國時期益州建寧郡人。","full":"孟獲（？—？），三國時期益州建寧郡（以今曲靖市為中心的雲南東部地區）人。蜀漢南方南中一帶豪強，曾加入雍闓的叛軍，後投降蜀漢，官至御史中丞。《三國志》中並未有其記載，見於《華陽國志》《漢晉春秋》《襄陽記》《資治通鑑》《通典》等。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-43"},{"i":"SANK-P-SSR-70","pid":"84821879116073778342","h":"孟達","s":"孟达","cat":"人物","sub":"武將","y":"SSR","fac":"蜀漢","e":"木","a":10700,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-R-70.webp","intro":"孟達，字子敬，東漢司隸右扶風平陵人。","full":"孟達（？—228年），字子敬，為避劉備叔父諱而改為子度，東漢司隸右扶風平陵人，漢末三國時期人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-70"},{"i":"SANK-P-SSR-51","pid":"73550368010495253846","h":"孫尚香","s":"孙尚香","cat":"人物","sub":"","y":"SSR","fac":"曹魏","e":"火","a":10800,"d":10700,"ev":0,"art":"img/s1/card_SANK-P-R-51.webp","intro":"孫權妹，劉備夫人剛勇","full":"孫夫人（182年後—211年後），吳郡富春（今浙江省杭州市）人，東漢末年討虜將軍孫權之妹，左將軍劉備夫人。其名不詳，民間傳說及京劇常以「尚香」為名。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-51"},{"i":"SANK-P-SSR-279","pid":"70606081735510943715","h":"孫桓","s":"孙桓","cat":"人物","sub":"武將","y":"SSR","fac":"東吳","e":"水","a":10700,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-SSR-70.webp","intro":"孫桓，字叔武，吳郡富春人，是東漢末期及三國時期東吳宗室將領。","full":"孫桓（198年—3世紀），字叔武，吳郡富春人，孫河的三子，是東漢末期及三國時期東吳宗室將領。孫桓深得東吳將領兵士信任，深得兵心。在夷陵之戰跟隨大都督陸遜抵禦劉備伐吳大軍，差點生擒劉備。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-279"},{"i":"SANK-E-T-SSR-032","pid":"16332265500416879554","h":"孫臏兵法","s":"孙膑兵法","cat":"書籍","sub":"兵書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-013.webp","intro":"孫臏兵法，三國典籍・兵書","full":"孫臏兵法，三國典籍・兵書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-032"},{"i":"SANK-E-W-SSR-017","pid":"35622459662371086852","h":"寶雕弓","s":"宝雕弓","cat":"武器","sub":"","y":"SSR","fac":"","e":"","a":730,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-SSR-017.webp","intro":"寶雕弓，弓身飾雕紋的良弓，弓力強勁。","full":"寶雕弓，弓身飾雕紋的良弓，弓力強勁。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-SSR-017"},{"i":"SANK-E-T-SSR-014","pid":"30816852621992359855","h":"尉繚子","s":"尉缭子","cat":"書籍","sub":"兵書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-014.webp","intro":"《尉繚子》是中國古代的一部重要的兵書。","full":"《尉繚子》是中國古代的一部重要的兵書。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-014"},{"i":"SANK-P-SSR-134","pid":"77657311479415533429","h":"小喬","s":"小乔","cat":"人物","sub":"","y":"SSR","fac":"蜀漢","e":"木","a":10100,"d":10200,"ev":0,"art":"img/s1/card_SANK-P-UC-134.webp","intro":"小喬，廬江橋公次女，大喬之妹，周瑜之妻。","full":"小橋，《三國演義》作小喬，廬江橋公次女，大喬之妹，周瑜之妻。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-134"},{"i":"SANK-E-T-SSR-033","pid":"56043424771785555123","h":"山海經","s":"山海经","cat":"書籍","sub":"奇書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SR-008.webp","intro":"山海經，三國典籍・奇書","full":"山海經，三國典籍・奇書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-033" n.org/mylegends-wiki.html#SANK-P-SSR-60"},{"i":"SANK-P-SSR-18","pid":"22013810566689641226","h":"李典","s":"李典","cat":"人物","sub":"武將","y":"SSR","fac":"曹魏","e":"火","a":10800,"d":10900,"ev":0,"art":"img/s1/card_SANK-P-SSR-18.webp","intro":"李典，字曼成，東漢兗州山陽郡鉅野縣人，是曹操時期少有的儒將。","full":"李典，字曼成，東漢兗州山陽郡鉅野縣人，原山陽郡地方豪強，後投曹操，李典深明大義，不與人爭功，溫文儒雅，尊重博學之士，有長者之風，是曹操時期少有的儒將。官至破虜將軍，合肥之戰時，與張遼、樂進一同擊敗北上進犯孫權，戰後年僅三十六歲即病逝。魏文帝曹丕繼位後追諡號為愍侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-18"},{"i":"SANK-P-SSR-035","pid":"77505642648132493950","h":"李嚴","s":"李严","cat":"人物","sub":"","y":"SSR","fac":"蜀漢","e":"木","a":10800,"d":10900,"ev":0.09,"art":"img/s1/card_SANK-P-SSR-035.webp","intro":"李嚴，字正方，南陽人，蜀漢重臣","full":"李嚴，字正方，南陽人，蜀漢重臣。與諸葛亮同受劉備遺詔輔佐後主，後因北伐糧運失職、諉過推責，被貶為庶民。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-035"},{"i":"SANK-P-SSR-25","pid":"05878068473650746085","h":"桓階","s":"桓阶","cat":"人物","sub":"文官","y":"SSR","fac":"曹魏","e":"火","a":10200,"d":10100,"ev":0,"art":"img/s1/card_SANK-P-SSR-25.webp","intro":"桓階，字伯緒，一作伯序，長沙臨湘人","full":"桓階，字伯緒，一作伯序，長沙臨湘人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-25"},{"i":"SANK-E-W-SSR-018","pid":"09947782825010073091","h":"梅花袖箭","s":"梅花袖箭","cat":"武器","sub":"","y":"SSR","fac":"","e":"","a":730,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-SSR-018.webp","intro":"梅花袖箭，藏於袖中的暗器，一次可發數箭。","full":"梅花袖箭，藏於袖中的暗器，一次可發數箭。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-SSR-018"},{"i":"SANK-E-W-SSR-014","pid":"54111983957410059080","h":"棗木槊","s":"枣木槊","cat":"武器","sub":"","y":"SSR","fac":"","e":"","a":730,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-SSR-014.webp","intro":"棗木槊，以棗木為桿的長槊，堅韌耐用。","full":"棗木槊，以棗木為桿的長槊，堅韌耐用。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-SSR-014"},{"i":"SANK-E-T-SSR-020","pid":"11024188415638594267","h":"淮南子","s":"淮南子","cat":"書籍","sub":"史書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-020.webp","intro":"淮南子，三國典籍・史書","full":"淮南子，三國典籍・史書","wiki":"https://se 文官","y":"SSR","fac":"晉","e":"土","a":10400,"d":10700,"ev":0.085,"art":"img/s1/card_SANK-P-SSR-073.webp","intro":"衛瓘，字伯玉，司隸河東安邑人，三國時期魏國、西晉的大臣。","full":"衛瓘（ㄍㄨㄢˋ）（220年—291年），字伯玉，司隸河東安邑人，三國時期魏國、西晉的大臣，魏國侍中衛覬之子，出身書法世家。及長仕於魏國，擔任廷尉、鎮西將軍；以持節監軍入列伐蜀大軍。滅亡蜀漢後，因謹慎瓦解鍾會的叛亂而受重用。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-073"},{"i":"SANK-P-SSR-075","pid":"38208631572383683265","h":"裴秀","s":"裴秀","cat":"人物","sub":"文官","y":"SSR","fac":"晉","e":"土","a":10100,"d":10200,"ev":0.08,"art":"img/s1/card_SANK-P-SSR-075.webp","intro":"裴秀，字季彥，河東聞喜縣人","full":"裴秀（224年—271年4月3日），字季彥，河東聞喜縣人。曹魏西晉政治家，地圖學家。青年起從政，一直頗受司馬昭、司馬炎父子信任，曾主持魏末晉初官職和爵位的制定工作，官至司空。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-075"},{"i":"SANK-P-SSR-62","pid":"94029046311549346684","h":"賀齊","s":"贺齐","cat":"人物","sub":"武將","y":"SSR","fac":"東吳","e":"水","a":10700,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-SSR-62.webp","intro":"賀齊，字公苗，漢末會稽郡山陰人，三國東吳將領。","full":"賀齊（2世紀？—227年），字公苗，漢末會稽郡山陰人，三國東吳將領，會稽士族賀氏的家主，在江東內部平定山越所戰披靡，期間也有參與前線作戰。 本為「慶」姓，賀齊的伯父慶純，在儒學界有很大的聲望。漢安帝在位時擔任侍中、江夏太守。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-62"},{"i":"SANK-E-A-SSR-001","pid":"25107533646929835079","h":"連環鎧","s":"连环铠","cat":"鎧甲","sub":"","y":"SSR","fac":"","e":"","a":null,"d":725,"ev":null,"art":"img/s1/card_SANK-E-A-SSR-001.webp","intro":"連環鎧，甲片環環相扣。","full":"連環鎧，甲片環環相扣。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-SSR-001"},{"i":"SANK-E-T-SSR-030","pid":"59124042038747531996","h":"遁甲天書","s":"遁甲天书","cat":"書籍","sub":"奇書","y":"SSR","fac":"","e":"","a":null,"d":446,"ev":null,"art":"img/s1/card_SANK-E-T-SSR-030.webp","intro":"遁甲天書，三國典籍・奇書","full":"遁甲天書，三國典籍・奇書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SSR-030"},{"i":"SANK-P-SSR-009","pid":"89834828013626997378","h":"郝昭","s":"郝昭","cat":"人物","sub":"武將","y":"SSR","fac":"曹魏","e":"火","a":10800,"d":10900,"ev":0.085,"art":"img/s1/card_SANK-P-SSR-009.webp","intro":"郝昭，字伯道，太原郡人，三國時代曹魏將領。","full":"郝昭（2世紀—3世紀），字伯道，太原郡人，三國時代曹魏將領，曾在諸葛亮北伐戰爭中防守陳倉，成功抵禦諸葛亮的進攻。"," 941917","h":"黃忠弓","s":"黄忠弓","cat":"武器","sub":"","y":"SSR","fac":"","e":"","a":730,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-SSR-010.webp","intro":"弓是世界上最早的彈射類遠射武器之一，用於狩獵與戰爭。","full":"弓是世界上最早出現的彈射類遠射武器之一，其發明早於人類信史，並在不同地區的文明被廣泛使用。弓在古代大量用於狩獵與戰爭，在現代功能則主要限於運動競技。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-SSR-010"},{"i":"SANK-E-A-SSR-010","pid":"45275298114372327755","h":"黃金鎧","s":"黄金铠","cat":"鎧甲","sub":"","y":"SSR","fac":"","e":"","a":null,"d":725,"ev":null,"art":"img/s1/card_SANK-E-A-SSR-010.webp","intro":"黃金鎧，鎏金鎧甲，貴氣逼人。","full":"黃金鎧，鎏金鎧甲，貴氣逼人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-SSR-010"},{"i":"SANK-P-SSR-289","pid":"48802385524852953193","h":"龐德","s":"庞德","cat":"人物","sub":"武將","y":"SSR","fac":"曹魏","e":"火","a":10900,"d":10800,"ev":0,"art":"img/s1/card_SANK-P-R-41.webp","intro":"龐德，亦作龐悳，字令明，涼州南安狟道人","full":"龐德，亦作龐悳，字令明，涼州南安狟道人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SSR-289"},{"i":"SANK-P-SR-332","pid":"97824884299115316446","h":"戲志才","s":"戏志才","cat":"人物","sub":"謀臣","y":"SR","fac":"曹魏","e":"火","a":8100,"d":8600,"ev":0,"art":"img/s1/card_SANK-P-C-332.webp","intro":"戲志才，潁川人，成為曹操早期的主要謀士。","full":"戲志才（？—190年代），潁川（治今河南省禹州市）人。由荀彧推薦出山輔助曹操，成為曹操早期的主要謀士。為人不流世俗（負俗）但多謀略，曹操十分器重他，但死得很早。戲志才死後，曹操詢問荀彧誰可代替他，於是荀彧推薦了郭嘉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-332"},{"i":"SANK-P-SR-68","pid":"54659464361112381858","h":"董昭","s":"董昭","cat":"人物","sub":"文官","y":"SR","fac":"蜀漢","e":"木","a":8500,"d":8600,"ev":0,"art":"img/s1/card_SANK-P-R-68.webp","intro":"董昭，字公仁，濟陰定陶人，東漢末年人物","full":"董昭，字公仁，濟陰定陶人，東漢末年人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-68"},{"i":"SANK-P-SR-492","pid":"09595065267065647542","h":"陳珪","s":"陈珪","cat":"人物","sub":"文官","y":"SR","fac":"群雄","e":"土","a":8100,"d":8300,"ev":0,"art":"img/s1/card_SANK-P-C-492.webp","intro":"陳珪，字漢瑜，徐州下邳郡淮浦縣人。","full":"陳珪可以指： 陳珪 (東漢)，東漢末期的人物，沛相，陳登之父 陳珪 (靖國公)，明朝初期將領 陳珪 (正統進士)，明朝正統元年進士，浙江金華人 陳珪 (嘉靖進士)，明朝嘉靖八年進士，廣東化州人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-492"},{"i":"SANK-P-SR-63","pid":"19053763077518719169","h":"馬謖","s":"马谡","cat":"人物","sub":"謀臣","y":"SR","fac":"蜀漢","e":"木","a":9300,"d":9200,"ev":0,"art":"img/s1/card_SANK-P-SR-63.webp","intro":"馬謖，字幼常，襄陽宜城人，蜀漢參軍，好議軍計","full":"馬謖，字幼常，襄陽宜城人，蜀漢參軍，好議軍計；街亭之戰違令兵敗，被諸葛亮依軍法處斬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-63"},{"i":"SANK-P-SR-130","pid":"72781113826519161020","h":"張松","s":"张松","cat":"人物","sub":"謀臣","y":"SR","fac":"蜀漢","e":"木","a":8100,"d":8300,"ev":0,"art":"img/s1/card_SANK-P-UC-130.webp","intro":"張松，益州別駕，曾獻西川地圖予劉備。","full":"張松可以指： 張松 (東漢)，東漢政治人物 張松 (嘉靖進士)，明朝政治人物 張松 (足球運動員)，中華人民共和國足球運動員 張松 (畫家)，中華人民共和國畫家。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-130"},{"i":"SANK-P-SR-39","pid":"02730739102017586061","h":"蒯越","s":"蒯越","cat":"人物","sub":"謀臣","y":"SR","fac":"曹魏","e":"火","a":8500,"d":8900,"ev":0,"art":"img/s1/card_SANK-P-R-39.webp","intro":"蒯越，字異度，荊州南郡中廬人，韓信謀士蒯徹後人。","full":"蒯越（？—214年），字異度，荊州南郡中廬人，韓信謀士蒯徹後人，東漢末年政治人物。為人足智多謀，魁傑並有雄姿。是荊州牧劉表的重要謀士，被劉表譽為「臼犯之謀」。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-39"},{"i":"SANK-P-SR-493","pid":"54069987825427429592","h":"陳登","s":"陳登","cat":"人物","sub":"武將","y":"SR","fac":"","e":"","a":9200,"d":9500,"ev":null,"art":"","intro":"陳登，字元龍，下邳郡淮浦縣人，為名臣陳球的侄孫，官至伏波將軍","full":"陳登（163年—201年），字元龍，下邳郡淮浦縣（今江蘇省漣水縣）人，為名臣陳球的侄孫，官至伏波將軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-493"},{"i":"SANK-P-SR-494","pid":"45302147826488296427","h":"虞翻","s":"虞翻","cat":"人物","sub":"文官","y":"SR","fac":"東吳","e":"水","a":8900,"d":8800,"ev":0,"art":"img/s1/card_SANK-P-SSR-68.webp","intro":"虞翻，字仲翔，會稽餘姚人，是三國時期東吳的經學家和政治家","full":"虞翻，字仲翔，會稽餘姚人，是三國時期東吳的經學家和政治家。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-494"},{"i":"SANK-P-SR-67","pid":"94415106636236229929","h":"闞澤","s":"阚泽","cat":"人物","sub":"文官","y":"SR","fac":"東吳","e":"水","a":8900,"d":8800,"ev":0,"art":"img/s1/card_SANK-P-SSR-67.webp","intro":"闞澤，字德潤，會稽山陰人，東吳儒臣","full":"闞澤，字德潤，會稽山陰人，東吳儒臣。精通經學與曆數，為孫權講授書史，官至太子太傅，著有歷法注述。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-67"},{"i":"SANK-P-SR-60","pid":"41612010480429232129","h":"黃權","s":"黄权","cat":"人物","sub":"武將","y":"SR","fac":"蜀漢","e":"木","a":9100,"d":9400,"ev":0,"art":"img/s1/card_SANK-P-SR-60.webp","intro":"黃權，字公衡，巴西郡閬中縣人，漢末三國時蜀漢將領。","full":"黃權，字公衡，巴西郡閬中縣人，漢末三國時蜀漢將領，因夷陵之戰劉備戰敗沒有退路後無奈投降曹魏，歷仕劉璋、蜀漢及曹魏三股勢力。本是劉璋的部下，劉備入蜀後被招納並獲重用，後來劉備稱帝之後東征孫權爆發猇亭之戰時，黃權勸劉備不要東征伐吳，但劉備一意孤行，劉備戰敗後撤退的道路被吳軍切斷，不得已之下與龐林率眾一起投魏。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-60"},{"i":"SANK-P-SR-66","pid":"16171446099123947042","h":"步騭","s":"步骘","cat":"人物","sub":"武將","y":"SR","fac":"東吳","e":"水","a":9000,"d":9400,"ev":0,"art":"img/s1/card_SANK-P-SSR-66.webp","intro":"步騭，字子山，臨淮淮陰人，後又繼陸遜為丞相。","full":"步騭，字子山，臨淮淮陰人，三國時期東吳將領及重臣，與孫權寵妃步練師同族，繼陸遜督西陵，後又繼陸遜為丞相。步騭爲人寬雅深沉，喜怒不形於色，拜相之後仍然教導門生，手不釋卷，衣飾和居處仍同儒生一樣樸素，在當時和諸葛瑾、嚴畯、張承齊名，爲人所稱。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-66"},{"i":"SANK-P-SR-108","pid":"56677383240671221688","h":"曹沖","s":"曹冲","cat":"人物","sub":"君主宗室","y":"SR","fac":"蜀漢","e":"木","a":8300,"d":8400,"ev":0,"art":"img/s1/card_SANK-P-R-108.webp","intro":"神童，稱象典故主角","full":"曹沖（196年—208年），字倉舒，沛國譙縣（今安徽亳州）人，東漢末年人物，曹操之庶子，由環夫人所生，有神童之名聲，但因病早卒。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-108"},{"i":"SANK-P-SR-7","pid":"45846029018851678277","h":"曹叡","s":"曹叡","cat":"人物","sub":"君主宗室","y":"SR","fac":"曹魏","e":"火","a":9000,"d":9400,"ev":0,"art":"img/s1/card_SANK-P-R-7.webp","intro":"魏明帝曹叡，字元仲，豫州沛國譙縣人","full":"魏明帝曹叡，字元仲，豫州沛國譙縣人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-7"},{"i":"SANK-P-SR-116","pid":"33978062844627491325","h":"蔡邕","s":"蔡邕","cat":"人物","sub":"文官","y":"SR","fac":"東吳","e":"金","a":8200,"d":8400,"ev":0,"art":"img/s1/card_SANK-P-R-116.webp","intro":"蔡邕，字伯喈，陳留圉人","full":"蔡邕（ㄩㄥ）（132年或133年—192年），字伯喈（ㄐㄧㄝ），陳留圉人（今河南尉氏縣）。東漢左中郎將、高陽侯，書法家，其父蔡陵，曾任徐州刺史，品行純正，去世後的諡號為真定。才女蔡琰之父。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-116"},{"i":"SANK-P-SR-97","pid":"24564700420344557735","h":"周魴","s":"周鲂","cat":"人物","sub":"文官","y":"SR","fac":"東吳","e":"水","a":8800,"d":9100,"ev":0,"art":"img/s1/card_SANK-P-SR-97.webp","intro":"周魴，字子魚，陽羨人，三國時東吳鄱陽太守。","full":"周魴（?—?年），字子魚，陽羨（今中國江蘇宜興）人，三國時東吳鄱陽太守，「除三害」的周處為周魴之子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-97"},{"i":"SANK-P-SR-95","pid":"43810912427327282850","h":"張悌","s":"张悌","cat":"人物","sub":"武將","y":"SR","fac":"東吳","e":"水","a":8800,"d":9300,"ev":0,"art":"img/s1/card_SANK-P-SR-95.webp","intro":"張悌，字巨先，襄陽人，東吳丞相","full":"張悌，字巨先，襄陽人，東吳丞相。晉軍伐吳時力戰守衛，於牛渚兵敗殉國。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-95"},{"i":"SANK-P-SR-61","pid":"59042479281111927276","h":"楊儀","s":"杨仪","cat":"人物","sub":"文官","y":"SR","fac":"蜀漢","e":"木","a":8800,"d":9300,"ev":0,"art":"img/s1/card_SANK-P-SR-61.webp","intro":"楊儀，字威公，襄陽人。","full":"楊儀，字威公，襄陽人。三國時蜀漢文臣，北伐時期諸葛亮部屬。諸葛亮歿後，成功除掉政敵魏延，後因升遷受阻而心懷怨懟、口出反逆之言，被劉禪下獄，終在獄中自盡。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-61"},{"i":"SANK-P-SR-17","pid":"63591218199663240104","h":"溫恢","s":"温恢","cat":"人物","sub":"文官","y":"SR","fac":"曹魏","e":"火","a":8700,"d":9200,"ev":0,"art":"img/s1/card_SANK-P-SR-17.webp","intro":"溫恢，字曼基，太原祁人，三國時曹魏大臣，為溫羨之祖父。","full":"溫恢，字曼基，太原祁人，曹魏地方重臣，歷任揚州刺史等職，綱紀嚴明，深得曹操倚重。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-17"},{"i":"SANK-P-SR-121","pid":"44576663973215121507","h":"丁原","s":"丁原","cat":"人物","sub":"武將","y":"SR","fac":"蜀漢","e":"木","a":9400,"d":9300,"ev":0,"art":"img/s1/card_SANK-P-C-121.webp","intro":"丁原，字建陽，被董卓設計由其部將呂布刺殺。","full":"丁原（140年？—189年），字建陽，東漢末年的地方豪傑之一，被董卓設計由其部將呂布刺殺。拜武猛都尉，并州刺史，官至執金吾。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-121"},{"i":"SANK-E-W-SR-025","pid":"81572830957709545169","h":"三尖刀","s":"三尖刀","cat":"武器","sub":"","y":"SR","fac":"","e":"","a":439,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-SR-025.webp","intro":"三尖刀，刀尖分三叉，刺擊範圍廣。","full":"三尖刀，刀尖分三叉，刺擊範圍廣。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-SR-025"},{"i":"SANK-E-T-SR-011","pid":"11852475687186542778","h":"丹書鐵券","s":"丹书铁券","cat":"寶物","sub":"","y":"SR","fac":"","e":"","a":null,"d":275,"ev":null,"art":"img/s1/card_SANK-E-T-SR-011.webp","intro":"丹書鐵券，民間俗稱「免死金牌」，始於漢代，賜予功臣的憑證。","full":"丹書鐵券，亦作丹書鐵契、金書鐵券、鐵券、誓書，民間俗稱「免死牌」，始於漢代，是天子頒發給功臣、重臣的一種帶有獎賞和盟約性質的憑證，類似於現代普遍流行的勳章獎章，只不過其形制稍有不同，內涵較為寬泛。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SR-011"},{"i":"SANK-E-T-SR-035","pid":"83845395079071474534","h":"乾象曆注","s":"乾象历注","cat":"書籍","sub":"論文","y":"SR","fac":"","e":"","a":null,"d":273,"ev":null,"art":"img/s1/card_SANK-E-T-SR-035.webp","intro":"乾象曆注，三國典籍・論文","full":"乾象曆注，三國典籍・論文","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SR-035"},{"i":"SANK-E-T-SR-037","pid":"23953816236736704390","h":"仇國論","s":"仇国论","cat":"書籍","sub":"論文","y":"SR","fac":"","e":"","a":null,"d":273,"ev":null,"art":"img/s1/card_SANK-E-T-SR-037.webp","intro":"仇國論，三國典籍・論文","full":"仇國論，三國典籍・論文","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SR-037"},{"i":"SANK-P-SR-20","pid":"49950807351024066107","h":"令狐愚","s":"令狐愚","cat":"人物","sub":"君主宗室","y":"SR","fac":"曹魏","e":"火","a":8700,"d":8500,"ev":0,"art":"img/s1/card_SANK-P-SR-20.webp","intro":"令狐愚，本名浚，字公治，三國時代幷州太原郡人","full":"令狐愚，本名浚，字公治，三國時代幷州太原郡人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-20"},{"i":"SANK-P-SR-495","pid":"56115308509692179928","h":"伊籍","s":"伊籍","cat":"人物","sub":"文官","y":"SR","fac":"蜀漢","e":"木","a":8400,"d":8600,"ev":0,"art":"img/s1/card_SANK-P-SR-66.webp","intro":"伊籍，字機伯，兗州山陽高平縣人，三國時期蜀漢官員","full":"伊籍，字機伯，兗州山陽高平縣人，三國時期蜀漢官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-495"},{"i":"SANK-P-SR-50","pid":"20715135755581763430","h":"傅僉","s":"傅佥","cat":"人物","sub":"","y":"SR","fac":"蜀漢","e":"木","a":9600,"d":9400,"ev":0,"art":"img/s1/card_SANK-P-SR-50.webp","intro":"蜀漢將領傅彤之子，隨諸葛瞻守衛陽平關，魏兵至，力戰不屈而死。","full":"蜀漢將領傅彤之子，隨諸葛瞻守衛陽平關，魏兵至，力戰不屈而死。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-50"},{"i":"SANK-P-SR-49","pid":"83082727727399329938","h":"傅彤","s":"傅彤","cat":"人物","sub":"","y":"SR","fac":"蜀漢","e":"木","a":9400,"d":9200,"ev":0,"art":"img/s1/card_ c":"東吳","e":"水","a":9300,"d":9500,"ev":0,"art":"img/s1/card_SANK-P-SSR-64.webp","intro":"呂岱，字定公，廣陵海陵人，東吳重臣","full":"呂岱，字定公，廣陵海陵人，東吳重臣。鎮守交州多年，平定嶺南亂事，後入朝掌軍，恪盡職守，官至大司馬，年逾九十。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-64"},{"i":"SANK-E-W-SR-009","pid":"04070739935289902982","h":"呂布弓","s":"吕布弓","cat":"武器","sub":"","y":"SR","fac":"","e":"","a":439,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-SSR-009.webp","intro":"弓是世界上最早的彈射類遠射武器之一，用於狩獵與戰爭。","full":"弓是世界上最早出現的彈射類遠射武器之一，其發明早於人類信史，並在不同地區的文明被廣泛使用。弓在古代大量用於狩獵與戰爭，在現代功能則主要限於運動競技。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-SR-009"},{"i":"SANK-P-SR-88","pid":"91649937906970766824","h":"呂範","s":"吕范","cat":"人物","sub":"武將","y":"SR","fac":"東吳","e":"水","a":9100,"d":9400,"ev":0,"art":"img/s1/card_SANK-P-SR-88.webp","intro":"呂範，字子衡，汝南細陽人，是三國時期東吳的重要將領和政治家。","full":"呂範（2世紀—228年），字子衡，汝南細陽人，是三國時期東吳的重要將領和政治家，官至大司馬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-88"},{"i":"SANK-P-SR-004","pid":"54181472831956497893","h":"呂虔","s":"吕虔","cat":"人物","sub":"武將","y":"SR","fac":"曹魏","e":"火","a":9300,"d":9100,"ev":0.06,"art":"img/s1/card_SANK-P-SR-004.webp","intro":"呂虔，字子恪，兗州任城人氏","full":"呂虔（生卒年不詳），字子恪，兗州任城人氏。三國時期曹魏將領，歷任泰山太守、騎都尉、裨將軍，最後官至威虜將軍，封為萬年亭侯。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-004"},{"i":"SANK-P-SR-164","pid":"84183172777585375931","h":"周倉","s":"周仓","cat":"人物","sub":"武將","y":"SR","fac":"東吳","e":"水","a":9600,"d":9300,"ev":0,"art":"img/s1/card_SANK-P-UC-164.webp","intro":"周倉，字元福，是關羽的部將。","full":"周倉，字元福，是《三國演義》中的人物，是關羽（關公）的部將，得知關羽父子遇害之後，自盡殉難。史實不詳，相傳關西人，本為張寶部將，黃巾之變後避居臥牛山，感於關羽忠義，因而投奔。關羽父子過世，他也自刃殉難。在《山西通志》中也有記載。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-164"},{"i":"SANK-P-SR-107","pid":"50508424110880396954","h":"周旨","s":"周旨","cat":"人物","sub":"武將","y":"SR","fac":"晉","e":"土","a":9600,"d":9200,"ev":0.07,"art":"img/s1/card_SANK-P-SR-107.webp","intro":"周旨，晉初伐吳時為牙門將","full":"周旨，晉初伐吳時為牙門將。在攻吳戰役中，鎮南將軍杜預命之和牙門將管定、伍巢伏兵於樂鄉城外，之後周旨待東吳都督孫歆敗軍而還時生擒孫歆。 西晉鎮南將軍杜預伐吳至樂鄉，命牙門將管定、伍巢、周旨等伏兵於樂鄉城外。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-107"},{"i":"SANK-E-T-SR-017","pid":"76596332248727709761","h":"周書陰符","s":"周书阴符","cat":"書籍","sub":"政書","y":"SR","fac":"","e":"","a":null,"d":273,"ev":null,"art":"img/s1/card_SANK-E-T-SR-017.webp","intro":"周書陰符，三國典籍・政書","full":"周書陰符，三國典籍・政書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SR-017"},{"i":"SANK-P-SR-106","pid":"30776628875092361720","h":"唐彬","s":"唐彬","cat":"人物","sub":"武將","y":"SR","fac":"晉","e":"土","a":9400,"d":9300,"ev":0.065,"art":"img/s1/card_SANK-P-SR-106.webp","intro":"唐彬，字儒宗，曹魏魯國鄒縣人，曹魏、西晉官員、武將","full":"唐彬，字儒宗，曹魏魯國鄒縣人，曹魏、西晉官員、武將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-106"},{"i":"SANK-P-SR-93","pid":"14009317138122807780","h":"嚴畯","s":"严畯","cat":"人物","sub":"","y":"SR","fac":"東吳","e":"水","a":8000,"d":8200,"ev":0,"art":"img/s1/card_SANK-P-SR-93.webp","intro":"嚴畯，字曼才，彭城人，是三國時期東吳的重要文臣之一。","full":"嚴畯，字曼才，彭城人，東吳儒臣，篤學樸實，曾任出使交州，官至騎都尉。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-93"},{"i":"SANK-E-T-SR-018","pid":"41236833450145452779","h":"四民月令","s":"四民月令","cat":"書籍","sub":"政書","y":"SR","fac":"","e":"","a":null,"d":273,"ev":null,"art":"img/s1/card_SANK-E-T-SR-018.webp","intro":"四民月令，三國典籍・政書","full":"四民月令，三國典籍・政書","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SR-018"},{"i":"SANK-P-SR-105Z","pid":"12250535070400346671","h":"夏侯博","s":"夏侯博","cat":"人物","sub":"武將","y":"SR","fac":"東吳","e":"水","a":8600,"d":9600,"ev":7,"art":"img/s1/card_SANK-P-SR-105Z.webp","intro":"夏侯博，東漢末年劉備之部將","full":"夏侯博（2世紀—？），東漢末年劉備之部將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-105Z"},{"i":"SANK-P-SR-002","pid":"38867676379971178570","h":"夏侯淵","s":"夏侯渊","cat":"人物","sub":"","y":"SR","fac":"曹魏","e":"火","a":9700,"d":9800,"ev":0.13,"art":"img/s1/card_SANK-P-UR-002.webp","intro":"夏侯淵，字妙才，沛國譙縣人，曹魏名將","full":"夏侯淵，字妙才，沛國譙縣人，曹魏名將。擅長輕兵千里奔襲，屢征西涼、守漢中，定軍山之戰為黃忠所擊殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-002"},{"i":"SANK-P-SR-100","pid":"5582442100408318 配，生下汗血寶馬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-M-SR-002"},{"i":"SANK-E-T-SR-033","pid":"00810553183477095886","h":"治論","s":"治论","cat":"書籍","sub":"論文","y":"SR","fac":"","e":"","a":null,"d":273,"ev":null,"art":"img/s1/card_SANK-E-T-SR-033.webp","intro":"治論，三國典籍・論文","full":"治論，三國典籍・論文","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SR-033"},{"i":"SANK-E-W-SR-019","pid":"42431732902852114318","h":"流星鎚","s":"流星锤","cat":"武器","sub":"","y":"SR","fac":"","e":"","a":439,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-SR-019.webp","intro":"流星鎚，鎚頭繫於長繩，靠離心力傷敵。","full":"流星鎚，鎚頭繫於長繩，靠離心力傷敵。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-SR-019"},{"i":"SANK-E-M-SR-007","pid":"59088693547030978636","h":"涼州馬","s":"凉州马","cat":"坐騎","sub":"","y":"SR","fac":"","e":"","a":null,"d":250,"ev":null,"art":"img/s1/card_SANK-E-M-SSR-007.webp","intro":"涼州馬，涼州所產，耐寒善走。","full":"涼州馬，涼州所產，耐寒善走。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-M-SR-007"},{"i":"SANK-P-SR-96","pid":"27631422950019587335","h":"滕胤","s":"滕胤","cat":"人物","sub":"文官","y":"SR","fac":"東吳","e":"水","a":8800,"d":8600,"ev":0,"art":"img/s1/card_SANK-P-SR-96.webp","intro":"滕胤，字承嗣，北海郡劇縣人","full":"滕胤（3世紀—256年11月8日），字承嗣，北海郡劇縣人。三國時東吳重臣。吳末帝孫皓之妻滕皇后的族父。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-SR-96"},{"i":"SANK-E-T-SR-025","pid":"01086652720984041994","h":"漢書","s":"汉书","cat":"書籍","sub":"史書","y":"SR","fac":"","e":"","a":null,"d":273,"ev":null,"art":"img/s1/card_SANK-E-T-SR-025.webp","intro":"《漢書》，又名《前漢書》，中國古代歷史著作。","full":"《漢書》，又名《前漢書》，中國古代歷史著作。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-T-SR-025"},{"i":"SANK-E-M-SR-003","pid":"69196316019020553417","h":"烏騅馬","s":"乌骓马","cat":"坐騎","sub":"","y":"SR","fac":"","e":"","a":null,"d":250,"ev":null,"art":"img/s1/card_SANK-E-M-SR-003.webp","intro":"烏騅馬，通體烏黑的駿馬。","full":"烏騅馬，通體烏黑的駿馬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-M-SR-003"},{"i":"SANK-P-SR-36","pid":"36616041447176029344","h":"焦觸","s":"焦触","cat":"人物","sub 堂兄。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-494"},{"i":"SANK-P-R-18","pid":"89192992032552677815","h":"陸凱","s":"陆凯","cat":"人物","sub":"武將","y":"R","fac":"東吳","e":"水","a":7200,"d":7300,"ev":0,"art":"img/s1/card_SANK-P-R-18.webp","intro":"陸凱，東吳左丞相，以剛直敢諫著稱。","full":"陸凱可以指： 陸凱 (三國)，三國末期東吳的丞相，陸遜的族子 陸凱 (北魏)，南北朝時期北魏的官員，以忠厚見稱。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-18"},{"i":"SANK-P-R-22","pid":"99798290700543673654","h":"夏侯玄","s":"夏侯玄","cat":"人物","sub":"文官","y":"R","fac":"曹魏","e":"火","a":6700,"d":7000,"ev":0,"art":"img/s1/card_SANK-P-R-22.webp","intro":"夏侯玄，字泰初，一作太初，沛國譙郡人","full":"夏侯玄，字泰初，一作太初，沛國譙郡人。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-22"},{"i":"SANK-P-R-89","pid":"45766898177016902197","h":"許攸","s":"许攸","cat":"人物","sub":"謀臣","y":"R","fac":"蜀漢","e":"木","a":6400,"d":6700,"ev":0,"art":"img/s1/card_SANK-P-UC-89.webp","intro":"許攸，字子遠，東漢南陽郡人，東漢末年初為袁紹早期的謀士。","full":"許攸，字子遠，東漢南陽郡人，東漢末年初為袁紹早期的謀士，也是曹操在官渡之戰中發生轉折的人物。許攸年輕時與袁紹、曹操相友善，後來成為袁紹的謀士，多次為袁紹出謀劃策均不被聽從，深感不滿。官渡之戰之際，許攸貪財，紹不能足而投奔曹操；官渡勝利後，自恃功高而觸怒曹操，後被告發而被殺。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-89"},{"i":"SANK-P-R-55","pid":"41995907043537442165","h":"辛毗","s":"辛毗","cat":"人物","sub":"文官","y":"R","fac":"曹魏","e":"火","a":7800,"d":6800,"ev":0,"art":"img/s1/card_SANK-P-R-55.webp","intro":"辛毗，字佐治，潁川陽翟人","full":"辛毗（2世紀—235年？），字佐治，潁川陽翟（今河南禹州市）人。東漢末及三國時期人物，原屬袁紹部下，後來歸順曹操，為曹魏重臣。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-55"},{"i":"SANK-P-R-77","pid":"35088017240862420012","h":"郭圖","s":"郭图","cat":"人物","sub":"謀臣","y":"R","fac":"曹魏","e":"火","a":7000,"d":7100,"ev":0,"art":"img/s1/card_SANK-P-UC-77.webp","intro":"郭圖，字公則，潁川人，東漢末期人物","full":"郭圖，字公則，潁川人，東漢末期人物。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-77"},{"i":"SANK-P-R-88","pid":"78966259690133867751","h":"閻圃","s":"阎圃","cat":"人物","sub":"謀臣","y":"R","fac":"蜀漢","e":"木","a":6500,"d":6600,"ev":0,"art":"img/s1/card_SANK-P-R-88.webp","intro":"閻圃，益州巴西安漢人，東漢末年漢中軍閥張魯手下，任功曹。","full":"閻圃（？—？），益州巴西安漢（今四川南充）人，東漢末年漢中軍閥張魯手下，任功曹。張魯欲稱漢中王，閻圃諫張魯說：「漢川之民，戶出十萬，財富土沃，四面險固；上匡天子，則為桓、文，次及竇融，不失富貴。今承制署置，勢足斬斷，不煩於王。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-88"},{"i":"SANK-P-R-35","pid":"33875780703993717368","h":"鮑信","s":"鲍信","cat":"人物","sub":"武將","y":"R","fac":"群雄","e":"金","a":7300,"d":7500,"ev":0,"art":"img/s1/card_SANK-P-R-35.webp","intro":"鮑信，東漢泰山郡平陽縣人，漢司隷校尉鮑宣八世孫","full":"鮑信，東漢泰山郡平陽縣人，漢司隷校尉鮑宣八世孫。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-35"},{"i":"SANK-E-M-R-008","pid":"37024291443475984596","h":"三河馬","s":"三河马","cat":"坐騎","sub":"","y":"R","fac":"","e":"","a":null,"d":133,"ev":null,"art":"img/s1/card_SANK-E-M-R-008.webp","intro":"三河馬，三河所產的馬。","full":"三河馬，三河所產的馬。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-M-R-008"},{"i":"SANK-E-W-R-023","pid":"68585060692001821875","h":"九節鞭","s":"九节鞭","cat":"武器","sub":"","y":"R","fac":"","e":"","a":239,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-R-023.webp","intro":"九節鞭，九節相連的軟鞭，收放自如。","full":"九節鞭，九節相連的軟鞭，收放自如。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-R-023"},{"i":"SANK-P-R-496","pid":"31563904388338940020","h":"任峻","s":"任峻","cat":"人物","sub":"文官","y":"R","fac":"蜀漢","e":"木","a":7100,"d":7300,"ev":0,"art":"img/s1/card_SANK-P-R-110.webp","intro":"任峻，字伯達，河南中牟人，東漢末年和曹操勢力的官員","full":"任峻，字伯達，河南中牟人，東漢末年和曹操勢力的官員。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-496"},{"i":"SANK-P-R-142","pid":"20542745326963436430","h":"何夔","s":"何夔","cat":"人物","sub":"文官","y":"R","fac":"蜀漢","e":"木","a":6300,"d":7300,"ev":0,"art":"img/s1/card_SANK-P-C-142.webp","intro":"何夔，字叔龍，陳郡陽夏人。","full":"何夔（？—？），字叔龍，陳郡陽夏人。東漢末及三國時曹魏官員，高祖父為瑯琊國相何英，曾祖父是漢安帝時車騎將軍何熙，曾在永初三年（109年）討伐南單于。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-142"},{"i":"SANK-P-R-146","pid":"86748929381284660314","h":"何晏","s":"何晏","cat":"人物","sub":"武將","y":"R","fac":"蜀漢","e":"木","a":6500,"d":6100,"ev":0,"art":"img/s1/card_SANK-P-C-146.webp","intro":"何晏，字平叔，南陽宛人，在高平陵之變與曹爽等同被司馬氏誅殺。","full":"何晏，字平叔，南陽宛人，東漢末年大將軍何進孫，曹操的婿養子，三國時期玄學家，魏晉玄學貴無派創始人，與王弼並稱「王何」，玄學代表人物之一，在高平陵之變與曹爽等同被司馬氏誅殺，卒於正始十年。何晏以俊美著稱，有何郎粉、傅粉何郎之語，代指美男子。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-146"},{"i":"SANK-P-R-79","pid":"69151365167162492155","h":"何曾","s":"何曾","cat":"人物","sub":"文官","y":"R","fac":"蜀漢","e":"木","a":6400,"d":6700,"ev":0,"art":"img/s1/card_SANK-P-R-79.webp","intro":"何曾，字穎考，陳國陽夏縣人","full":"何曾（199年—279年1月12日），字穎考，陳國陽夏縣人。三國時曹魏及西晉官員，曹魏太僕何夔之子，東漢車騎將軍何熙的玄孫。為人好學博聞，與袁侃齊名。在晉歷任太保、太傅、太宰。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-79"},{"i":"SANK-P-R-139","pid":"58426215726098732403","h":"何進","s":"何进","cat":"人物","sub":"","y":"R","fac":"東吳","e":"金","a":6700,"d":6800,"ev":0,"art":"img/s1/card_SANK-P-R-139.webp","intro":"大將軍，召董卓入京","full":"何進（？—189年9月22日），字遂高，南陽宛縣（今河南省南陽市）人，東漢末年外戚，官至大將軍，錄尚書事，封慎侯。何進為了對付十常侍而召董卓率軍隊入京，成為東漢末年直至三國割據的重要事件之一，而自己也被十常侍殺死。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-139"},{"i":"SANK-E-W-R-013","pid":"47174555838080086378","h":"破倚天劍","s":"破倚天剑","cat":"武器","sub":"","y":"R","fac":"","e":"","a":239,"d":null,"ev":null,"art":"img/s1/card_SANK-E-W-R-013.webp","intro":"破倚天劍，破損的倚天劍，見於《三國演義》。","full":"破倚天劍，破損的倚天劍，見於《三國演義》。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-W-R-013"},{"i":"SANK-P-R-138","pid":"44686757930776428951","h":"傅巽","s":"傅巽","cat":"人物","sub":"文官","y":"R","fac":"東吳","e":"水","a":6200,"d":6300,"ev":0,"art":"img/s1/card_SANK-P-R-138.webp","intro":"傅巽，字公悌，雍州北地泥陽人。","full":"傅巽（？—3世紀？），字公悌，雍州北地泥陽（今陝西耀縣東南）人。傅介子之後，曾任東漢東曹掾，後於荊州牧劉表帳下為賓客，荊州降曹操後歷任曹魏的散騎常侍、侍中、尚書。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-138"},{"i":"SANK-P-R-160","pid":"49808633659728356435","h":"全皇后","s":"全皇后","cat":"人物","sub":"君主宗室","y":"R","fac":"蜀漢","e":"木","a":6800,"d":7800,"ev":0,"art":"img/s1/card_SANK-P-C-160.webp","intro":"全皇后，名不詳，揚州吳郡錢塘人，吳廢帝孫亮之皇后","full":"全皇后，名不詳，揚州吳郡錢塘人，吳廢帝孫亮之皇后。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-160"},{"i":"SANK-P-R-162","pid":"50498186127408039761","h":"全端","s":"全端","cat":"人物","sub":"武將","y":"R","fac":"東吳","e":"水","a":7200,"d":7300,"ev":0,"art":"img/s1/card_SANK-P-R-162.webp","intro":"全端，吳郡錢塘人，全琮從子。","full":"全端（？—？），吳郡錢塘（今浙江省杭州市）人，全琮從子。東吳將軍。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-162"},{"i":"SANK-P-R-28","pid":"05299916534275579025","h":"公孫度","s":"公孙度","cat":"人物","sub":"君主宗室","y":"R","fac":"群雄","e":"土","a":7300,"d":7400,"ev":0,"art":"img/s1/card_SANK-P-R-28.webp","intro":"公孫度，字升濟，遼東襄平人，東漢末割據遼東的軍閥。","full":"公孫度（150年—204年），字升濟（一作叔濟），幼名阿豹，幽州遼東襄平人，東漢末年割據於遼東地區的軍閥。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-28"},{"i":"SANK-P-R-26","pid":"40269334211972102010","h":"公孫康","s":"公孙康","cat":"人物","sub":"君主宗室","y":"R","fac":"群雄","e":"土","a":7300,"d":7400,"ev":0,"art":"img/s1/card_SANK-P-R-26.webp","intro":"公孫康，遼東郡襄平縣人","full":"公孫康（2世紀—3世紀），遼東郡襄平縣（今遼寧省遼陽市區）人。東漢末年，割據於遼東地區的軍閥。公孫度之子，公孫恭之兄。最著名事蹟是將袁熙、袁尚首級送與曹操。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-26"},{"i":"SANK-P-R-171","pid":"00447507342092194027","h":"冷苞","s":"冷苞","cat":"人物","sub":"武將","y":"R","fac":"蜀漢","e":"木","a":7600,"d":7300,"ev":0,"art":"img/s1/card_SANK-P-C-171.webp","intro":"冷苞，又名泠苞，東漢末年益州牧劉璋的武將","full":"冷苞，又名泠苞，東漢末年益州牧劉璋的武將。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-171"},{"i":"SANK-E-A-R-014","pid":"71407210282879102453","h":"刀牌手甲","s":"刀牌手甲","cat":"鎧甲","sub":"","y":"R","fac":"","e":"","a":null,"d":243,"ev":null,"art":"img/s1/card_SANK-E-A-R-014.webp","intro":"刀牌手甲，刀盾兵所穿的輕甲。","full":"刀牌手甲，刀盾兵所穿的輕甲。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-E-A-R-014"},{"i":"SANK-P-R-201","pid":"91092886477751580379","h":"劉伶","s":"刘伶","cat":"人物","sub":"","y":"R","fac":"蜀漢","e":"木","a":7300,"d":6300,"ev":0,"art":"img/s1/card_SANK-P-R-201.webp","intro":"劉伶，字伯倫，沛國人，「竹林七賢」之一。","full":"劉伶（約221年—300年），字伯倫，沛國（今安徽宿縣）人，「竹林七賢」之一。曾為建威參軍。晉武帝泰始初，對朝廷策問，強調無為而治，以無能罷免。平生嗜酒，曾作《酒德頌》，宣揚老莊思想和縱酒放誕之情趣，對傳統「禮法」表示蔑視。","wiki":"https://seanown.org/mylegends-wiki.html#SANK-P-R-201"},{"i":"SANK-P-R-137","pid":"42552261581374718792","h":"劉先","s":"刘先","cat":"人物","sub":"","y":"R","fac":"東吳","e":"水","a":6300,"d":6700,"ev":0,"ar
