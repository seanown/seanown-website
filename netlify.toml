# Netlify 部署配置 — SEAN OWN 個人品牌官網（純靜態版）
# 純 HTML/CSS/JS，無構建步驟，push 即自動部署（不再用 Astro build）

[build]
  publish = "."

# Netlify Forms 聯繫表單聲明（零後端，免費 100 條/月）
[[forms]]
  name = "contact"
  fields = [
    { name = "name", label = "姓名", required = true },
    { name = "organization", label = "所屬單位" },
    { name = "email", label = "聯繫信箱", required = true },
    { name = "coop_type", label = "合作類型", required = true },
    { name = "message", label = "需求描述", required = true }
  ]

# 靜態資源長效緩存（性能優化）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 不緩存，確保內容即時更新
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 安全標頭
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Decap CMS 後台 — admin/ 目錄保留
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# 舊「協會身分」頁 301 永久重定向 → 關於我（SEO 保護，不產生 404）
[[redirects]]
  from = "/association"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/associations"
  to = "/about"
  status = 301
  force = true

# 新網址架構：/about /column /works /contact → SPA 路由（200 rewrite，URL 保持不變）
[[redirects]]
  from = "/about"
  to = "/"
  status = 200

[[redirects]]
  from = "/column"
  to = "/"
  status = 200

[[redirects]]
  from = "/works"
  to = "/"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/"
  status = 200
