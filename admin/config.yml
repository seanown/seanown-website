backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "posts"
    label: "文章管理"
    files:
      - name: "posts"
        label: "所有文章"
        file: "data/posts.json"
        fields:
          - label: "文章列表"
            name: "posts"
            widget: "list"
            fields:
              - { label: "標題", name: "title", widget: "string" }
              - label: "分類"
                name: "category"
                widget: "select"
                options: ["AI前瞻", "灣區澳門", "商道思辨"]
              - { label: "日期", name: "date", widget: "datetime" }
              - { label: "摘要", name: "excerpt", widget: "text" }
              - { label: "圖標(emoji)", name: "icon", widget: "string", required: false }
              - { label: "正文", name: "body", widget: "markdown" }

  - name: "media"
    label: "媒體報導"
    files:
      - name: "media"
        label: "所有報導"
        file: "data/media.json"
        fields:
          - label: "報導列表"
            name: "media"
            widget: "list"
            fields:
              - { label: "標題", name: "title", widget: "string" }
              - { label: "來源", name: "source", widget: "string" }
              - { label: "日期", name: "date", widget: "datetime" }
              - { label: "連結URL", name: "url", widget: "string" }
