function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function pad3(n){ return (n < 10 ? "00" : n < 100 ? "0" : "") + n; }
function on(name, fn){ document.addEventListener(name, fn, {passive:true}); }

/* ── 渲染各區塊 ── */
function renderStatus(){
  var b = D.book, s = b.status;
  if (!s || !s.isDraft) return "";
  return '<div class="status-bar"><span class="dot"></span>' +
         '<b>' + esc(s.label) + '</b><span>' + esc(s.note) + '</span></div>';
}

function renderHero(){
  var b = D.book;
  var facts = b.stats.map(function(f){
    return '<div class="fact"><b>' + esc(f.num) + '</b><span>' + esc(f.unit) +
           '<br>' + esc(f.label) + '</span></div>';
  }).join("");
  return '<section class="hero">' +
    '<div class="cover-img"><img src="' + esc(b.cover.src) + '" width="' + b.cover.width +
      '" height="' + b.cover.height + '" alt="《' + esc(b.title) + '——' + esc(b.subtitle) +
      '》封面：夜色中的東望洋燈塔，光束照亮騎樓屋頂與膠片帶，穿制服的守燈人坐在石牆上"></div>' +
    '<div>' +
      '<div class="badge-new">📕 ' + esc(b.status.label) +
        (b.status.isDraft ? ' · <b>定稿中</b> · 可在線試閱' : ' · 可在線翻閱') + '</div>' +
      '<h1>' + esc(b.title) + '</h1>' +
      '<p class="subtitle">' + esc(b.subtitle) + '</p>' +
      '<p class="byline"><b>' + esc(b.author) + ' ' + esc(b.authorEn) + '</b> 著 ｜ ' +
        esc(b.publisher) + ' 出版' + (b.pubYear ? ' ｜ ' + (b.status.isDraft ? '預計 ' : '') +
        esc(b.pubYear) + ' 年' +
        (b.pubMonth ? ' ' + b.pubMonth + ' 月' : '') : '') + '</p>' +
      '<div class="rule"></div>' +
      '<p class="lead">' + esc(b.lede) + '</p>' +
      '<div class="facts">' + facts + '</div>' +
      '<div class="cta-row">' +
        '<button class="btn btn-primary" onclick="jumpToRead()">📖 開始試閱全書</button>' +
        '<a class="btn btn-ghost" href="#sec-toc">查看完整目錄</a>' +
      '</div>' +
    '</div></section>';
}

function renderSpread(){
  var c = D.book.cover;
  var SEGS = c.spreadSegments || [[100,"封面內頁"],[148,"封面"],[15,"書脊"],[148,"封底"],[100,"封底內頁"]];
  var cells = SEGS.map(function(s){
    var mm = s.mm !== undefined ? s.mm : s[0];
    var nm = s.name || s[1];
    var ds = s.desc ? '<div class="d">' + esc(s.desc) + '</div>' : "";
    var hl = (mm === 15) ? " hl" : "";
    return '<div class="spec-item' + hl + '"><div class="w">' + mm +
           '<small>mm</small></div><div class="l">' + esc(nm) + ds + '</div></div>';
  }).join("");
  var total = SEGS.reduce(function(a,s){ return a + (s.mm !== undefined ? s.mm : s[0]); }, 0);
  return '<section class="sec">' +
    '<div class="sec-head"><h2>📐 書殼展開圖</h2>' +
      '<p>' + esc(c.spreadSpec) + '</p></div>' +
    '<div class="card">' +
      '<div class="spread-wrap"><img src="' + esc(c.spread) + '" alt="《' + esc(D.book.title) +
        '》書殼展開圖：封面內頁、封面、書脊、封底、封底內頁依序排列" width="2213" height="910" loading="lazy"></div>' +
      '<div class="spec-grid">' + cells + '</div>' +
      '<p class="spec-note"><b>合計 ' + total + 'mm</b> ＝ 100＋148＋15＋148＋100，與設計稿展開尺寸完全相符。' +
        '書脊 15mm 處於常見 12–18mm 區間；裝訂方式為<b>右翻書</b>（鎖線膠裝），書脊在右、翻頁方向由右至左。' +
        '<b>付印前需向出版社確認是否要求 3mm 出血</b>（出血版應為 517 × 216mm）；封底右下角白框為 ISBN 條碼預留位，取得書號後始排入。</p>' +
    '</div></section>';
}

function renderPreface(){
  var p = D.preface;
  if (!p || !p.paragraphs || !p.paragraphs.length) return "";
  var ps = p.paragraphs.map(function(t){ return "<p>" + esc(t) + "</p>"; }).join("");
  return '<section class="sec"><div class="sec-head"><h2>📖 ' + esc(p.label) + '</h2>' +
    '<p>' + esc(p.source) + '</p></div>' +
    '<div class="card preface"><div class="quote-mark">「</div>' + ps +
    '<div class="sign">—— ' + esc(p.signature) + '</div></div></section>';
}

/* 推薦序：blocks 為空時顯示「撰寫中」提示，有資料則逐條渲染 */
function renderEndorsements(){
  var e = D.endorsements;
  var blocks = (e && e.blocks) ? e.blocks : [];
  var body;
  if (!blocks.length) {
    body = '<div class="pending"><b>推薦序撰寫中</b>' +
           esc((e && e.note) ? e.note : "") + '</div>';
  } else {
    body = blocks.map(function(b){
      var av = b.avatar
        ? '<img src="' + esc(b.avatar) + '" alt="' + esc(b.name) + '" loading="lazy">'
        : "";
      var src = b.source ? '<p class="src">' + esc(b.source) + '</p>' : "";
      return '<div class="endorse">' +
        (b.role ? '<span class="endorse-role role">' + esc(b.role) + '</span>' : "") +
        '<blockquote>' + esc(b.quote) + '</blockquote>' +
        '<div class="who">' + av + '<div><div class="nm">' + esc(b.name) + '</div>' +
          '<div class="rl">' + esc(b.title || "") + '</div></div></div>' +
        src + '</div>';
    }).join("");
  }
  return '<section class="sec" id="sec-endorse"><div class="sec-head">' +
    '<h2>✍️ 推薦序</h2><p>由哪些人推薦這本書</p></div>' + body + '</section>';
}

function renderToc(){
  var t = D.toc;
  var parts = t.parts.map(function(p, pi){
    var items = p.items.map(function(it, i){
      return '<li onclick="goToReader(' + (it.page + D.reader.pageOffset) + ')"' +
             ' title="點擊跳至第 ' + (it.page + D.reader.pageOffset) + ' 頁">' +
             '<span class="no">' + (i+1) + '</span>' +
             '<span class="tt">《' + esc(it.title) + '》</span>' +
             '<span class="yy">' + it.year + '</span>' +
             '<span class="pp">P' + it.page + '</span></li>';
    }).join("");
    return '<div class="toc-part"' + (pi ? ' style="margin-top:26px"' : '') + '>' +
      '<div class="toc-part-h"><span class="pn">' + esc(p.label) + '</span>' +
      '<span class="pt">' + esc(p.title) + '</span>' +
      '<span class="py">' + esc(p.years) + ' · ' + esc(p.count) + '</span></div>' +
      '<ul class="toc-list">' + items + '</ul></div>';
  }).join("");
  var ap = t.appendices.map(function(a){
    return '<a onclick="goToReader(' + (a.page + D.reader.pageOffset) + ');return false">' +
           '<span>' + esc(a.label) + '</span><span>P' + a.page + '</span></a>';
  }).join("");
  return '<section class="sec" id="sec-toc"><div class="sec-head"><h2>🗂 完整目錄</h2>' +
    '<p>' + esc(t.note) + '</p><span class="hint">👆 點任一行可直接跳至該篇開頁</span></div>' +
    '<div class="card">' + parts + '<div class="toc-append">' + ap + '</div></div></section>';
}

function renderReader(){
  var R = D.reader;
  return '<section class="sec" id="sec-reader"><div class="sec-head">' +
    '<h2>📖 在線翻閱</h2><p>全書 ' + R.total + ' 頁，逐頁閱讀。輸入頁碼可直接跳至指定頁面。' +
    '本書為<b>右翻書</b>（書脊在右），翻頁由右至左：鍵盤 ← 或手機向左滑＝下一頁，→ ＝上一頁。</p></div>' +
    '<div class="reader"><div class="reader-bar">' +
      '<button class="rbtn" id="next" onclick="go(1)" title="下一頁（←）" aria-label="下一頁">‹</button>' +
      '<div class="rinfo">第 <b id="cur">1</b> / <span id="total">' + R.total + '</span> 頁</div>' +
      '<button class="rbtn" id="prev" onclick="go(-1)" title="上一頁（→）" aria-label="上一頁">›</button>' +
      '<div class="jump"><input type="number" id="jinput" placeholder="頁碼" min="1" max="' + R.total +
        '" aria-label="跳至頁碼"><button onclick="jumpTo()">前往</button></div>' +
      '<button class="zbtn" id="zwide" onclick="toggleZoom()" title="單頁／雙頁切換">雙頁</button>' +
      '<button class="zbtn" id="zfit" onclick="toggleFit()" title="適合寬度／適合整頁">適合整頁</button>' +
    '</div><div class="progress-outer"><div class="progress-in" id="prog"></div></div>' +
    '<div class="reader-stage" id="stage"><div class="page-skel" id="skel">載入中…</div>' +
    '<img class="page-img" id="page" alt="" style="display:none"></div>' +
    '<div class="reader-foot"><span id="foot-left"></span>' +
    '<span>內頁版權所有 · 歡迎引用與教學使用</span></div></div></section>';
}

function renderAuthor(){
  var a = D.authorProfile;
  return '<section class="sec"><div class="sec-head"><h2>✍️ 作者簡介</h2>' +
    '<p>' + esc(a.name) + ' ' + esc(a.nameEn) + '</p></div><div class="card">' +
    '<div class="author-box"><img src="' + esc(a.avatar) + '" width="120" height="120" alt="' +
      esc(a.name) + ' 大頭照" loading="lazy"><div>' +
      '<div class="author-name">' + esc(a.name) + '</div>' +
      '<div class="author-en">' + esc(a.region) + '</div>' +
      '<div class="author-bio">' + esc(a.bio) + '</div>' +
      (a.bio2 ? '<div class="author-bio">' + esc(a.bio2) + '</div>' : "") +
      (a.bio3 ? '<div class="author-bio">' + esc(a.bio3) + '</div>' : "") +
      (a.bookline ? '<div class="bookline">' + esc(a.bookline) + '</div>' : "") +
    '</div></div></div></section>';
}

function renderPub(){
  var items = D.pubInfo.items.map(function(i){
    return '<div class="pub-item"><dt>' + esc(i.dt) + '</dt><dd>' + esc(i.dd) +
           (i.sub ? "<small>" + esc(i.sub) + "</small>" : "") + '</div>';
  }).join("");
  // 書號：未取得時顯示待補欄位
  var isbn = D.book.isbn || {};
  var iMain = isbn.value ? esc(isbn.value) : "書號待補";
  items += '<div class="pub-item tbd"><dt>ISBN</dt><dd>' + iMain +
           (isbn.note && isbn.note !== iMain ? "<small>" + esc(isbn.note) + "</small>" : "") + '</div>';
  var price = D.book.price || {};
  var pMain = price.list ? esc(price.list) + " " + esc(price.currency || "") : "待出版社核定";
  items += '<div class="pub-item tbd"><dt>定價</dt><dd>' + pMain +
           (price.note && price.note !== pMain ? "<small>" + esc(price.note) + "</small>" : "") + '</div>';
  var buy = D.book.buy || {};
  var cta = '<div class="cta-row" style="margin-top:22px">' +
    '<a class="btn btn-primary" href="' + esc(buy.contactHref || "/#sec-contact") + '">' +
    '📮 ' + esc(buy.contactLabel || "洽詢購書與合作") + '</a>' +
    (buy.enabled ? "" : '<span style="font-size:13.5px;color:var(--gray);align-self:center">' +
      esc(buy.note || "") + '</span>') + '</div>';
  return '<section class="sec"><div class="sec-head"><h2>📋 出版資訊</h2>' +
    '<p>規格與出版資料。書號與定價於付印後補上。</p></div>' +
    '<dl class="pub-grid">' + items + '</dl>' + cta + '</section>';
}

function renderRelated(){
  var cards = D.relatedFilms.map(function(f){
    return '<a class="rel" href="/article/' + esc(f.slug) + '/">' +
      '<img src="/assets/og/' + esc(f.slug) + '-poster.jpg" alt="《' + esc(f.title) +
      '》海報" loading="lazy" width="1024" height="1536">' +
      '<div class="rel-b"><h3>《' + esc(f.title) + '》觀後感</h3><span>' + f.year +
      ' · 澳門電影專輯</span></div></a>';
  }).join("");
  return '<section class="sec"><div class="sec-head"><h2>🎬 相關電影專輯</h2>' +
    '<p>書中提到的電影，網站上都有單篇觀後感與取景地打卡點。</p></div>' +
    '<div class="rel-grid">' + cards + '</div></section>';
}

/* ── 翻閱器邏輯 ── */
function pageSrc(n){
  var v = D.reader.version || "";
  if (v && v.charAt(0) !== "?") v = "?" + v;   // 避免缺少 ? 導致檔名被污染
  return D.reader.pageBase + pad3(n) + ".webp" + v;
}

function show(n){
  var T = D.reader.total;
  n = Math.max(1, Math.min(T, n));
  cur = n;
  document.getElementById("cur").textContent = n;
  document.getElementById("jinput").value = n;
  document.getElementById("prog").style.width = (n / T * 100) + "%";
  document.getElementById("prev").disabled = (n <= 1);
  document.getElementById("next").disabled = (n >= T);
  var L = D.reader.pageLabels;
  document.getElementById("foot-left").textContent =
    L[String(n)] || ("第 " + n + " 頁 · 書內頁碼 P" + (n - D.reader.pageOffset));

  var img = document.getElementById("page"), skel = document.getElementById("skel");
  var src = pageSrc(n);
  if (loaded === n && img.style.display !== "none") return;
  loaded = n;
  img.style.display = "none"; skel.style.display = "flex";
  skel.textContent = "載入中…";
  var probe = new Image();
  probe.onload = function(){
    if (loaded !== n) return;
    img.src = src; img.alt = "《" + D.book.title + "》第 " + n + " 頁";
    skel.style.display = "none"; img.style.display = "block";
    preload(n + 1); preload(n + 2);
  };
  probe.onerror = function(){
    if (loaded !== n) return;
    skel.textContent = "第 " + n + " 頁暫時無法載入，請稍後再試。";
  };
  probe.src = src;
}

function preload(n){
  if (n < 1 || n > D.reader.total) return;
  var p = new Image(); p.src = pageSrc(n);
}

function go(d){ show(cur + d); }
function jumpTo(){
  var v = parseInt(document.getElementById("jinput").value, 10);
  if (!isNaN(v)) show(v);
}
function jumpToRead(){
  show(1);
  document.getElementById("sec-reader").scrollIntoView({behavior:"smooth"});
}
function goToReader(pdfPage){
  show(pdfPage);
  document.getElementById("sec-reader").scrollIntoView({behavior:"smooth"});
}
function toggleZoom(){
  wide = !wide;
  document.getElementById("stage").classList.toggle("narrow", !wide);
  var z = document.getElementById("zwide");
  z.textContent = wide ? "雙頁" : "單頁";
  z.classList.toggle("on", !wide);
  show(cur);
}
function toggleFit(){
  fit = !fit;
  document.getElementById("page").style.maxHeight = fit ? "none" : "";
  var z = document.getElementById("zfit");
  z.textContent = fit ? "適合寬度" : "適合整頁";
  z.classList.toggle("on", fit);
}

/* ── 啟動 ── */
function boot(data){
  D = data;
  document.getElementById("app").innerHTML =
    renderStatus() + renderHero() + renderSpread() + renderPreface() +
    renderEndorsements() + renderReader() + renderToc() +
    renderAuthor() + renderPub() + renderRelated() +
    '<footer><p>《' + esc(D.book.title) + '——' + esc(D.book.subtitle) + '》© ' +
      esc(D.book.author) + ' ' + esc(D.book.authorEn) + ' ｜ ' +
      esc(D.book.publisher) + ' 出版</p>' +
    '<p style="margin-top:10px"><a href="/">返回首頁</a> · ' +
      '<a href="/series/macau-film/">澳門電影專輯（83 篇）</a> · ' +
      '<a href="/articles/">專欄文章</a></p></footer>';

  document.addEventListener("keydown", function(e){
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft"){ go(1); e.preventDefault(); }   // 右翻書：由右至左
    if (e.key === "ArrowRight"){ go(-1); e.preventDefault(); }
    if (e.key === "Home"){ show(1); e.preventDefault(); }
    if (e.key === "End"){ show(D.reader.total); e.preventDefault(); }
  });

  var st = document.getElementById("stage");
  var tx = 0, ty = 0;
  st.addEventListener("touchstart", function(e){
    tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
  }, {passive:true});
  st.addEventListener("touchend", function(e){
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    // 右翻書：向左滑＝翻下一頁
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1);
  }, {passive:true});

  on("scroll", function(){
    document.getElementById("backtop").classList.toggle("show", window.scrollY > 600);
  });

  show(1);
}

fetch(DATA_URL, {cache:"no-cache"})
  .then(function(r){
    if (!r.ok) throw new Error(r.status + " " + r.statusText);
    return r.json();
  })
  .then(boot)
  .catch(function(err){
    document.getElementById("app").innerHTML =
      '<div class="nojs" style="margin-top:30px"><b>書籍資料載入失敗</b><br>' +
      esc(err.message) + '<br><br>請確認 <code>/data/book-sy-deng-ren.json</code> 已上傳，' +
      '或稍後重新整理頁面。</div>';
    console.error("[book] load failed:", err);
  });
</script>
